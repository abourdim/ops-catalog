["ghost-box","agt-ult","ghost-box","Complete SIGINT in Pelican case: Pi, HackRF, WiFi, RTL-SDR, GPS, antenna, battery, touchscreen. Unified C2.","Système SIGINT complet dans une valise Pelican : Pi, HackRF, WiFi, RTL-SDR, GPS, antenne, batterie et écran tactile. Centre de commandement C2 unifié et mobile.","نظام استخبارات إشارات (SIGINT) كامل في حقيبة Pelican: Pi وHackRF وWiFi وRTL-SDR وGPS وهوائي وبطارية وشاشة لمس. مركز قيادة وتحكم موحد."],
["safe-house-kit","agt-ult","safe-house-kit","Pi secures location: cameras, RF sweep, WiFi monitoring, perimeter sensors, encrypted comms, Faraday-tested entries.","Pi sécurise une planque : caméras de surveillance, balayage RF, monitoring WiFi, capteurs de périmètre et communications chiffrées. Sanctuaire opérationnel.","Pi يؤمّن الملاذ الآمن: كاميرات مراقبة ومسح ترددات وراقبة WiFi ومستشعرات محيطية واتصالات مشفرة ومداخل مختبرة بعزل فاراداي."],
["agent-onboarding","agt-ult","agent-onboarding","20 lessons: encryption, comms, counter-surveillance, RF awareness. Hands-on with real hardware. Graduate certified.","Formation agent en 20 leçons : chiffrement, communications sécurisées, contre-surveillance et maîtrise RF. Exercices pratiques sur matériel réel avec certification.","20 درساً تدريبياً شاملاً: التشفير والاتصالات الآمنة ومكافحة المراقبة والوعي بالترددات الراديوية. تدريب عملي بأجهزة حقيقية مع شهادة تخرج."],
["red-team-toolkit","agt-ult","red-team-toolkit","Offensive security: Pi recon (WiFi+RF+BLE), ESP32 active tools (honeypot, rogue AP), micro:bit physical access.","Boîte à outils Red Team : Pi pour la reconnaissance (WiFi, RF, BLE), ESP32 pour les outils actifs (honeypot, AP pirate) et micro:bit pour l'accès physique.","حزمة أمن سيبراني هجومي (فريق أحمر): استطلاع Pi للشبكات والترددات وأدوات ESP32 النشطة ووصول فعلي بـ micro:bit. المتصفح ينسق كل المراحل."],
["blue-team-sentinel","agt-ult","blue-team-sentinel","Defensive: Pi monitors all frequencies/networks, detects anomalies, identifies attacks, auto-deploys countermeasures.","Sentinelle Blue Team défensive : Pi surveille toutes les fréquences et réseaux, détecte les anomalies, identifie les attaques et déploie les contre-mesures.","حارس الفريق الأزرق الدفاعي: Pi يراقب جميع الترددات والشبكات ويكشف الشذوذ تلقائياً ويحدد نوع الهجوم وينشر الإجراءات المضادة المناسبة."],
["mission-impossible-box","agt-ult","mission-impossible-box","Self-destructing briefing: Pi displays mission, timer counts, micro:bit confirms identity. Tamper = instant wipe.","Briefing auto-destructeur : Pi affiche la mission avec compte à rebours, micro:bit authentifie l'agent. Toute tentative de sabotage déclenche un effacement total.","إحاطة مهمة ذاتية التدمير: Pi يعرض تفاصيل المهمة مع عداد تنازلي وmicro:bit يتحقق من هوية العميل. أي محاولة عبث تُفعّل مسحاً فورياً للبيانات."],
["mobile-command","agt-ult","mobile-command","Vehicle-mounted: Pi + HackRF + roof antenna + GPS + 4G. Drive mapping RF, WiFi, BLE, cellular. War-driving evolved.","Poste de commandement mobile véhiculé : Pi + HackRF + antenne toit + GPS + 4G. Cartographiez RF, WiFi, BLE et cellulaire en roulant. War-driving nouvelle génération.","مركز قيادة متنقل مركّب على مركبة: Pi + HackRF + هوائي سقف + GPS + 4G. قُد وارسم خريطة حية للترددات وWiFi وBLE والشبكات الخلوية."],
// === GENIUS CATEGORIES (43-50) ===
["body-antenna","bio-radio","body-antenna","Use human body as 1.8MHz receiving antenna. Measure impedance changes with posture and grounding.","Utilisez le corps humain comme antenne réceptrice à 1.8 MHz. Mesurez les variations d'impédance selon la posture et le type de mise à la terre. Bio-radio fascinant.","استخدم الجسم البشري كهوائي استقبال على تردد 1.8 ميجاهرتز. قس تغيرات المعاوقة الكهربائية مع وضعية الجسم ونوع التأريض. راديو حيوي فريد."],
["heartbeat-cipher","bio-radio","heartbeat-cipher","Encrypt messages using heartbeat R-R intervals as a biometric one-time pad. Unbreakable and unique.","Chiffrez les messages en utilisant les intervalles R-R cardiaques comme masque jetable biométrique. Clé de chiffrement unique et inreproductible issue de votre cœur.","شفّر الرسائل باستخدام الفواصل الزمنية R-R بين نبضات القلب كدفتر تشفير بيومتري لمرة واحدة. مفتاح تشفير فريد وغير قابل للتكرار من جسمك."],
["brainwave-radio","bio-radio","brainwave-radio","Transmit EEG brainwave patterns via micro:bit radio. Think a command, send it wirelessly.","Transmettez les motifs d'ondes cérébrales EEG par radio micro:bit. Pensez une commande et envoyez-la sans fil. Interface cerveau-radio expérimentale fascinante.","أرسل أنماط موجات الدماغ الكهربائية (EEG) لاسلكياً عبر راديو micro:bit. فكّر بأمر محدد وأرسله كإشارة راديو. واجهة دماغ-راديو تجريبية."],
["skin-galvanic-key","bio-radio","skin-galvanic-key","Generate encryption keys from skin conductance response. Your stress level IS the key.","Générez des clés de chiffrement à partir de la réponse galvanique de la peau. Votre niveau de stress physiologique devient le secret cryptographique lui-même.","أنشئ مفاتيح تشفير من استجابة التوصيل الكلفاني للجلد. مستوى توترك الفسيولوجي هو مفتاح التشفير ذاته. تشفير بيومتري شخصي فريد."],
["breath-modulator","bio-radio","breath-modulator","Modulate RF carrier with breathing pattern for covert communication. Inhale=1, exhale=0.","Modulez une porteuse RF avec votre rythme respiratoire pour une communication clandestine : inspiration=1, expiration=0. Canal bio-radio totalement furtif.","عدّل حامل التردد الراديوي بنمط التنفس لاتصال سري: الشهيق يمثل الرقم 1 والزفير يمثل الرقم 0. قناة اتصال حيوية خفية لا يشتبه بها أحد."],
["muscle-telegraph","bio-radio","muscle-telegraph","EMG sensors translate muscle twitches to Morse code via micro:bit. Flex to transmit.","Capteurs EMG traduisant les contractions musculaires en code Morse via micro:bit. Contractez un muscle pour transmettre. Télégraphe musculaire sans fil innovant.","مستشعرات التخطيط الكهربائي للعضلات (EMG) تترجم ارتعاشات العضلات إلى شفرة مورس عبر micro:bit. اشد عضلتك لتُرسل. تلغراف عضلي لاسلكي."],
["thermal-signature","bio-radio","thermal-signature","Detect humans through walls by their RF thermal noise emissions at microwave frequencies.","Détectez la présence humaine à travers les murs en captant le rayonnement thermique RF émis naturellement par le corps aux fréquences micro-ondes. Vision thermique radio.","اكشف وجود البشر عبر الجدران من خلال رصد انبعاثات الضوضاء الحرارية الراديوية لأجسامهم بترددات الميكروويف. رؤية حرارية بالراديو."],
["walking-gait-id","bio-radio","walking-gait-id","Identify people by WiFi CSI distortions caused by unique walking patterns. No cameras needed.","Identifiez les personnes par les distorsions WiFi CSI causées par leur démarche unique. Empreinte biométrique de marche sans caméra ni dispositif porté sur le corps.","حدد هوية الأشخاص من تشوهات معلومات حالة قناة WiFi (CSI) الناجمة عن أنماط مشيهم الفريدة. بصمة حركية بدون كاميرات أو أجهزة ارتداء."],
["gesture-radio","bio-radio","gesture-radio","Hand gestures modulate BLE signal patterns for covert sign language over radio.","Les gestes de la main modulent les motifs de signaux BLE pour créer un langage des signes secret transmis par radio. Communication gestuelle invisible et furtive.","حركات اليد والإيماءات تعدّل أنماط إشارات البلوتوث منخفض الطاقة (BLE) لإنشاء لغة إشارة سرية تُبث عبر الراديو دون لفت الانتباه."],
["pupil-morse","bio-radio","pupil-morse","Camera detects pupil dilation patterns as encoded Morse messages. Blink-free covert comms.","La caméra détecte les variations de dilatation pupillaire et les interprète comme des messages Morse codés. Communication secrète sans clignement, uniquement par le regard.","الكاميرا تكشف أنماط توسّع وانقباض بؤبؤ العين وتترجمها كرسائل مورس مشفرة. اتصال سري بدون رمش — فقط تفاعل البؤبؤ اللاإرادي."],
["heartbeat-mesh","bio-radio","heartbeat-mesh","Synchronize micro:bit mesh network using heartbeat as distributed clock. Bio-synchronized swarm.","Synchronisez un réseau maillé micro:bit en utilisant le rythme cardiaque comme horloge distribuée naturelle. Essaim bio-synchronisé sans oscillateur électronique central.","زامن شبكة micro:bit الشبكية باستخدام إيقاع نبضات القلب كساعة موزعة طبيعية. سرب أجهزة متزامن حيوياً بدون ساعة إلكترونية مركزية."],
["sweat-sensor-crypto","bio-radio","sweat-sensor-crypto","Derive encryption seeds from sweat chemistry + body temperature. Truly personal crypto.","Dérivez des graines cryptographiques de la composition chimique de la sueur et de la température corporelle. Chiffrement véritablement personnel issu de votre biochimie.","استخلص بذور تشفير فريدة من التركيب الكيميائي للعرق ودرجة حرارة الجسم. تشفير بيومتري شخصي بحق — مفاتيحك مشتقة من كيمياء جسدك."],
["voice-rf-fingerprint","bio-radio","voice-rf-fingerprint","Create unique RF authentication signatures from voice harmonics. Speak to unlock.","Créez des signatures RF d'authentification uniques à partir des harmoniques de votre voix. Parlez pour générer un jeton radio biométrique impossible à reproduire.","أنشئ بصمات ترددية فريدة للمصادقة الآمنة من التوافقيات الصوتية لصوتك. انطق كلمة المرور لتولّد توقيع RF فريد لا يمكن تقليده."],
["nerve-impulse-detector","bio-radio","nerve-impulse-detector","Detect nerve impulses using HackRF as ultra-sensitive EMF probe near skin surface.","Détectez les impulsions nerveuses en utilisant HackRF comme sonde de champ électromagnétique ultra-sensible près de la peau. Neurophysiologie par radiofréquence.","اكشف النبضات العصبية باستخدام HackRF كمجس حقل كهرومغناطيسي فائق الحساسية قريب من سطح الجلد. رصد النشاط العصبي بالراديو."],
["phantom-limb-radio","bio-radio","phantom-limb-radio","Detect and catalog RF emissions from prosthetics, implants, and medical devices.","Détectez et cataloguez les émissions radiofréquences involontaires des prothèses, implants médicaux et dispositifs électroniques embarqués dans le corps humain.","اكشف وصنّف الانبعاثات الراديوية الصادرة من الأطراف الاصطناعية والزرعات الطبية والأجهزة الإلكترونية المزروعة في الجسم. فهرسة أجهزة الجسم."],
["ultrasonic-data-link","acoustic","ultrasonic-data-link","Transfer data via 20kHz+ ultrasound between devices. Invisible, inaudible networking.","Transférez des données entre appareils via ultrasons au-delà de 20 kHz. Réseau de communication totalement invisible et inaudible pour l'oreille humaine.","انقل البيانات بين الأجهزة عبر موجات فوق صوتية بتردد أعلى من 20 كيلوهرتز. شبكة اتصالات غير مرئية وغير مسموعة للأذن البشرية تماماً."],
["acoustic-fence","acoustic","acoustic-fence","Ultrasonic perimeter detector using Doppler shift. Detect intruders by their movement.","Détecteur de périmètre ultrasonique exploitant l'effet Doppler. Repérez les intrus par leur seul mouvement, sans caméra. Alarme sonore invisible et discrète.","سياج كشف محيطي بالموجات فوق الصوتية يعتمد على تأثير دوبلر. اكشف المتسللين من حركتهم فقط دون كاميرات. نظام إنذار صوتي غير مرئي."],
["infrasound-detector","acoustic","infrasound-detector","Detect earthquakes, volcanic eruptions, meteors, and nuclear tests via infrasound waves.","Détectez séismes, éruptions volcaniques, météores et essais nucléaires en captant les ondes infrasonores sous 20 Hz. Station géophysique acoustique artisanale.","اكشف الزلازل والانفجارات البركانية والنيازك والتفجيرات النووية عبر رصد الموجات دون الصوتية (تحت 20 هرتز). محطة رصد جيوفيزيائي محلية الصنع."],
["sonar-mapper","acoustic","sonar-mapper","Build 3D room maps using speaker + microphone echolocation like a bat.","Cartographiez une pièce en 3D par écholocation acoustique : haut-parleur et microphone imitent le sonar de la chauve-souris. Reconstruction spatiale par le son.","ابنِ خرائط ثلاثية الأبعاد للغرف باستخدام تقنية تحديد الموقع بالصدى الصوتي عبر مكبر صوت وميكروفون — تماماً مثل نظام سونار الخفاش."],
["audio-steganography","acoustic","audio-steganography","Hide encrypted data inside audio files. Music that secretly carries classified intel.","Cachez des données chiffrées dans des fichiers audio par stéganographie. De la musique parfaitement normale en apparence, transportant secrètement du renseignement.","أخفِ بيانات مشفرة داخل ملفات صوتية عادية المظهر باستخدام تقنية إخفاء المعلومات الصوتية. موسيقى تبدو طبيعية لكنها تحمل معلومات سرية."],
["voice-cloak","acoustic","voice-cloak","Real-time voice transformation that defeats speaker recognition AI. Become anyone.","Transformation vocale en temps réel capable de tromper les systèmes d'intelligence artificielle de reconnaissance du locuteur. Changez d'identité vocale à volonté.","تحويل صوتي في الزمن الحقيقي يخدع أنظمة الذكاء الاصطناعي للتعرف على المتحدث. غيّر بصمتك الصوتية كلياً وتحدث بهوية صوتية جديدة تماماً."],
["acoustic-levitator","acoustic","acoustic-levitator","Control ESP32 ultrasonic transducer array to levitate small objects with standing waves.","Pilotez une matrice de transducteurs ultrasoniques ESP32 pour faire léviter de petits objets grâce aux ondes stationnaires. Physique acoustique spectaculaire.","تحكم بمصفوفة محولات فوق صوتية على ESP32 لرفع أجسام صغيرة في الهواء باستخدام الموجات الواقفة. فيزياء صوتية مذهلة بتطبيق عملي مرئي."],
["glass-laser-mic","acoustic","glass-laser-mic","Detect conversations through windows by analyzing glass vibrations via laser reflection.","Détectez les conversations derrière une vitre en analysant ses micro-vibrations par réflexion laser. Microphone laser éducatif inspiré des techniques de renseignement.","اكشف المحادثات التي تجري خلف النوافذ عن بُعد بتحليل الاهتزازات الدقيقة للزجاج الناجمة عن الصوت. ميكروفون ليزري تعليمي لتقنية التنصت."],
["parametric-speaker","acoustic","parametric-speaker","Directional audio beam — only one person in the room can hear your message.","Haut-parleur paramétrique projetant un faisceau audio ultra-directionnel : une seule personne dans la pièce entend le message, les autres n'entendent rien du tout.","مكبر صوت بارامتري يبث شعاعاً صوتياً موجهاً بدقة — شخص واحد فقط في الغرفة يسمع رسالتك بينما لا يسمع الآخرون شيئاً على الإطلاق."],
["acoustic-keylogger","acoustic","acoustic-keylogger","Identify keystrokes from typing sounds using ML. Attack simulation + defense training.","Identifiez chaque touche frappée au clavier par l'analyse sonore avec apprentissage automatique (ML). Simulation d'attaque acoustique et entraînement à la défense.","حدد ضربات المفاتيح واستنتج الكلمات المكتوبة من تحليل أصوات الطباعة بالتعلم الآلي (ML). محاكاة هجوم + تدريب على تقنيات الدفاع والحماية."],
["dolphin-attack-lab","acoustic","dolphin-attack-lab","Inject ultrasonic voice commands into smartphones. Educational attack + defense lab.","Injectez des commandes vocales ultrasoniques inaudibles dans les smartphones pour activer l'assistant vocal secrètement. Laboratoire éducatif attaque Dolphin + défense.","أدخل أوامر صوتية فوق صوتية غير مسموعة في الهواتف الذكية لتفعيل المساعد الصوتي سراً. مختبر تعليمي لهجوم الدولفين مع تقنيات الدفاع."],
["room-impulse-mapper","acoustic","room-impulse-mapper","Map room geometry from echo patterns. Blind acoustic source separation and analysis.","Cartographiez la géométrie d'une pièce par analyse des motifs d'écho et de la réponse impulsionnelle. Séparation aveugle de sources sonores et acoustique spatiale.","ارسم الشكل الهندسي للغرفة من أنماط الصدى والاستجابة النبضية. فصل أعمى لمصادر الصوت المتعددة وتحليل الخصائص الصوتية للمكان."],
["acoustic-covert-channel","acoustic","acoustic-covert-channel","Two air-gapped computers communicate via ultrasound through shared room acoustics.","Deux ordinateurs isolés du réseau (air-gapped) communiquent secrètement par ultrasons dans l'acoustique de la même pièce. Canal covert ultrasonique fascinant.","حاسوبان معزولان عن الشبكة تماماً (Air-gapped) يتواصلان سراً عبر الموجات فوق الصوتية من خلال صوتيات الغرفة المشتركة. قناة سرية خفية."],
["seismic-footprint","acoustic","seismic-footprint","Identify who is walking by floor vibration signature using accelerometer analysis.","Identifiez les personnes par leur signature vibratoire au sol, captée par accéléromètre. Empreinte sismique de la démarche unique à chaque individu, sans caméra.","حدد هوية الشخص الماشي من بصمة اهتزاز الأرضية الفريدة لخطواته باستخدام تحليل بيانات مقياس التسارع. تعرف على الأشخاص بدون رؤيتهم."],
["whisper-network","acoustic","whisper-network","Chain of micro:bits relay encrypted audio as ultrasonic hops. Acoustic mesh network.","Chaîne de micro:bits relayant de l'audio chiffré par sauts ultrasoniques successifs. Réseau acoustique maillé et chiffré, sans aucune infrastructure radio classique.","سلسلة أجهزة micro:bit تنقل صوتاً مشفراً عبر قفزات فوق صوتية من جهاز لآخر. شبكة اتصالات صوتية شبكية مشفرة بدون أي بنية تحتية."],
["nanosecond-radar","chrono","nanosecond-radar","Measure distances using ESP32 WiFi round-trip timing with sub-meter precision.","Mesurez des distances avec une précision sub-métrique grâce au chronométrage aller-retour WiFi de l'ESP32. Radar nanoseconde artisanal pour la localisation intérieure.","قس المسافات بدقة أقل من متر باستخدام توقيت رحلة إشارة WiFi ذهاباً وإياباً عبر ESP32. رادار نانو ثانية محلي الصنع لتحديد المواقع بدقة."],
["time-crystal-sync","chrono","time-crystal-sync","GPS-less clock synchronization across micro:bit swarm using only RF phase locking.","Synchronisation d'horloges sans GPS pour un essaim de micro:bits par verrouillage de phase RF mutuel. Consensus temporel distribué par échange de signaux radio.","مزامنة ساعات سرب micro:bit بدون GPS باستخدام تقنية قفل الطور الراديوي فقط. تزامن زمني موزع عبر تبادل إشارات التردد بين العقد."],
["temporal-steganography","chrono","temporal-steganography","Hide data in timing gaps between WiFi packets. The silence carries the message.","Dissimulez des données dans les micro-intervalles temporels entre les paquets WiFi. Le silence entre les trames porte le message secret. Stéganographie temporelle.","أخفِ البيانات السرية في فجوات التوقيت الدقيقة بين حزم WiFi. الصمت بين الحزم هو ما يحمل الرسالة المخفية. إخفاء معلومات زمني متقدم."],
["relativistic-calculator","chrono","relativistic-calculator","Measure actual time dilation by comparing GPS atomic clock vs local oscillator drift.","Mesurez la dilatation du temps relativiste en comparant l'horloge atomique GPS à la dérive de votre oscillateur local. Vérifiez la relativité d'Einstein chez vous.","قس تمدد الزمن النسبي الفعلي بمقارنة الساعة الذرية في أقمار GPS مع انحراف المذبذب المحلي. تحقق من نظرية أينشتاين النسبية عملياً."],
["jitter-fingerprint","chrono","jitter-fingerprint","Identify any device by its unique clock jitter pattern. Hardware DNA from timing.","Identifiez tout appareil électronique par le motif de gigue (jitter) unique de son horloge interne. ADN matériel infalsifiable extrait du comportement temporel.","حدد هوية أي جهاز إلكتروني من نمط الارتعاش (Jitter) الفريد لساعته الداخلية. بصمة مادية لا يمكن تزويرها — حمض نووي رقمي مستخلص من التوقيت."],
["time-reversal-mirror","chrono","time-reversal-mirror","Replay RF signals backward through channel to focus energy at original transmitter location.","Rejouez les signaux RF dans l'ordre temporel inverse pour focaliser l'énergie électromagnétique au point d'émission original. Miroir à retournement temporel fascinant.","أعد تشغيل إشارات RF بترتيب زمني عكسي عبر القناة لتركيز الطاقة الكهرومغناطيسية في موقع المرسل الأصلي. مرآة عكس زمني للموجات الراديوية."],
["timing-attack-lab","chrono","timing-attack-lab","Break cryptographic implementations by measuring nanosecond operation timing differences.","Brisez des implémentations cryptographiques en mesurant des différences de timing à la nanoseconde. Attaque par canal auxiliaire temporel sur les algorithmes de chiffrement.","اكسر تطبيقات التشفير عبر قياس فروقات توقيت العمليات الحسابية بدقة النانو ثانية. هجوم القناة الجانبية الزمنية يكشف أسرار خوارزميات التشفير."],
["epoch-vault","chrono","epoch-vault","Time-locked encryption: messages can only be decrypted after a specific future date.","Chiffrement verrouillé dans le temps : les messages ne peuvent être déchiffrés qu'après une date future prédéfinie. Capsule temporelle numérique sécurisée par cryptographie.","خزنة تشفير مقفلة بالزمن: الرسائل المشفرة لا يمكن فك تشفيرها إلا بعد تاريخ مستقبلي محدد مسبقاً. كبسولة زمنية رقمية مؤمّنة بالتشفير."],
["frequency-hopping-chess","chrono","frequency-hopping-chess","Two players hop frequencies in coordinated game-theory optimal patterns.","Deux joueurs sautent de fréquence en suivant des stratégies optimales issues de la théorie des jeux. Échecs radio où le timing et le spectre sont les armes.","لاعبان يقفزان بين الترددات الراديوية بأنماط مثلى مستوحاة من نظرية الألعاب. شطرنج لاسلكي حقيقي حيث التوقيت والتردد هما مفتاح النصر."],
["drift-detective","chrono","drift-detective","Detect GPS spoofing by analyzing clock drift anomalies. Find the fake satellites.","Détectez les tentatives de mystification GPS en analysant les anomalies de dérive d'horloge. Identifiez les faux satellites et distinguez-les des signaux authentiques.","اكشف محاولات انتحال إشارات GPS من خلال تحليل شذوذ انحراف الساعة المحلية. حدد الأقمار الصناعية المزيفة وميّزها عن الحقيقية بالتوقيت."],
["packet-time-machine","chrono","packet-time-machine","Record and replay network traffic at any speed. Slow-motion packet forensics.","Enregistrez et rejouez le trafic réseau à n'importe quelle vitesse. Analyse forensique de paquets au ralenti pour révéler les événements cachés dans le flux de données.","سجّل حركة مرور الشبكة كاملة وأعد تشغيلها بأي سرعة تريدها. تحقيق جنائي رقمي للحزم بالحركة البطيئة لكشف الأحداث الخفية في الشبكة."],
["temporal-triangulation","chrono","temporal-triangulation","Locate any transmitter using TDOA with just 3 micro:bits and precise timing.","Localisez n'importe quel émetteur par différence de temps d'arrivée (TDOA) avec seulement 3 micro:bits et un chronométrage précis. Triangulation temporelle simple.","حدد موقع أي مرسل راديوي بتقنية فرق وقت الوصول (TDOA) باستخدام 3 أجهزة micro:bit فقط وتوقيت دقيق. تثليث زمني بأدوات بسيطة."],
["light-speed-measure","chrono","light-speed-measure","Actually measure the speed of light using HackRF pulse + distant reflector.","Mesurez effectivement la vitesse de la lumière avec une impulsion HackRF et un réflecteur distant. Expérience de physique fondamentale mesurant la constante universelle.","قس سرعة الضوء فعلياً باستخدام نبضة راديوية من HackRF وعاكس على مسافة بعيدة. تجربة فيزيائية حقيقية لقياس أهم ثابت في الكون."],
["entropy-harvester","chrono","entropy-harvester","Generate true random numbers from RF timing chaos and atmospheric noise.","Récoltez de véritables nombres aléatoires issus du chaos temporel des signaux RF et du bruit atmosphérique naturel. Source d'entropie physique pour la cryptographie.","حاصد الإنتروبيا: أنتج أرقاماً عشوائية حقيقية من فوضى توقيت الإشارات الراديوية والضوضاء الجوية الطبيعية. مصدر عشوائية فيزيائي للتشفير القوي."],
["chronos-beacon","chrono","chronos-beacon","Build stratum-1 NTP server from RPi + GPS PPS. Atomic-like precision for pennies.","Construisez un serveur NTP de stratum 1 avec RPi et signal PPS du GPS. Précision quasi atomique pour un coût dérisoire. Référence temporelle de niveau professionnel.","ابنِ خادم توقيت NTP من المستوى الأول (Stratum-1) باستخدام RPi مع نبضة GPS الثانوية (PPS). دقة شبه ذرية بتكلفة زهيدة جداً."],
["ant-colony-mesh","swarm","ant-colony-mesh","ESP32 swarm routes packets using pheromone-inspired algorithm. Emergent optimal routing.","Essaim d'ESP32 routant les paquets par un algorithme inspiré des phéromones de fourmis. Le routage optimal émerge spontanément du comportement collectif simple.","سرب ESP32 يوجه حزم البيانات باستخدام خوارزمية مستوحاة من فيرمونات مستعمرة النمل. التوجيه الأمثل يظهر تلقائياً من السلوك الجماعي البسيط."],
["flock-formation","swarm","flock-formation","Micro:bits self-organize into formations using only RSSI. No coordinates, pure emergence.","Les micro:bits s'auto-organisent en formations géométriques en utilisant uniquement le RSSI. Ni coordonnées ni GPS : comportement émergent pur et fascinant.","أجهزة micro:bit تنظم نفسها تلقائياً في تشكيلات باستخدام مؤشر قوة الإشارة (RSSI) فقط. بدون إحداثيات أو GPS — سلوك ناشئ من التفاعل البسيط."],
["consensus-blockchain","swarm","consensus-blockchain","Tiny blockchain across ESP32 swarm for tamper-proof distributed voting and logging.","Mini chaîne de blocs fonctionnant sur un essaim ESP32 : vote distribué et journalisation inviolable sans autorité centrale. Consensus décentralisé en pratique.","سلسلة كتل (بلوكتشين) مصغرة تعمل عبر سرب أجهزة ESP32. تصويت موزع وتسجيل أحداث مقاوم للتلاعب بدون أي سلطة مركزية. إجماع لامركزي."],
["emergent-firewall","swarm","emergent-firewall","Swarm of ESP32s collectively decide what network traffic to block. No central authority.","Essaim d'ESP32 décidant collectivement quel trafic réseau bloquer ou autoriser. Pare-feu émergent sans autorité centrale : cybersécurité par intelligence de l'essaim.","سرب أجهزة ESP32 يقرر جماعياً أي حركة مرور شبكية يحظرها ويسمح بها. جدار حماية ناشئ بدون سلطة مركزية — الأمن السيبراني بذكاء السرب."],
["hive-mind-sensor","swarm","hive-mind-sensor","10+ micro:bits form distributed super-sensor with collective intelligence averaging.","Plus de 10 micro:bits formant un super-capteur distribué à intelligence collective. La fusion des mesures par moyennage offre une précision bien supérieure à chaque unité.","أكثر من 10 أجهزة micro:bit تشكل مستشعراً فائقاً موزعاً بذكاء جماعي. دمج القراءات بالمتوسط يعطي دقة أعلى بكثير من أي مستشعر فردي."],
["swarm-spectrum-scan","swarm","swarm-spectrum-scan","Multiple HackRFs divide and conquer the full RF spectrum simultaneously.","Plusieurs HackRFs se répartissent le spectre RF complet et le balaient simultanément en parallèle. Couverture spectrale intégrale à vitesse décuplée par l'essaim.","عدة أجهزة HackRF تقسّم الطيف الراديوي الكامل بينها وتمسحه في آن واحد بالتوازي. تغطية طيفية شاملة بسرعة مضاعفة عبر ذكاء السرب."],
["stigmergy-network","swarm","stigmergy-network","Leave digital scent trails in WiFi beacon frames for other agents to follow.","Laissez des traces olfactives numériques dans les trames WiFi Beacon pour guider d'autres agents. Réseau de stigmergie inspiré de la communication indirecte des insectes.","اترك آثاراً رقمية كالفيرمونات في إطارات WiFi Beacon ليتبعها عملاء آخرون. شبكة تواصل غير مباشر مستوحاة من سلوك الحشرات الاجتماعية."],
["murmuration-display","swarm","murmuration-display","Swarm of micro:bit LED displays form one coordinated giant animation.","Essaim d'écrans LED micro:bit formant ensemble une animation géante coordonnée, comme une nuée d'étourneaux. Chaque nœud suit des règles simples, le résultat est magique.","سرب من شاشات LED على أجهزة micro:bit يشكل رسماً متحركاً عملاقاً منسقاً كحركة أسراب الطيور. كل جهاز يتبع قواعد بسيطة والنتيجة مذهلة."],
["quorum-sensing","swarm","quorum-sensing","Devices change behavior when enough neighbors are detected. Critical mass triggers action.","Les appareils changent automatiquement de comportement quand suffisamment de voisins sont détectés. La masse critique déclenche l'action : détection de quorum biomimétique.","الأجهزة تغير سلوكها تلقائياً عند اكتشاف عدد كافٍ من الأجهزة المجاورة. الكتلة الحرجة تطلق إجراءاً جماعياً — استشعار النصاب كالبكتيريا."],
["genetic-algorithm-radio","swarm","genetic-algorithm-radio","Swarm evolves optimal antenna/power/frequency parameters through natural selection in real-time.","L'essaim fait évoluer les paramètres optimaux d'antenne, puissance et fréquence par sélection naturelle en temps réel. Évolution darwinienne appliquée à la radio.","السرب يطوّر معلمات الهوائي والقدرة والتردد المثلى عبر خوارزمية جينية بالانتقاء الطبيعي في الزمن الحقيقي. تطور دارويني للراديو."],
["cellular-automata-mesh","swarm","cellular-automata-mesh","Conway's Game of Life running across physical ESP32 grid. Silicon life.","Le Jeu de la Vie de Conway exécuté sur une grille physique d'ESP32 interconnectés. Chaque appareil est une cellule vivante. Automates cellulaires en silicium réel.","لعبة الحياة لكونواي تعمل عبر شبكة ESP32 فعلية حيث كل جهاز يمثل خلية. حياة سيليكونية حقيقية تتطور بقواعد الأتمتة الخلوية البسيطة."],
["wolf-pack-tracker","swarm","wolf-pack-tracker","Coordinated multi-receiver target tracking using pack hunting algorithms.","Pistage coordonné de cibles par récepteurs multiples utilisant des algorithmes inspirés de la chasse en meute de loups. Chaque nœud joue un rôle dans la traque.","تتبع منسق للأهداف باستخدام مستقبلات متعددة تعمل بخوارزميات صيد القطيع. كل مستقبل يلعب دوراً في المطاردة الجماعية المنسقة."],
["democratic-frequency","swarm","democratic-frequency","Swarm votes on best frequency to use via distributed RF election protocol.","L'essaim vote pour choisir la meilleure fréquence via un protocole d'élection RF entièrement distribué. Démocratie spectrale où chaque appareil a une voix égale.","السرب يصوّت على أفضل تردد للاستخدام عبر بروتوكول انتخاب لاسلكي موزع بالكامل. ديمقراطية ترددية حيث كل جهاز له صوت متساوٍ."],
["slime-mold-router","swarm","slime-mold-router","Route mesh traffic using slime mold optimization. Biology beats algorithms.","Routez le trafic du réseau maillé par optimisation inspirée du blob (Physarum). La biologie trouve des chemins optimaux que les algorithmes classiques peinent à égaler.","وجّه حركة مرور الشبكة الشبكية بخوارزمية محاكاة العفن الغروي. الأحياء الدقيقة تجد مسارات أمثل من كثير من خوارزميات التوجيه التقليدية."],
["particle-swarm-optimizer","swarm","particle-swarm-optimizer","PSO algorithm finds optimal radio parameters across a swarm of real transmitters.","L'algorithme d'optimisation par essaim de particules (PSO) trouve les paramètres radio optimaux à travers un essaim de vrais émetteurs. Optimisation collective adaptative.","خوارزمية تحسين سرب الجسيمات (PSO) تجد معلمات الراديو المثلى تجريبياً عبر سرب مرسلات حقيقية. تحسين تكيّفي جماعي للأداء اللاسلكي."],
["quantum-random-beacon","physics","quantum-random-beacon","True quantum randomness from shot noise in RF amplifier circuits.","Aléa quantique véritable extrait du bruit de grenaille (shot noise) dans les circuits amplificateurs RF. Générateur de nombres aléatoires quantique fait maison.","عشوائية كمومية حقيقية مستخلصة من ضوضاء الطلقات (Shot Noise) في دوائر مضخمات التردد الراديوي. مولّد أرقام عشوائية كمومي محلي الصنع."],
["metamaterial-simulator","physics","metamaterial-simulator","Simulate negative-index metamaterials for RF cloaking and superlensing.","Simulez des métamatériaux à indice de réfraction négatif pour le camouflage RF et la création de super-lentilles. Physique des matériaux aux propriétés impossibles.","حاكِ مواد فوقية (ميتاماتيريال) بمعامل انكسار سالب لتمويه الأجسام عن الترددات الراديوية وإنشاء عدسات فائقة. فيزياء المواد المستحيلة."],
["plasma-antenna","physics","plasma-antenna","Control ionized gas tube as dynamically reconfigurable antenna. Appear and vanish.","Contrôlez un tube de gaz ionisé (plasma) comme antenne reconfigurable dynamiquement. L'antenne apparaît et disparaît électriquement : véritable furtivité RF.","تحكم بأنبوب غاز مؤيّن (بلازما) كهوائي قابل لإعادة التشكيل ديناميكياً. الهوائي يظهر ويختفي كهربائياً — تقنية تخفٍّ كهرومغناطيسي حقيقية."],
["tunneling-radio","physics","tunneling-radio","Demonstrate quantum tunneling analog with evanescent RF waves through barriers.","Démontrez l'analogue de l'effet tunnel quantique avec des ondes RF évanescentes traversant des barrières physiques. La mécanique quantique illustrée par la radio.","أظهر نظير ظاهرة النفق الكمومي باستخدام موجات RF متلاشية (Evanescent) تمر عبر حواجز مادية. الفيزياء الكمومية بتجربة راديوية عملية."],
["superluminal-illusion","physics","superluminal-illusion","Create apparent faster-than-light signal using phased array interference trick.","Créez un signal apparemment supraluminique par interférence de réseau phasé. Comprenez pourquoi cela ne viole pas la relativité malgré l'illusion saisissante.","أنشئ إشارة تبدو ظاهرياً أسرع من الضوء باستخدام خدعة تداخل المصفوفة الطورية. افهم لماذا لا تنتهك النسبية رغم المظهر الخادع."],
["zero-point-meter","physics","zero-point-meter","Measure RF noise floor approaching quantum vacuum fluctuation limit.","Mesurez le plancher de bruit RF en approchant la limite fondamentale des fluctuations du vide quantique (point zéro). Physique quantique expérimentale accessible.","قس أرضية ضوضاء الترددات الراديوية عند اقترابها من الحد الفيزيائي لتقلبات الفراغ الكمومي (نقطة الصفر). فيزياء كمومية تجريبية بأدوات بسيطة."],
["holographic-radio","physics","holographic-radio","3D radio wave interference pattern visualization. See RF as holograms.","Visualisation 3D des motifs d'interférence des ondes radio. Observez les champs RF comme des hologrammes se formant et interagissant dans l'espace devant vous.","تصور ثلاثي الأبعاد لأنماط تداخل موجات الراديو. شاهد الترددات الراديوية كصور مجسمة (هولوغرام) تتفاعل وتتداخل في الفراغ أمامك."],
["radio-black-hole","physics","radio-black-hole","Metamaterial structure that absorbs all RF from every direction. Electromagnetic event horizon.","Structure en métamatériau absorbant toutes les fréquences radio de toute direction. Horizon des événements électromagnétique simulant un trou noir pour les ondes RF.","بنية من مواد فوقية تمتص جميع الترددات الراديوية من كل اتجاه. أفق حدث كهرومغناطيسي يحاكي سلوك الثقب الأسود للموجات الراديوية."],
["faraday-rotation-lab","physics","faraday-rotation-lab","Measure Earth's magnetic field strength using polarized RF Faraday rotation.","Mesurez l'intensité du champ magnétique terrestre par rotation de Faraday d'une onde RF polarisée. Expérience de physique classique réalisée avec des outils SDR modernes.","قس قوة المجال المغناطيسي للأرض باستخدام دوران فاراداي لإشارة تردد راديوي مستقطبة. تجربة فيزيائية كلاسيكية بأدوات SDR حديثة."],
["bell-inequality-rf","physics","bell-inequality-rf","Test Bell's inequality analog using correlated RF noise sources. Quantum weirdness in radio.","Testez l'analogue de l'inégalité de Bell en utilisant des sources de bruit RF corrélées. Explorez les mystères de la mécanique quantique par une expérience radio.","اختبر نظير متباينة بيل الكمومية باستخدام مصادر ضوضاء راديوية مترابطة. استكشف غرابة ميكانيكا الكم بتجربة عملية في عالم الراديو."],
["casimir-detector","physics","casimir-detector","Attempt to detect Casimir-like effects between closely spaced RF resonators.","Tentez de détecter des effets analogues à l'effet Casimir entre résonateurs RF extrêmement rapprochés. Exploration des frontières de la physique quantique en RF.","حاول كشف تأثيرات شبيهة بتأثير كازيمير بين رنّانات ترددية متقاربة جداً. استكشاف حدود الفيزياء الكمومية في مجال الترددات الراديوية."],
["gravitational-wave-sim","physics","gravitational-wave-sim","Correlate local RF timing shifts with LIGO gravitational wave detection events.","Corrélez les décalages temporels RF locaux avec les événements de détection d'ondes gravitationnelles par LIGO. Votre radio peut-elle sentir les rides de l'espace-temps ?","اربط انزياحات التوقيت المحلية في إشارات RF مع أحداث كشف موجات الجاذبية من مرصد LIGO. هل يمكن لرادار محلي أن يشعر بتموجات الزمكان؟"],
["doppler-cooling-sim","physics","doppler-cooling-sim","Simulate laser/RF cooling of atoms. Slow particles with counter-propagating waves.","Simulez le refroidissement Doppler des atomes par laser ou RF. Ralentissez les particules avec des ondes contra-propagatives. Physique des ultra-basses températures.","حاكِ تبريد دوبلر للذرات بالليزر أو الترددات الراديوية. أبطئ الجسيمات باستخدام موجات معاكسة الانتشار. فيزياء الحرارة المنخفضة بصرياً."],
["em-drive-simulator","physics","em-drive-simulator","Simulate the controversial RF cavity thruster. Does momentum come from nothing?","Simulez le propulseur à cavité RF controversé (EM Drive). Peut-on générer une poussée dans un résonateur micro-ondes fermé sans carburant ? Débat physique passionnant.","حاكِ محرك الدفع بالتجويف الراديوي المثير للجدل (EM Drive). هل يمكن توليد قوة دفع من تجويف ميكروويف مغلق بدون وقود؟ جدل فيزيائي حي."],
["sagnac-interferometer","physics","sagnac-interferometer","Detect Earth's rotation using RF Sagnac effect in fiber loop. Feel the planet spin.","Détectez la rotation de la Terre par l'effet Sagnac RF dans une boucle de fibre optique. Ressentez physiquement le spin de la planète par interférométrie radio.","اكشف دوران الأرض حول محورها باستخدام تأثير ساناك للترددات الراديوية في حلقة ألياف ضوئية. اشعر بدوران الكوكب بتجربة مداخلة RF."],
["evil-firmware-flasher","darkarts","evil-firmware-flasher","Demonstrate malicious firmware update attacks in sandboxed environment. Learn to detect them.","Démontrez les attaques par mise à jour de firmware malveillant dans un environnement bac à sable isolé. Apprenez à détecter les mises à jour falsifiées et à vous protéger.","أظهر كيف تعمل هجمات تحديث البرامج الثابتة (Firmware) الخبيثة في بيئة رملية معزولة وآمنة. تعلم اكتشاف التحديثات المزورة والحماية منها."],
["ghost-network-builder","darkarts","ghost-network-builder","Create entire fake WiFi infrastructure to deceive and study attackers.","Créez une infrastructure WiFi entièrement factice avec points d'accès et services leurres pour attirer, piéger et étudier le comportement des attaquants en toute sécurité.","أنشئ بنية تحتية WiFi وهمية كاملة بنقاط وصول وخدمات مزيفة لخداع المهاجمين واستدراجهم ودراسة سلوكهم وأساليبهم في بيئة مسيطر عليها."],
["dns-exfiltration-engine","darkarts","dns-exfiltration-engine","Smuggle data through DNS queries. Then detect and prevent it. Attack + defense.","Exfiltrez des données secrètement via des requêtes DNS apparemment anodines. Puis apprenez à détecter et bloquer cette technique. Exercice attaque et défense complet.","هرّب البيانات سراً عبر استعلامات نظام أسماء النطاقات (DNS) وكأنها حركة مرور عادية. ثم تعلم كيف تكشف هذا التسريب وتمنعه. هجوم + دفاع."],
["bluetooth-impersonator","darkarts","bluetooth-impersonator","Clone BLE device identity for MITM demonstration. Understand the attack to prevent it.","Clonez l'identité d'un appareil Bluetooth Low Energy pour démontrer une attaque homme du milieu (MitM). Comprenez le mécanisme d'usurpation pour mieux le contrer.","انسخ هوية جهاز بلوتوث منخفض الطاقة (BLE) لعرض هجوم الرجل في الوسط تعليمياً. افهم كيف يعمل انتحال الهوية اللاسلكية لتتمكن من منعه."],
["power-analysis-attack","darkarts","power-analysis-attack","Break AES encryption by measuring ESP32 power consumption patterns during operation.","Cassez le chiffrement AES en analysant les motifs de consommation électrique de l'ESP32 pendant les opérations cryptographiques. Attaque classique par canal auxiliaire de puissance.","اكسر تشفير AES بهجوم تحليل القدرة: قس أنماط استهلاك طاقة ESP32 أثناء عمليات التشفير واستنتج المفتاح السري. هجوم القناة الجانبية الكلاسيكي."],
["tempest-spy","darkarts","tempest-spy","Reconstruct screen contents from electromagnetic emissions. Van Eck phreaking simulator.","Reconstituez le contenu d'un écran distant à partir de ses émissions électromagnétiques parasites. Simulateur d'attaque Van Eck (TEMPEST) à des fins éducatives.","أعد بناء محتوى الشاشة عن بُعد من الانبعاثات الكهرومغناطيسية غير المقصودة. محاكي هجوم Van Eck للتنصت الكهرومغناطيسي (TEMPEST) التعليمي."],
["side-channel-arsenal","darkarts","side-channel-arsenal","Complete toolkit: timing, power, EM, acoustic, cache side-channel attacks.","Arsenal complet d'attaques par canaux auxiliaires : temporel, puissance, électromagnétique, acoustique et cache mémoire. Maîtrisez toutes les techniques et leurs défenses.","ترسانة كاملة لهجمات القنوات الجانبية: التوقيت والطاقة والانبعاثات الكهرومغناطيسية والصوت وذاكرة التخزين المؤقت. تعلم كل أنواع الهجمات والدفاعات."],
["wifi-karma-attack","darkarts","wifi-karma-attack","Answer any WiFi probe request to capture connections. KARMA attack simulator + defense.","Répondez à toute requête WiFi Probe pour capturer automatiquement les connexions. Simulateur d'attaque KARMA éducatif avec entraînement pratique aux contre-mesures.","أجب على أي طلب استكشاف WiFi لالتقاط الاتصالات تلقائياً. محاكي هجوم KARMA التعليمي مع تدريب عملي على تقنيات الكشف والدفاع المضاد."],
["hardware-trojan-lab","darkarts","hardware-trojan-lab","Detect hidden malicious circuits embedded in hardware during manufacturing.","Détectez les circuits malveillants (chevaux de Troie matériels) dissimulés dans les composants lors de la fabrication. Analyse d'intégrité du matériel par radiofréquence.","اكشف الدوائر الإلكترونية الخبيثة (أحصنة طروادة المادية) المخفية والمدمجة في الأجهزة أثناء التصنيع. تحليل سلامة العتاد بالترددات الراديوية."],
["firmware-reverse-lab","darkarts","firmware-reverse-lab","Extract, disassemble, and analyze firmware from IoT devices. Find the backdoors.","Extrayez, désassemblez et analysez le firmware d'appareils IoT par rétro-ingénierie. Trouvez les portes dérobées et les vulnérabilités cachées dans le code embarqué.","استخرج وفكّك وحلّل البرامج الثابتة (Firmware) لأجهزة إنترنت الأشياء. ابحث عن الأبواب الخلفية ونقاط الضعف الأمنية. هندسة عكسية تعليمية."],
["radio-replay-attack","darkarts","radio-replay-attack","Capture and replay garage/car/gate RF signals. Educational replay attack lab.","Capturez et rejouez les signaux RF de garages, voitures et portails. Laboratoire éducatif sur les attaques par rejeu et la compréhension des codes tournants.","التقط وأعد تشغيل إشارات الترددات الراديوية لأبواب المرآب والسيارة والبوابة. مختبر تعليمي لهجمات إعادة التشغيل وفهم أنظمة الرموز المتدحرجة."],
["cable-tap-detector","darkarts","cable-tap-detector","Detect physical wiretaps on ethernet/phone cables using time-domain reflectometry.","Détectez les écoutes physiques sur câbles Ethernet et téléphoniques par réflectométrie dans le domaine temporel (TDR). Localisez toute dérivation avec précision.","اكشف التنصت الفعلي على كابلات الإيثرنت والهاتف باستخدام تقنية انعكاس المجال الزمني (TDR). حدد موقع أي نقطة اعتراض على الكابل بدقة."],
["supply-chain-auditor","darkarts","supply-chain-auditor","Verify hardware hasn't been tampered during shipping. Physical + RF integrity checks.","Vérifiez l'intégrité du matériel après expédition : inspections physiques et analyses RF pour détecter toute altération subie dans la chaîne d'approvisionnement.","تحقق من سلامة الأجهزة وعدم العبث بها أثناء سلسلة التوريد والشحن. فحوصات سلامة فيزيائية وراديوية لكشف أي تعديل غير مصرح به."],
["rogue-base-station","darkarts","rogue-base-station","Educational fake GSM base station (2G only). Understand cellular security weaknesses.","Station de base GSM factice éducative (2G uniquement). Comprenez les failles de sécurité des réseaux cellulaires anciens et les méthodes de protection modernes.","محطة GSM قاعدية وهمية تعليمية (شبكات الجيل الثاني فقط). افهم نقاط ضعف الأمن السيبراني للشبكات الخلوية القديمة وأساليب الحماية."],

["ai-signal-identifier","ai-radio","ai-signal-identifier","ML model identifies unknown signals from waterfall spectrogram images. What IS that signal?","Modèle d'apprentissage automatique identifiant les signaux inconnus depuis les spectrogrammes en cascade. Captez un signal mystérieux et demandez à l'IA : c'est quoi ?","نموذج تعلم آلي (ML) يحدد الإشارات المجهولة من صور المخطط الطيفي الشلالي. التقط أي إشارة غامضة واسأل الذكاء الاصطناعي: ما هذه؟"],
["neural-demodulator","ai-radio","neural-demodulator","Neural network that learns to demodulate ANY modulation scheme without being told the type.","Réseau neuronal apprenant à démoduler n'importe quel schéma de modulation sans connaître le type à l'avance. Démodulateur universel par intelligence artificielle.","شبكة عصبية اصطناعية تتعلم إزالة تعديل أي نظام تعديل راديوي تلقائياً بدون إخبارها بنوعه مسبقاً. مُزيل تعديل عالمي بالذكاء الاصطناعي."],
["gpt-radio-operator","ai-radio","gpt-radio-operator","AI ham radio operator that conducts QSO contacts, logs calls, and adapts to conditions.","Opérateur radioamateur piloté par IA : conduit des QSO automatiquement, journalise les contacts et s'adapte en temps réel aux conditions de propagation changeantes.","مشغل راديو هواة بالذكاء الاصطناعي يجري اتصالات QSO تلقائياً ويسجل المكالمات في السجل ويتكيف مع ظروف الانتشار المتغيرة. عامل AI للراديو."],
["anomaly-hunter","ai-radio","anomaly-hunter","ML detects unusual RF patterns humans would miss. Find the needle in the spectrum.","L'apprentissage automatique détecte des motifs RF inhabituels invisibles à l'œil humain. Trouvez l'aiguille dans la botte de foin spectrale. Chasseur d'anomalies intelligent.","التعلم الآلي يكشف أنماط ترددات راديوية شاذة يغفلها البشر تماماً. اعثر على الإبرة في كومة قش الطيف الراديوي. صائد الشذوذ الذكي."],
["deepfake-voice-detector","ai-radio","deepfake-voice-detector","Detect AI-generated synthetic voices in radio transmissions and phone calls.","Détectez les voix synthétiques générées par IA (deepfakes audio) dans les transmissions radio et les appels téléphoniques. Bouclier contre la fraude vocale par IA.","اكشف الأصوات المركّبة بتقنية التزييف العميق (Deepfake) في البث الإذاعي والمكالمات الهاتفية. كاشف أصوات اصطناعية لحماية الاتصالات من الاحتيال."],
["spectrum-predictor","ai-radio","spectrum-predictor","Predict spectrum occupancy minutes ahead using time-series ML. See the future.","Prédisez l'occupation du spectre radio minutes à l'avance grâce au ML sur séries temporelles. Anticipez l'activité future du spectre avant qu'elle ne se produise.","تنبأ بإشغال الطيف الراديوي دقائق مقدماً باستخدام التعلم الآلي على السلاسل الزمنية. شاهد المستقبل القريب للنشاط الراديوي قبل حدوثه."],
["adaptive-filter-ai","ai-radio","adaptive-filter-ai","Neural network learns optimal filter coefficients for any interference pattern.","Réseau neuronal apprenant automatiquement les coefficients de filtre optimaux pour tout type d'interférence. Filtre adaptatif par IA nettoyant le signal en temps réel.","شبكة عصبية تتعلم تلقائياً معاملات المُرشّح الرقمي المثلى لأي نمط تداخل يظهر. مُرشّح تكيّفي بالذكاء الاصطناعي ينظف الإشارة في الزمن الحقيقي."],
["cognitive-radio","ai-radio","cognitive-radio","AI dynamically selects best frequency, power, and modulation based on environment.","Radio cognitive : l'IA sélectionne dynamiquement la fréquence, la puissance et la modulation optimales en analysant l'environnement RF en temps réel. Radio intelligente.","راديو إدراكي: الذكاء الاصطناعي يختار ديناميكياً أفضل تردد وقوة إرسال ونظام تعديل بناءً على تحليل البيئة الراديوية المحيطة في الزمن الحقيقي."],
["neural-codec","ai-radio","neural-codec","AI compresses voice to impossibly low bitrates (< 1kbps) for radio transmission.","Codec neuronal : l'IA compresse la voix humaine à des débits impossibles (moins de 1 kbps) pour la transmission sur des canaux radio extrêmement étroits.","الذكاء الاصطناعي يضغط الصوت البشري لمعدلات بت منخفضة مستحيلة تقليدياً (أقل من 1 كيلوبت/ثانية) للإرسال عبر قنوات الراديو الضيقة جداً."],
["gesture-recognition-rf","ai-radio","gesture-recognition-rf","Recognize hand gestures using WiFi CSI + ML. No cameras, no wearables, just radio.","Reconnaissance gestuelle par WiFi CSI et apprentissage automatique. Ni caméras ni capteurs portés : les seules ondes radio WiFi suffisent à interpréter vos gestes.","تعرّف على حركات وإيماءات اليد باستخدام معلومات حالة قناة WiFi (CSI) والتعلم الآلي. بدون كاميرات ولا أجهزة ارتداء — فقط إشارات الراديو."],
["person-counting-wifi","ai-radio","person-counting-wifi","Count people in a room using only WiFi channel state information and ML.","Comptez les personnes présentes dans une pièce en utilisant uniquement les informations d'état du canal WiFi et le ML. Sans caméra ni capteur additionnel.","عُدّ الأشخاص الموجودين في غرفة باستخدام معلومات حالة قناة WiFi والتعلم الآلي فقط. بدون كاميرات ولا مستشعرات إضافية — فقط موجّه WiFi."],
["material-identifier-rf","ai-radio","material-identifier-rf","Identify materials (metal, liquid, explosive) by their RF reflection/absorption signature.","Identifiez la nature des matériaux (métal, liquide, explosif) par leur signature unique de réflexion et d'absorption RF. Scanner de matériaux par radio et IA.","حدد نوع المواد (معدن أو سائل أو مواد خطرة) من بصمة انعكاس وامتصاص الترددات الراديوية الفريدة لكل مادة. ماسح مواد بالراديو والذكاء الاصطناعي."],
["emotion-detector-rf","ai-radio","emotion-detector-rf","Detect stress and excitement from micro-body-movements via WiFi + deep learning.","Détectez le stress et l'excitation par les micro-mouvements corporels invisibles via WiFi et apprentissage profond. Capteur émotionnel sans contact ni dispositif porté.","اكشف مستوى التوتر والإثارة لدى الأشخاص من حركات الجسم الدقيقة غير المرئية عبر تحليل WiFi بالتعلم العميق. كاشف مشاعر بدون تلامس."],
["dream-radio","ai-radio","dream-radio","Generate ambient radio soundscapes that adapt to detected sleep stages.","Générez des paysages sonores radio ambiants qui s'adaptent automatiquement aux phases de sommeil détectées par l'IA. Radio des rêves accompagnant votre repos.","أنشئ مقاطع صوتية راديوية محيطية تتكيف تلقائياً مع مراحل النوم المكتشفة بالذكاء الاصطناعي. راديو الأحلام يرافق دورة نومك بموسيقى مناسبة."],
["radio-gan","ai-radio","radio-gan","GAN generates realistic synthetic RF signals for training other ML models.","Réseau antagoniste génératif (GAN) produisant des signaux RF synthétiques ultra-réalistes pour l'entraînement d'autres modèles ML. Usine à données spectrales artificielles.","شبكة خصومية توليدية (GAN) تنتج إشارات ترددات راديوية اصطناعية واقعية لتدريب نماذج التعلم الآلي الأخرى. مصنع بيانات تدريب RF اصطناعي."],
["mesh-internet-disaster","civ","mesh-internet-disaster","Build complete internet replacement for disaster zones. LoRa + WiFi + HF mesh.","Construisez un réseau de remplacement Internet complet pour zones sinistrées : maillage LoRa longue portée, WiFi local et HF intercontinental. Connectivité de crise autonome.","ابنِ بديل إنترنت كامل لمناطق الكوارث باستخدام شبكة شبكية تجمع LoRa بعيد المدى وWiFi المحلي وHF العابر للقارات. اتصالات طوارئ مستقلة."],
["solar-storm-shield","civ","solar-storm-shield","Monitor and predict Carrington-level solar storms via HF propagation anomalies.","Surveillez et prédisez les tempêtes solaires de niveau Carrington en détectant les anomalies de propagation HF. Bouclier d'alerte précoce pour les infrastructures critiques.","راقب وتنبأ بالعواصف الشمسية بمستوى حدث كارينغتون من خلال رصد شذوذ انتشار موجات HF. درع إنذار مبكر لحماية البنية التحتية الكهربائية."],
["diy-starlink-tracker","civ","diy-starlink-tracker","Track and decode every Starlink satellite in real-time using RTL-SDR.","Suivez et décodez chaque satellite Starlink en temps réel avec un simple RTL-SDR. Observez la plus grande constellation de satellites de l'histoire depuis chez vous.","تتبع وفك ترميز إشارات كل قمر Starlink صناعي في الزمن الحقيقي باستخدام RTL-SDR. راقب أكبر كوكبة أقمار صناعية في التاريخ بجهازك."],
["radio-archaeology","civ","radio-archaeology","Find buried structures using ground-penetrating radar concepts with HackRF.","Détectez des structures enfouies sous terre grâce aux principes du radar à pénétration de sol (GPR) avec HackRF. Archéologie radio révélant les secrets souterrains.","اعثر على هياكل أثرية مدفونة تحت الأرض باستخدام مبادئ الرادار النافذ للتربة (GPR) مع HackRF. علم آثار راديوي يكشف ما تخفيه الأرض."],
["ocean-current-mapper","civ","ocean-current-mapper","Map ocean surface currents using HF radar Doppler analysis of sea waves.","Cartographiez les courants de surface océaniques par analyse Doppler radar HF des vagues marines. Océanographie radar artisanale pour la science citoyenne.","ارسم خريطة تيارات سطح المحيط باستخدام تحليل دوبلر الراداري لموجات HF المنعكسة عن أمواج البحر. علم محيطات راداري بأدوات محلية الصنع."],
["volcano-monitor","civ","volcano-monitor","Detect volcanic activity via infrasound signatures + RF propagation anomalies.","Détectez l'activité volcanique précoce via les signatures infrasonores et les anomalies de propagation RF. Système d'alerte volcanique artisanal potentiellement vital.","اكشف النشاط البركاني مبكراً عبر رصد بصمات الموجات دون الصوتية المميزة وشذوذ انتشار الترددات الراديوية. نظام إنذار بركاني محلي الصنع."],
["locust-swarm-radar","civ","locust-swarm-radar","Detect incoming locust swarms via radar returns before they devastate crops.","Détectez les essaims de criquets par analyse des retours radar avant qu'ils ne dévastent les cultures. Technologie radio au service de la sécurité alimentaire mondiale.","اكشف أسراب الجراد القادمة مبكراً من خلال تحليل عوائد الرادار الراديوي قبل وصولها لتدمير المحاصيل الزراعية. تقنية إنقاذ الأمن الغذائي."],
["nuclear-fallout-mapper","civ","nuclear-fallout-mapper","Crowd-sourced radiation monitoring mesh network. Distributed Geiger counter web.","Réseau maillé participatif de surveillance des radiations avec compteurs Geiger distribués. Cartographie collaborative de la contamination radiologique en temps réel.","شبكة رصد إشعاع نووي تشاركية شبكية. عدادات غايغر موزعة متصلة لاسلكياً تُنشئ خريطة تلوث إشعاعي حية بمشاركة المجتمع في الزمن الحقيقي."],
["whale-song-decoder","civ","whale-song-decoder","Decode whale communication patterns via hydrophone SDR. Cetacean linguistics.","Décodez les communications des baleines via hydrophone connecté au SDR. Linguistique des cétacés : analysez les chants des plus grands êtres vivants de la planète.","فكّ شفرة أنماط تواصل الحيتان عبر ميكروفون مائي (هيدروفون) متصل بـ SDR. لسانيات الحيتانيات — حلل أغاني أكبر مخلوقات الأرض."],
["underground-rescue-radio","civ","underground-rescue-radio","Through-the-earth VLF communication for mine rescue. Signal through solid rock.","Communication VLF (très basse fréquence) à travers la terre pour le sauvetage minier. Envoyez des signaux traversant la roche pour atteindre les mineurs piégés.","اتصال بترددات منخفضة جداً (VLF) عبر الأرض لعمليات إنقاذ المناجم. أرسل إشارات تخترق الصخور الصلبة للوصول إلى العمال المحاصرين تحت الأرض."],
["coral-reef-monitor","civ","coral-reef-monitor","Monitor coral reef health via underwater acoustic signatures and temperature.","Surveillez la santé des récifs coralliens par analyse des signatures acoustiques sous-marines. Les récifs en bonne santé émettent des sons caractéristiques mesurables.","راقب صحة الشعاب المرجانية عبر تحليل البصمات الصوتية تحت الماء ودرجة حرارة المحيط. الشعاب الصحية تصدر أصواتاً مميزة يمكن رصدها وتحليلها."],
["space-debris-tracker","civ","space-debris-tracker","Track orbital debris using passive bistatic radar with broadcast FM as illuminator.","Pistez les débris spatiaux en orbite par radar bistatique passif utilisant les stations FM commerciales comme illuminateur. Surveillance spatiale sans émettre de signal.","تتبع حطام الفضاء المداري باستخدام رادار ثنائي المحطة سلبي يستغل إشارات محطات FM التجارية كمصدر إنارة. رصد فضائي بدون إرسال أي إشارة."],
["diy-earthquake-warning","civ","diy-earthquake-warning","P-wave detector with radio alert network. Seconds of warning save lives.","Détecteur d'ondes P sismiques avec réseau d'alerte radio instantané. Quelques secondes d'avertissement avant l'onde destructrice peuvent sauver des vies humaines.","كاشف الموجات الأولية (P-wave) للزلازل مع شبكة إنذار راديوي لاسلكية. ثوانٍ قليلة من التحذير المبكر قبل وصول الموجة المدمرة تنقذ الأرواح."],
["seed-vault-beacon","civ","seed-vault-beacon","Design self-powered beacon that broadcasts GPS coordinates for 100+ years.","Concevez une balise radio auto-alimentée capable de diffuser des coordonnées GPS pendant plus d'un siècle. Gardez les réserves de semences localisables à travers les âges.","صمم منارة راديوية ذاتية الطاقة تبث إحداثيات GPS باستمرار لأكثر من مئة عام. حافظ على بنك بذور البشرية قابلاً للاكتشاف عبر القرون."],
["atmospheric-electricity","civ","atmospheric-electricity","Map atmospheric electric field using antenna array. Predict lightning and weather.","Cartographiez le champ électrique atmosphérique avec un réseau d'antennes. Prédisez les éclairs et les changements météo avant qu'ils ne surviennent. Météorologie RF.","ارسم خريطة الحقل الكهربائي في الغلاف الجوي باستخدام مصفوفة هوائيات. تنبأ بضربات البرق والتغيرات الجوية قبل حدوثها من الشحنات الكهربائية."],
