["deepfake-voice-cloner","soceng","deepfake-voice-cloner","Clone voices with AI. Record 10 seconds, generate any phrase. Detect deepfakes.","Clonez n'importe quelle voix avec l'IA : 10 secondes d'enregistrement suffisent pour générer toute phrase. Apprenez aussi à détecter les deepfakes audio.","استنسخ الأصوات بالذكاء الاصطناعي. سجّل 10 ثوانٍ وأنشئ أي عبارة. كشف التزييف العميق."],
["pretexting-simulator","soceng","pretexting-simulator","Practice social engineering scenarios. Build pretexts, test against AI targets.","Simulez des scénarios d'ingénierie sociale réalistes. Construisez des prétextes crédibles et testez-les contre des cibles IA pour affiner vos techniques de défense.","تدرّب على سيناريوهات الهندسة الاجتماعية. ابنِ ذرائع واختبر ضد أهداف ذكية."],
["phishing-campaign-builder","soceng","phishing-campaign-builder","Design phishing emails and landing pages. Learn to spot every red flag.","Concevez des emails et pages de hameçonnage (phishing) en environnement contrôlé. Apprenez à repérer chaque signal d'alerte pour ne plus jamais tomber dans le piège.","صمّم رسائل تصيّد وصفحات مزيفة. تعلّم اكتشاف كل علامة تحذيرية."],
["influence-ops-dashboard","soceng","influence-ops-dashboard","Track and analyze information operations. Bot detection, narrative mapping.","Pistez et analysez les opérations d'influence informationnelle. Détection de bots, cartographie des récits et visualisation de la propagation de la désinformation.","تتبّع عمليات التأثير والتضليل. كشف الروبوتات ورسم خرائط الروايات."],
["osint-profile-aggregator","soceng","osint-profile-aggregator","Aggregate public data into intelligence profiles. OSINT techniques visualized.","Agrégez des données publiques en profils de renseignement structurés. Techniques OSINT (renseignement en sources ouvertes) visualisées étape par étape.","اجمع البيانات العامة في ملفات استخباراتية. تقنيات الاستخبارات مفتوحة المصدر."],
["vishing-call-simulator","soceng","vishing-call-simulator","Simulate voice phishing calls. Practice detecting social engineering over phone.","Simulez des appels de hameçonnage vocal (vishing). Entraînez-vous à détecter les techniques d'ingénierie sociale par téléphone et à résister à la manipulation.","حاكِ مكالمات التصيّد الصوتي. تدرّب على كشف الهندسة الاجتماعية عبر الهاتف."],
["baiting-trap-designer","soceng","baiting-trap-designer","Design USB drop attacks and honeypot traps. Study curiosity-driven exploits.","Concevez des attaques par clé USB abandonnée (USB drop) et des pièges honeypot. Étudiez comment la curiosité humaine devient un vecteur d'exploitation redoutable.","صمّم هجمات USB المتروكة ومصائد العسل. ادرس الاستغلال بالفضول."],
["tailgating-detector","soceng","tailgating-detector","Detect unauthorized physical access. Badge cloning, piggybacking simulation.","Détectez les accès physiques non autorisés : clonage de badges, filature (tailgating) et piggybacking. Simulez et contrez les intrusions par ingénierie sociale physique.","اكتشف الدخول الفيزيائي غير المصرّح. استنساخ البطاقات ومحاكاة التسلل."],
["credential-harvester","soceng","credential-harvester","Build credential capture pages. Study form hijacking and session theft.","Créez des pages de capture d'identifiants en laboratoire sécurisé. Étudiez le détournement de formulaires et le vol de sessions pour mieux protéger vos utilisateurs.","ابنِ صفحات التقاط بيانات الاعتماد. ادرس اختطاف النماذج وسرقة الجلسات."],
["dumpster-diving-sim","soceng","dumpster-diving-sim","Find secrets in discarded data. Document shredding analysis, metadata recovery.","Trouvez des secrets dans les données jetées imprudemment. Analysez les documents déchiquetés et récupérez les métadonnées : le renseignement est dans la poubelle.","اعثر على أسرار في البيانات المهملة. تحليل الوثائق الممزقة واسترجاع البيانات."],
["watering-hole-architect","soceng","watering-hole-architect","Design targeted website compromises. Analyze browsing patterns for attack vectors.","Concevez des attaques de type point d'eau (watering hole) sur des sites ciblés. Analysez les habitudes de navigation pour identifier les vecteurs d'attaque optimaux.","صمّم اختراقات مواقع مستهدفة. حلّل أنماط التصفّح لإيجاد نقاط الهجوم."],
["shoulder-surfing-lab","soceng","shoulder-surfing-lab","Test visual eavesdropping techniques. Screen privacy filters, viewing angles.","Testez les techniques d'espionnage visuel par-dessus l'épaule (shoulder surfing). Évaluez les filtres de confidentialité et les angles de vue vulnérables en conditions réelles.","اختبر تقنيات التنصّت البصري. مرشّحات الخصوصية وزوايا المشاهدة."],
["qr-code-poisoner","soceng","qr-code-poisoner","Create malicious QR codes. URL hijacking, WiFi credential theft via QR.","Créez des codes QR malveillants en laboratoire : détournement d'URL, vol d'identifiants WiFi et injection de charges utiles. Apprenez à auditer tout QR avant de le scanner.","أنشئ رموز QR خبيثة. اختطاف عناوين URL وسرقة بيانات WiFi عبر QR."],
["social-media-recon","soceng","social-media-recon","Map social networks from public posts. Relationship graphs, timeline analysis.","Cartographiez les réseaux sociaux à partir de publications ouvertes. Graphes de relations interpersonnelles et analyse chronologique pour le renseignement en sources ouvertes.","ارسم خرائط الشبكات الاجتماعية من المنشورات العامة. رسوم بيانية للعلاقات."],
["impersonation-toolkit","soceng","impersonation-toolkit","Study identity spoofing techniques. Email headers, caller ID, fake profiles.","Étudiez les techniques d'usurpation d'identité numérique : falsification d'en-têtes email, manipulation de l'identifiant d'appelant et création de profils fictifs.","ادرس تقنيات انتحال الهوية. ترويسات البريد ومعرّف المتصل والملفات المزيفة."],
["keyboard-logger-pcb","implant","keyboard-logger-pcb","Design a hardware keylogger PCB. Intercept USB HID between keyboard and PC.","Concevez un enregistreur de frappes matériel sur circuit imprimé (PCB). Interceptez les données USB HID entre le clavier et le PC pour l'audit de sécurité.","صمّم لوحة دارة راصد لوحة مفاتيح. اعترض بيانات USB HID بين اللوحة والحاسوب."],
["usb-implant-designer","implant","usb-implant-designer","Build USB attack devices. BadUSB, rubber ducky, data exfiltration implants.","Construisez des dispositifs d'attaque USB : BadUSB, Rubber Ducky et implants d'exfiltration de données. Comprenez les menaces USB pour mieux les neutraliser.","ابنِ أجهزة هجوم USB. أجهزة BadUSB وتسريب البيانات عبر منافذ USB."],
["rogue-charger-lab","implant","rogue-charger-lab","Build juice-jacking chargers. Data extraction through charging cables.","Construisez des chargeurs piégés (juice-jacking) en laboratoire. Extraction de données à travers les câbles de charge modifiés. Apprenez à reconnaître la menace.","ابنِ شواحن خبيثة. استخراج البيانات عبر كوابل الشحن المعدّلة."],
["hidden-camera-builder","implant","hidden-camera-builder","Design covert cameras in everyday objects. ESP32-CAM in clocks, pens, frames.","Concevez des caméras de surveillance cachées dans des objets quotidiens avec ESP32-CAM : horloges, stylos, cadres photo. Apprenez aussi à les détecter.","صمّم كاميرات مخفية في أشياء يومية. ESP32-CAM في ساعات وأقلام وإطارات."],
["supply-chain-backdoor","implant","supply-chain-backdoor","Study hardware supply chain attacks. Modified chips, firmware backdoors.","Étudiez les attaques sur la chaîne d'approvisionnement matérielle : puces modifiées en usine, portes dérobées firmware et méthodes de vérification d'intégrité.","ادرس هجمات سلسلة التوريد. رقاقات معدّلة وأبواب خلفية في البرمجيات الثابتة."],
["nfc-skimmer-sim","implant","nfc-skimmer-sim","Simulate NFC card skimming. Contactless payment interception techniques.","Simulez l'écrémage (skimming) de cartes NFC. Étudiez les techniques d'interception de paiement sans contact et les contre-mesures de protection associées.","حاكِ نسخ بطاقات NFC. تقنيات اعتراض الدفع اللاتلامسي."],
["evil-maid-toolkit","implant","evil-maid-toolkit","Physical access attacks on encrypted laptops. Boot tampering, BIOS implants.","Attaques d'accès physique sur ordinateurs portables chiffrés : altération de la séquence de démarrage et implants BIOS. Laboratoire Evil Maid pour la sécurité matérielle.","هجمات الوصول الفيزيائي على حواسيب مشفّرة. تلاعب بالإقلاع وزرعات BIOS."],
["lan-turtle-builder","implant","lan-turtle-builder","Build inline network implants. Transparent bridge with packet capture.","Construisez des implants réseau en ligne (LAN Turtle) : pont transparent capturant les paquets de manière invisible. Comprenez les menaces d'interception physique réseau.","ابنِ زرعات شبكية مضمّنة. جسر شفاف مع التقاط حزم البيانات."],
["pi-zero-dropbox","implant","pi-zero-dropbox","Tiny network dropbox for persistent access. Auto-connect, reverse shell.","Boîtier réseau miniature Pi Zero pour maintenir un accès persistant discret. Connexion automatique avec shell inversé. Étudiez les techniques de persistence avancées.","صندوق إسقاط شبكي صغير للوصول المستمر. اتصال تلقائي وقشرة عكسية."],
["hardware-trojan-designer","implant","hardware-trojan-designer","Design hardware trojans in circuit schematics. Kill switches, data leaks.","Concevez des chevaux de Troie matériels dans les schémas de circuits : interrupteurs d'arrêt cachés et canaux de fuite de données. Ingénierie de la sécurité du silicium.","صمّم أحصنة طروادة في الدارات. مفاتيح إيقاف مخفية وتسريب بيانات."],
["magnetic-stripe-cloner","implant","magnetic-stripe-cloner","Study magnetic stripe encoding. Read, write, clone card tracks.","Étudiez l'encodage des bandes magnétiques en profondeur : lecture, écriture et clonage des pistes de cartes. Comprenez les vulnérabilités de cette technologie historique.","ادرس ترميز الشريط المغناطيسي. قراءة وكتابة واستنساخ مسارات البطاقات."],
["wifi-pineapple-diy","implant","wifi-pineapple-diy","Build your own WiFi Pineapple. Rogue AP, MitM, credential capture.","Construisez votre propre WiFi Pineapple artisanal : point d'accès pirate, interception homme du milieu (MitM) et capture d'identifiants. Audit de sécurité sans fil.","ابنِ جهاز WiFi Pineapple خاص بك. نقطة وصول مارقة واعتراض وسيط."],
["covert-audio-implant","implant","covert-audio-implant","Build hidden audio surveillance devices. GSM bugs, WiFi mics, RF transmitters.","Construisez des dispositifs de surveillance audio cachés en laboratoire : microphones GSM, micros WiFi et émetteurs RF miniatures. Apprenez aussi la détection.","ابنِ أجهزة تنصّت صوتية مخفية. ميكروفونات GSM وWiFi ومرسلات RF."],
["gps-tracker-builder","implant","gps-tracker-builder","Design covert GPS trackers. Low-power, cellular reporting, geofencing.","Concevez des traceurs GPS furtifs : faible consommation, rapports cellulaires périodiques et géorepérage (geofencing). Comprenez la menace pour mieux s'en prémunir.","صمّم متتبعات GPS مخفية. استهلاك منخفض وتقارير خلوية وسياج جغرافي."],
["screen-mirror-implant","implant","screen-mirror-implant","Capture and stream screen content wirelessly. HDMI interception, frame grabbing.","Capturez et diffusez le contenu d'un écran sans fil. Interception de signal HDMI et capture de trames vidéo à distance. Étudiez les fuites d'information visuelles.","التقط محتوى الشاشة لاسلكياً. اعتراض HDMI واستحواذ على الإطارات."],
["rsa-factoring-race","cryptatk","rsa-factoring-race","Race to factor RSA keys. Pollard rho, quadratic sieve, ECM visualized.","Course à la factorisation de clés RSA : visualisez Pollard rho, le crible quadratique et la méthode des courbes elliptiques (ECM). Cryptanalyse en action.","سباق تحليل مفاتيح RSA. خوارزميات بولارد رو والغربال التربيعي ومنحنيات إهليلجية."],
["hash-collision-finder","cryptatk","hash-collision-finder","Find hash collisions in real-time. Birthday attack on MD5, SHA-1 weakness.","Trouvez des collisions de hachage en temps réel. Attaque des anniversaires sur MD5 et démonstration des faiblesses de SHA-1. Cryptanalyse visuelle des fonctions de hachage.","اعثر على تصادمات التجزئة. هجوم عيد الميلاد على MD5 ونقاط ضعف SHA-1."],
["padding-oracle-lab","cryptatk","padding-oracle-lab","Exploit CBC padding oracles. Decrypt ciphertext byte-by-byte without the key.","Exploitez les oracles de rembourrage CBC pour déchiffrer un texte chiffré octet par octet sans connaître la clé secrète. Attaque cryptographique classique décortiquée.","استغل ثغرات حشو CBC. فك تشفير النص حرفاً بحرف بدون المفتاح."],
["aes-side-channel","cryptatk","aes-side-channel","Extract AES keys through timing and power analysis. Cache timing attacks.","Extrayez des clés AES par analyse temporelle et de consommation de puissance. Attaques par canal auxiliaire sur le cache mémoire. Cryptanalyse physique du chiffrement.","استخرج مفاتيح AES عبر تحليل التوقيت والطاقة. هجمات توقيت ذاكرة التخزين."],
["quantum-key-cracker","cryptatk","quantum-key-cracker","Simulate quantum attacks on cryptography. Shor's algorithm on RSA, Grover on AES.","Simulez les attaques quantiques sur la cryptographie : algorithme de Shor factorisant RSA et algorithme de Grover accélérant la recherche sur AES. Menace post-quantique.","حاكِ الهجمات الكمية على التشفير. خوارزمية شور على RSA وغروفر على AES."],
["replay-attack-forge","cryptatk","replay-attack-forge","Capture and replay authentication tokens. Session hijacking, nonce reuse.","Capturez et rejouez des jetons d'authentification pour démontrer le détournement de session et la réutilisation de nonce. Comprenez les failles de la replay protection.","التقط وأعد تشغيل رموز المصادقة. اختطاف الجلسات وإعادة استخدام الأرقام العشوائية."],
["length-extension-lab","cryptatk","length-extension-lab","Exploit hash length extension. Forge MACs without knowing the secret key.","Exploitez la vulnérabilité d'extension de longueur de hachage pour forger des codes d'authentification (MAC) sans connaître le secret. Cryptanalyse pratique des constructions naïves.","استغل ثغرة امتداد طول التجزئة. زوّر رموز المصادقة بدون معرفة المفتاح."],
["elliptic-curve-attack","cryptatk","elliptic-curve-attack","Attack weak elliptic curves. Invalid curve, twist, and small subgroup attacks.","Attaquez des courbes elliptiques cryptographiques faibles : courbes invalides, torsion et sous-groupes de petit ordre. Comprenez les pièges de la cryptographie ECC.","هاجم المنحنيات الإهليلجية الضعيفة. منحنيات غير صالحة والتواء ومجموعات فرعية صغيرة."],
["known-plaintext-attack","cryptatk","known-plaintext-attack","Break ciphers with known plaintext. XOR key recovery, frequency analysis.","Cassez des chiffrements avec du texte clair connu : récupération de clé XOR et analyse fréquentielle. Cryptanalyse classique appliquée aux algorithmes symétriques.","اكسر التشفير بنص واضح معروف. استرجاع مفتاح XOR وتحليل التكرار."],
["certificate-forgery-lab","cryptatk","certificate-forgery-lab","Forge X.509 certificates. Study PKI weaknesses, chain validation bypasses.","Forgez des certificats X.509 en laboratoire. Étudiez les faiblesses de l'infrastructure à clés publiques (PKI) et les techniques de contournement de la chaîne de confiance.","زوّر شهادات X.509. ادرس نقاط ضعف البنية التحتية للمفاتيح العامة."],
["timing-oracle-attack","cryptatk","timing-oracle-attack","Exploit timing differences to leak secrets. String comparison, HMAC verification.","Exploitez les micro-différences temporelles pour exfiltrer des secrets : comparaison de chaînes non constante et vérification HMAC vulnérable. Oracle temporel en pratique.","استغل فروق التوقيت لتسريب الأسرار. مقارنة السلاسل والتحقق من HMAC."],
["bleichenbacher-attack","cryptatk","bleichenbacher-attack","Break RSA PKCS#1 v1.5 padding. Million-message attack on TLS.","Cassez le rembourrage RSA PKCS#1 v1.5 par l'attaque de Bleichenbacher : un million de messages adaptés pour retrouver le clair. Cryptanalyse historique sur TLS.","اكسر حشو RSA PKCS#1 v1.5. هجوم المليون رسالة على TLS."],
["meet-in-middle-lab","cryptatk","meet-in-middle-lab","Double encryption is NOT double security. Meet-in-the-middle on 2DES.","Le double chiffrement n'offre PAS le double de sécurité ! Démontrez l'attaque par rencontre au milieu sur 2DES. Leçon fondamentale de cryptanalyse théorique.","التشفير المزدوج ليس أماناً مضاعفاً. هجوم الالتقاء في المنتصف على 2DES."],
["birthday-paradox-demo","cryptatk","birthday-paradox-demo","Visualize the birthday paradox applied to hash functions. Collision probability.","Visualisez le paradoxe des anniversaires appliqué aux fonctions de hachage cryptographiques. Comprenez intuitivement pourquoi les collisions surviennent si rapidement.","تصوّر مفارقة عيد الميلاد مطبّقة على دوال التجزئة. احتمالات التصادم."],
["entropy-analyzer","cryptatk","entropy-analyzer","Measure randomness quality. Chi-square, Monte Carlo, serial correlation tests.","Analysez la qualité de l'aléatoire : tests statistiques chi-carré, simulation Monte Carlo et corrélation sérielle. Auditez vos générateurs de nombres aléatoires.","قِس جودة العشوائية. اختبارات كاي تربيع ومونتي كارلو والارتباط التسلسلي."],
["gps-spoofing-sim","rfwar","gps-spoofing-sim","Simulate GPS signal spoofing. Move targets on map by broadcasting fake satellites.","Simulez la mystification GPS : déplacez des cibles sur la carte en diffusant de faux signaux satellites. Comprenez les vulnérabilités du positionnement par satellite.","حاكِ تزييف إشارات GPS. حرّك الأهداف على الخريطة ببث أقمار صناعية وهمية."],
["radar-jammer-lab","rfwar","radar-jammer-lab","Design radar jamming waveforms. Noise, deception, DRFM techniques.","Concevez des formes d'onde de brouillage radar : bruit, déception et mémoire numérique RF (DRFM). Laboratoire de guerre électronique (EW) défensive et offensive.","صمّم أشكال موجات تشويش الرادار. ضوضاء وخداع وتقنيات DRFM."],
["drone-hijacker-sim","rfwar","drone-hijacker-sim","Intercept drone control links. Take over 2.4GHz/5.8GHz video and command channels.","Interceptez les liaisons de commande des drones sur 2.4/5.8 GHz. Prenez le contrôle des canaux vidéo et de commande. Laboratoire éducatif de contre-drone.","اعترض روابط التحكم بالطائرات المسيّرة. سيطر على قنوات الفيديو والأوامر."],
["imsi-catcher-sim","rfwar","imsi-catcher-sim","Simulate a cell tower IMSI catcher. Track phones, intercept metadata.","Simulez un capteur IMSI (fausse antenne-relais). Comprenez comment les téléphones sont pistés et les métadonnées interceptées. Sensibilisation à la sécurité cellulaire.","حاكِ ماسك IMSI للأبراج الخلوية. تتبّع الهواتف واعترض البيانات الوصفية."],
["satellite-injection-lab","rfwar","satellite-injection-lab","Inject signals into satellite downlinks. DVB-S stream manipulation.","Injectez des signaux dans les liaisons descendantes satellites et manipulez les flux DVB-S. Laboratoire éducatif sur les vulnérabilités des communications par satellite.","حقن إشارات في الوصلات الهابطة للأقمار الصناعية. تلاعب بتدفقات DVB-S."],
["rf-fingerprint-spoofer","rfwar","rf-fingerprint-spoofer","Clone RF device fingerprints. Impersonate IoT devices by replicating signatures.","Clonez les empreintes radio d'appareils IoT en répliquant leurs signatures RF uniques. Étudiez l'usurpation d'identité radiofréquence et les contre-mesures associées.","استنسخ بصمات الأجهزة الراديوية. انتحل أجهزة إنترنت الأشياء بتقليد التوقيعات."],
["electronic-warfare-sim","rfwar","electronic-warfare-sim","Full electronic warfare simulator. ESM, ECM, ECCM cycle visualization.","Simulateur de guerre électronique (EW) complet : cycle mesures de soutien (ESM), contre-mesures (ECM) et contre-contre-mesures (ECCM) visualisé en temps réel.","محاكي حرب إلكترونية كامل. دورة الدعم والإجراءات المضادة الإلكترونية."],
["spectrum-denial-lab","rfwar","spectrum-denial-lab","Deny spectrum access to adversaries. Reactive jamming, frequency hopping defeat.","Laboratoire de déni d'accès spectral : brouillage réactif intelligent et techniques pour contrer le saut de fréquence adverse. Guerre du spectre électromagnétique.","امنع وصول الخصم للطيف. تشويش تفاعلي وإحباط القفز الترددي."],
["spoofing-detector","rfwar","spoofing-detector","Detect RF spoofing attacks. GPS, ADS-B, AIS, WiFi authentication anomalies.","Détectez les attaques de mystification RF sur GPS, ADS-B, AIS et WiFi. Identifiez les anomalies d'authentification et protégez vos systèmes contre l'usurpation.","اكتشف هجمات تزييف الترددات. شذوذ في GPS وADS-B وAIS ومصادقة WiFi."],
["directed-energy-sim","rfwar","directed-energy-sim","Simulate directed energy weapons. Focused RF beams, EMP effects, shielding.","Simulez les armes à énergie dirigée : faisceaux RF focalisés, effets d'impulsion électromagnétique (EMP) et techniques de blindage. Physique de la guerre électronique.","حاكِ أسلحة الطاقة الموجّهة. أشعة RF مركّزة وتأثيرات النبض الكهرومغناطيسي."],
["meaconing-attack","rfwar","meaconing-attack","Rebroadcast navigation signals to mislead receivers. GPS meaconing techniques.","Rediffusez des signaux de navigation capturés pour tromper les récepteurs GPS distants. Techniques de méaconie : détournement de la navigation par relais de signaux.","أعد بث إشارات الملاحة لتضليل المستقبلات. تقنيات ميكونينغ GPS."],
["comms-interception-hub","rfwar","comms-interception-hub","Central hub for intercepting all communications. Multi-protocol signal capture.","Centre névralgique d'interception des communications : capture et analyse simultanée de signaux multi-protocoles sur toutes les bandes. Fusion du renseignement RF.","مركز اعتراض جميع الاتصالات. التقاط إشارات متعددة البروتوكولات."],
["anti-drone-system","rfwar","anti-drone-system","Build counter-drone RF systems. Detection, tracking, and neutralization.","Construisez des systèmes anti-drone par radiofréquence : détection automatique, poursuite de cible et neutralisation par brouillage ciblé. Contre-menace aérienne.","ابنِ أنظمة مضادة للطائرات المسيّرة. كشف وتتبّع وتحييد."],
["frequency-deconfliction","rfwar","frequency-deconfliction","Manage tactical frequency assignments. Avoid fratricide, optimize spectrum.","Gérez les attributions de fréquences tactiques en temps réel. Évitez les tirs fratricides spectraux et optimisez l'utilisation du spectre en environnement contested.","أدِر تخصيص الترددات التكتيكية. تجنّب الإصابة الصديقة وحسّن استخدام الطيف."],
["cognitive-ew","rfwar","cognitive-ew","AI-driven electronic warfare. Autonomous threat detection and response.","Guerre électronique cognitive pilotée par IA : détection autonome des menaces RF, classification automatique et réponse adaptative en temps réel. EW nouvelle génération.","حرب إلكترونية بالذكاء الاصطناعي. كشف واستجابة ذاتية للتهديدات."],
["anti-forensics-toolkit","escape","anti-forensics-toolkit","Defeat digital forensics. Secure deletion, timestamp manipulation, log wiping.","Contrez la criminalistique numérique : suppression sécurisée des données, manipulation de horodatages et effacement de journaux. Anti-forensique éducatif et défense.","اهزم الطب الشرعي الرقمي. حذف آمن وتلاعب بالطوابع الزمنية ومسح السجلات."],
["metadata-scrubber","escape","metadata-scrubber","Strip all metadata from files. EXIF, Office properties, PDF info, audio tags.","Supprimez toutes les métadonnées révélatrices de vos fichiers : EXIF photographique, propriétés Office, informations PDF et balises audio. Nettoyage numérique complet.","أزل كل البيانات الوصفية. EXIF وخصائص Office ومعلومات PDF وعلامات الصوت."],
["traffic-camouflage","escape","traffic-camouflage","Disguise network traffic as normal browsing. Domain fronting, protocol mimicry.","Camouflage du trafic réseau en navigation ordinaire : façade de domaine (domain fronting), mimétisme protocolaire et tunneling. Techniques d'évasion réseau avancées.","تنكّر حركة الشبكة كتصفّح عادي. واجهة النطاق ومحاكاة البروتوكولات."],
["stylometry-defeater","escape","stylometry-defeater","Change your writing style to avoid identification. NLP-based style transfer.","Modifiez votre style d'écriture pour échapper à l'analyse stylométrique. Transfert de style par traitement automatique du langage naturel (NLP). Anonymat littéraire.","غيّر أسلوب كتابتك لتجنّب التعرّف. نقل الأسلوب بمعالجة اللغة الطبيعية."],
["fingerprint-randomizer","escape","fingerprint-randomizer","Randomize browser and device fingerprints. Canvas, WebGL, audio fingerprinting.","Randomisez les empreintes numériques de votre navigateur : Canvas, WebGL, empreinte audio et polices installées. Contre-mesures au pistage par fingerprinting.","عشوئن بصمات المتصفّح والجهاز. بصمات Canvas وWebGL والصوت."],
["tor-traffic-analyzer","escape","tor-traffic-analyzer","Analyze and detect Tor traffic patterns. Traffic confirmation, timing correlation.","Analysez et détectez les motifs de trafic Tor. Techniques de confirmation par corrélation temporelle et analyse de flux. Comprenez les limites de l'anonymisation.","حلّل أنماط حركة Tor. تأكيد حركة المرور والارتباط الزمني."],
["steganography-suite","escape","steganography-suite","Hide data everywhere. Images, audio, video, network protocols, file systems.","Suite complète de stéganographie : cachez des données chiffrées dans des images, fichiers audio, vidéos, protocoles réseau et systèmes de fichiers. L'art de l'invisible.","أخفِ البيانات في كل مكان. صور وصوت وفيديو وبروتوكولات شبكة وأنظمة ملفات."],
["dead-drop-network","escape","dead-drop-network","Build a network of digital dead drops. Steganographic channels, timing-based.","Construisez un réseau de boîtes mortes numériques (dead drops) avec canaux stéganographiques et synchronisation temporelle. Communication clandestine sans contact direct.","ابنِ شبكة نقاط إسقاط رقمية. قنوات إخفاء المعلومات وتوقيتات مشفّرة."],
["vpn-chain-builder","escape","vpn-chain-builder","Chain multiple VPNs across jurisdictions. Multi-hop anonymization.","Chaînez plusieurs VPN à travers différentes juridictions pour une anonymisation multi-sauts renforcée. Comprenez les forces et limites de chaque couche de protection.","اربط عدة شبكات VPN عبر ولايات قضائية مختلفة. إخفاء هوية متعدد القفزات."],
["burner-identity-gen","escape","burner-identity-gen","Generate disposable digital identities. Temporary emails, numbers, personas.","Générez des identités numériques jetables : adresses email temporaires, numéros virtuels et personas complètes. Compartimentation opérationnelle pour la vie privée.","أنشئ هويات رقمية مؤقتة. بريد إلكتروني مؤقت وأرقام وشخصيات."],
["counter-surveillance-sweep","escape","counter-surveillance-sweep","Comprehensive bug sweep. RF, IR, magnetic, acoustic, and network detection.","Balayage anti-surveillance exhaustif : détection RF, infrarouge, magnétique, acoustique et réseau. Kit de contre-espionnage complet pour sécuriser un espace physique.","مسح شامل لكشف التجسس. كشف ترددات وأشعة تحت حمراء ومغناطيسي وصوتي."],
["secure-comms-hardener","escape","secure-comms-hardener","Harden all communication channels. E2E encryption, perfect forward secrecy.","Durcissez tous vos canaux de communication : chiffrement de bout en bout (E2E), confidentialité persistante parfaite (PFS) et résistance aux compromissions futures.","قوِّ جميع قنوات الاتصال. تشفير طرف لطرف وسرية تامة للإرسال."],
["airgap-jumper","escape","airgap-jumper","Bridge airgapped networks. Acoustic, thermal, electromagnetic covert channels.","Franchissez les réseaux isolés (air-gap) via des canaux cachés : acoustiques, thermiques et électromagnétiques. Étudiez les techniques d'exfiltration sans connexion réseau.","اعبر الشبكات المعزولة. قنوات سرية صوتية وحرارية وكهرومغناطيسية."],
["forensic-evidence-planter","escape","forensic-evidence-planter","Study how evidence can be planted digitally. Defend against frame-ups.","Étudiez comment des preuves numériques peuvent être fabriquées et plantées. Apprenez à vérifier l'authenticité des données et à vous défendre contre les coups montés.","ادرس كيف تُزرع الأدلة رقمياً. دافع ضد التلفيق والتأطير الكاذب."],
["exfiltration-olympics","escape","exfiltration-olympics","Race to exfiltrate data through increasingly difficult channels. DNS, ICMP, timing.","Olympiades de l'exfiltration : course à la sortie de données via DNS, ICMP et canaux temporels de difficulté croissante. Testez vos compétences en communication covert.","سباق تسريب البيانات عبر قنوات متزايدة الصعوبة. DNS وICMP والتوقيت."]

function hwBadges(appId){

  return'<div class="hw-badges">'+files.split(",").map(f=>{

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const t=k=>(I18N[lang]||I18N.en)[k]||(I18N.en)[k]||k;

function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.documentElement.dataset.lang=l;
  $$("[data-setlang]").forEach(b=>b.classList.toggle("on",b.dataset.setlang===l));
  $$("[data-i18n]").forEach(el=>el.innerHTML=t(el.dataset.i18n));
  $$("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $$("[data-i18n-opt]").forEach(el=>el.textContent=t(el.dataset.i18nOpt));
  buildHwBar();render();
}

function setTheme(th){
  document.documentElement.dataset.theme=th;
  $$("[data-settheme]").forEach(b=>b.classList.toggle("on",b.dataset.settheme===th));
}

function injectLogos(){
  const colored=LOGO;
  ["splash-logo","hdr-logo","foot-logo"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=colored;
  });
}

function matchHw(catHw,filter){
  if(filter==="hw_all") return true;
  if(filter==="hw_none") return catHw==="None";
  if(filter==="hw_mix") return catHw.includes("Mixed")||catHw.includes("Full")||catHw.includes("+");
  const map={hw_mb:"micro:bit",hw_esp:"ESP32",hw_hrf:"HackRF",hw_wifi:"WiFi",hw_rpi:"Pi"};
  return catHw.includes(map[filter]||"");
}

function getDesc(app){return app[lang==="fr"?4:lang==="ar"?5:3]}

function filteredApps(){
  const q=search.toLowerCase();
  return A.filter(a=>{
    const cat=CATS.find(c=>c.id===a[1]);
    if(!cat) return false;
    if(!matchHw(cat.hw,hwFilter)) return false;
    if(!q) return true;
    return a[2].toLowerCase().includes(q)||getDesc(a).toLowerCase().includes(q);
  });
}

function buildHwBar(){
  const bar=$("#hw-bar");
  bar.innerHTML=HW_KEYS.map(k=>`<button class="pill${hwFilter===k?" on":""}" data-hw="${k}">${t(k)}</button>`).join("");
  bar.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{hwFilter=b.dataset.hw;buildHwBar();render()});
}


const progress=JSON.parse(localStorage.getItem('ops-progress')||'{}');
function toggleDone(id,e){e.stopPropagation();progress[id]=!progress[id];localStorage.setItem('ops-progress',JSON.stringify(progress));render();}
function render(){
  const apps=filteredApps();
  const votedCount=Object.values(votes).filter(v=>v).length;
  const badge=$("#hdr-badge");
  badge.textContent=votedCount+" "+t("voted");
  badge.className="badge"+(votedCount>0?" active":"");
  $("#export-btn").disabled=votedCount===0;
  $("#summary").textContent=apps.length+" "+t("shown");
  if(voterName) $("#hdr-voter").textContent=voterName;

  let cats=sortBy==="votes"?[...CATS].sort((a,b)=>{
    const av=apps.filter(x=>x[1]===a.id&&votes[x[0]]).length;
    const bv=apps.filter(x=>x[1]===b.id&&votes[x[0]]).length;
    return bv-av;
  }):CATS;

  const container=$("#categories");
  container.innerHTML="";

  cats.forEach(cat=>{
    const catApps=apps.filter(a=>a[1]===cat.id);
    if(!catApps.length) return;
    const catVotes=catApps.filter(a=>votes[a[0]]).length;
    const isOpen=expanded.has(cat.id);

    const section=document.createElement("div");
    section.className="cat-section";

    const hdr=document.createElement("div");
    hdr.className="cat-hdr";
    hdr.innerHTML=`
      <div class="cat-left">
        <span class="cat-arrow${isOpen?" open":""}">&#9654;</span>
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-label">${t(cat.id)}</span>
        <span class="cat-count">${catApps.length}</span>
        <span class="cat-sep">|</span>
        <span class="cat-hw">${cat.hw}</span>
      </div>
      ${catVotes>0?`<span class="cat-votes">${catVotes} ${t("voted")}</span>`:""}
    `;
    hdr.onclick=()=>{expanded.has(cat.id)?expanded.delete(cat.id):expanded.add(cat.id);render()};
    section.appendChild(hdr);

    if(isOpen){
      const grid=document.createElement("div");
      grid.className="grid";
      catApps.forEach(app=>{
        const v=!!votes[app[0]];
        const card=document.createElement("div");
        card.className="card"+(v?" voted":"");
        const appPath=APP_PATH[app[0]];
        const linkHtml=appPath?`<a href="${appPath}/index.html" target="_blank" onclick="event.stopPropagation()">${app[2]}</a>`:app[2];
        card.innerHTML=`
          <div class="card-body">
            <div class="card-name">${linkHtml}</div>
            <div class="card-desc">${getDesc(app)}</div>
            ${hwBadges(app[0])}<div class="card-diff">${"★".repeat(DIFFICULTY[app[0]]||2)+"☆".repeat(3-(DIFFICULTY[app[0]]||2))}</div>${(DIFFICULTY[app[0]]||0)>=3?'<span class="classified">TOP SECRET</span>':""}
          </div>
          <span class="card-done" onclick="toggleDone('${app[0]}',event)">${progress[app[0]]?"✅":"⬜"}</span>
          ${canVote?`<div class="card-check">${v?"&#10003;":""}</div>`:""}
        `;
        if(canVote) card.onclick=()=>{votes[app[0]]=!votes[app[0]];render()};
        grid.appendChild(card);
      });
      section.appendChild(grid);
    }
    container.appendChild(section);
  });
}

function exportVotes(){
  const voted=A.filter(a=>votes[a[0]]);
  const lines=voted.map(a=>{
    const cat=CATS.find(c=>c.id===a[1]);
    return `${t(cat.id)} | ${a[2]} | ${getDesc(a).slice(0,80)}`;
  });
  const text=`WORKSHOP-DIY ROADMAP VOTES\n${voterName||"Anonymous"}\n${"=".repeat(50)}\n${voted.length} projects:\n\n${lines.join("\n")}`;
  const blob=new Blob([text],{type:"text/plain"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`votes-${(voterName||"anon").replace(/\s/g,"-")}.txt`;a.click();
  URL.revokeObjectURL(url);
}

function enterApp(){
  $("#splash").style.display="none";
  $("#main").classList.add("active");

}

});
