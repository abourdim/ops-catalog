<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="terminal" data-lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Workshop-Diy — Ops Catalog</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════ RESET ═══════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;-webkit-font-smoothing:antialiased}

/* ═══════ THEMES ═══════ */
:root{--transition:0.2s ease}

[data-theme="terminal"]{
  --bg:#0a0c10;--bg2:#0d1117;--bg3:#161b22;--border:#21262d;--border2:#30363d;
  --text:#c9d1d9;--text2:#8b949e;--text3:#484f58;--heading:#e6edf3;
  --accent:#00ff88;--accent2:#00cc6a;--accent-bg:rgba(0,255,136,0.06);--accent-border:rgba(0,255,136,0.2);
  --card-hover:rgba(0,255,136,0.03);--voted-bg:rgba(0,255,136,0.05);--voted-border:rgba(0,255,136,0.25);
  --scanline:rgba(0,255,136,0.015);--glow:0 0 20px rgba(0,255,136,0.1);
}
[data-theme="midnight"]{
  --bg:#08090d;--bg2:#0e1018;--bg3:#171a26;--border:#1e2235;--border2:#2a2f45;
  --text:#b8c0d9;--text2:#7580a0;--text3:#4a5070;--heading:#e0e5f5;
  --accent:#6c5ce7;--accent2:#5a4bd1;--accent-bg:rgba(108,92,231,0.06);--accent-border:rgba(108,92,231,0.25);
  --card-hover:rgba(108,92,231,0.04);--voted-bg:rgba(108,92,231,0.06);--voted-border:rgba(108,92,231,0.3);
  --scanline:transparent;--glow:0 0 20px rgba(108,92,231,0.1);
}
[data-theme="ember"]{
  --bg:#0f0a08;--bg2:#161010;--bg3:#201816;--border:#2d2220;--border2:#3d302c;
  --text:#d4b8a8;--text2:#9a7e70;--text3:#6a5448;--heading:#f0ddd0;
  --accent:#ff6b35;--accent2:#e55a28;--accent-bg:rgba(255,107,53,0.06);--accent-border:rgba(255,107,53,0.25);
  --card-hover:rgba(255,107,53,0.04);--voted-bg:rgba(255,107,53,0.06);--voted-border:rgba(255,107,53,0.3);
  --scanline:transparent;--glow:0 0 20px rgba(255,107,53,0.1);
}
[data-theme="arctic"]{
  --bg:#f4f7fa;--bg2:#ffffff;--bg3:#eaeff5;--border:#d0d7e0;--border2:#b8c4d0;
  --text:#3a4555;--text2:#6b7a8d;--text3:#9aa8b8;--heading:#1a2535;
  --accent:#0066cc;--accent2:#0055aa;--accent-bg:rgba(0,102,204,0.06);--accent-border:rgba(0,102,204,0.2);
  --card-hover:rgba(0,102,204,0.03);--voted-bg:rgba(0,102,204,0.06);--voted-border:rgba(0,102,204,0.25);
  --scanline:transparent;--glow:0 0 15px rgba(0,102,204,0.08);
}
[data-theme="phosphor"]{
  --bg:#001100;--bg2:#001a00;--bg3:#002200;--border:#003300;--border2:#004400;
  --text:#33cc33;--text2:#228822;--text3:#116611;--heading:#44ff44;
  --accent:#44ff44;--accent2:#33dd33;--accent-bg:rgba(68,255,68,0.06);--accent-border:rgba(68,255,68,0.2);
  --card-hover:rgba(68,255,68,0.03);--voted-bg:rgba(68,255,68,0.06);--voted-border:rgba(68,255,68,0.25);
  --scanline:rgba(68,255,68,0.02);--glow:0 0 25px rgba(68,255,68,0.15);
}
[data-theme="signal"]{
  --bg:#0c0a14;--bg2:#110e1c;--bg3:#1a1628;--border:#252040;--border2:#352e55;
  --text:#c8b8e8;--text2:#8878b8;--text3:#5a4a80;--heading:#e8ddf8;
  --accent:#00e5ff;--accent2:#00bcd4;--accent-bg:rgba(0,229,255,0.06);--accent-border:rgba(0,229,255,0.2);
  --card-hover:rgba(0,229,255,0.03);--voted-bg:rgba(0,229,255,0.06);--voted-border:rgba(0,229,255,0.25);
  --scanline:rgba(0,229,255,0.01);--glow:0 0 20px rgba(0,229,255,0.1);
}
[data-theme="redshift"]{
  --bg:#100808;--bg2:#180c0c;--bg3:#221414;--border:#331a1a;--border2:#442222;
  --text:#d4a8a8;--text2:#9a6e6e;--text3:#6a4848;--heading:#f0cccc;
  --accent:#ff3355;--accent2:#dd2244;--accent-bg:rgba(255,51,85,0.06);--accent-border:rgba(255,51,85,0.25);
  --card-hover:rgba(255,51,85,0.04);--voted-bg:rgba(255,51,85,0.06);--voted-border:rgba(255,51,85,0.3);
  --scanline:transparent;--glow:0 0 20px rgba(255,51,85,0.1);
}
[data-theme="sand"]{
  --bg:#f5f0e8;--bg2:#faf7f0;--bg3:#ede6d8;--border:#d8cebb;--border2:#c5b8a0;
  --text:#4a4035;--text2:#7a6e60;--text3:#a09585;--heading:#2a2018;
  --accent:#b8860b;--accent2:#9a7209;--accent-bg:rgba(184,134,11,0.06);--accent-border:rgba(184,134,11,0.2);
  --card-hover:rgba(184,134,11,0.03);--voted-bg:rgba(184,134,11,0.06);--voted-border:rgba(184,134,11,0.25);
  --scanline:transparent;--glow:0 0 15px rgba(184,134,11,0.08);
}

/* ═══════ BASE ═══════ */
body{
  background:var(--bg);color:var(--text);
  font-family:'IBM Plex Mono','Menlo',monospace;font-size:13px;line-height:1.6;
  transition:background var(--transition),color var(--transition);
}
[data-lang="ar"] body{font-family:'Noto Sans Arabic','IBM Plex Mono',monospace}
h1,h2,h3,.heading{font-family:'Outfit','Noto Sans Arabic',sans-serif;color:var(--heading)}
a{color:var(--accent);text-decoration:none}

/* ═══════ SCANLINE ═══════ */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,var(--scanline) 0px,var(--scanline) 1px,transparent 1px,transparent 3px);
}

/* ═══════ SCROLLBAR ═══════ */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ═══════ SPLASH ═══════ */
.splash{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.splash-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  padding:48px 40px;max-width:460px;width:100%;text-align:center;
  box-shadow:var(--glow);animation:fadeUp .5s ease;
}
.splash-logo{width:80px;margin:0 auto 20px;display:block}
.splash-logo svg{width:100%;height:auto}
.splash-title{font-size:24px;font-weight:700;margin-bottom:4px}
.splash-sub{color:var(--accent);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:28px;font-weight:500}
.splash-desc{color:var(--text2);font-size:12px;line-height:1.7;margin-bottom:28px}
.splash-input{
  width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border2);
  border-radius:8px;color:var(--heading);font-size:14px;font-family:inherit;outline:none;
  margin-bottom:12px;transition:border-color var(--transition);
}
.splash-input:focus{border-color:var(--accent)}
.splash-input::placeholder{color:var(--text3)}
.btn-primary{
  width:100%;padding:12px;background:var(--accent);color:var(--bg);border:none;
  border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;letter-spacing:1px;text-transform:uppercase;
  transition:all var(--transition);
}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:default;transform:none}
.btn-skip{
  background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;
  margin-top:12px;font-family:inherit;transition:color var(--transition);
}
.btn-skip:hover{color:var(--text2)}

/* ═══════ MAIN LAYOUT ═══════ */
.main{display:none}
.main.active{display:block}
.container{max-width:1120px;margin:0 auto;padding:0 20px}

/* ═══════ HEADER ═══════ */
.hdr{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 85%,transparent 100%);
  padding:14px 0 20px;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:32px;flex-shrink:0}
.hdr-logo svg{width:100%;height:auto;display:block}
.hdr-name{font-family:'Outfit',sans-serif;font-weight:700;font-size:17px;color:var(--heading)}
.hdr-tag{color:var(--text3);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-left:6px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hdr-voter{color:var(--text2);font-size:11px}
.badge{
  padding:3px 11px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid var(--border);color:var(--text2);
}
.badge.active{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent)}
.btn-sm{
  padding:5px 12px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;letter-spacing:.5px;text-transform:uppercase;
  border:none;transition:all var(--transition);
}
.btn-export{background:var(--accent);color:var(--bg)}
.btn-export:disabled{background:var(--border);color:var(--text3);cursor:default}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text2);cursor:pointer;font-family:inherit;font-size:10px;padding:4px 9px;border-radius:5px}
.btn-ghost:hover{border-color:var(--accent-border);color:var(--text)}

/* ═══════ CONTROLS ROW ═══════ */
.controls{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1 1 260px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;pointer-events:none}
.search-input{
  width:100%;padding:8px 12px 8px 32px;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;color:var(--heading);font-size:12px;font-family:inherit;outline:none;
  transition:border-color var(--transition);
}
[dir="rtl"] .search-icon{left:auto;right:11px}
[dir="rtl"] .search-input{padding:8px 32px 8px 12px}
.search-input:focus{border-color:var(--accent-border)}
.search-input::placeholder{color:var(--text3)}
.ctrl-select{
  padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  color:var(--heading);font-size:11px;font-family:inherit;outline:none;cursor:pointer;
}

/* ═══════ TOOLBAR ROWS ═══════ */
.toolbar{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pill{
  padding:3px 11px;border-radius:20px;font-size:10px;cursor:pointer;
  border:1px solid var(--border);color:var(--text2);background:none;
  font-family:inherit;transition:all .15s;white-space:nowrap;
}
.pill:hover{border-color:var(--accent-border)}
.pill.on{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent);font-weight:600}

/* ═══════ SWITCHER BARS ═══════ */
.switchers{margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sw-group{display:flex;gap:3px;align-items:center}
.sw-label{color:var(--text3);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
[dir="rtl"] .sw-label{margin-right:0;margin-left:4px}
.sw-btn{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
  background:none;color:var(--text2);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.sw-btn:hover{border-color:var(--accent-border)}
.sw-btn.on{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent)}

.summary{margin-top:6px;color:var(--text3);font-size:10px}

/* ═══════ CATEGORIES ═══════ */
.categories{padding-bottom:60px}
.cat-section{margin-bottom:2px}
.cat-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;cursor:pointer;border-radius:10px;
  transition:background .15s;user-select:none;
}
.cat-hdr:hover{background:var(--card-hover)}
.cat-left{display:flex;align-items:center;gap:8px}
.cat-arrow{color:var(--text3);font-size:9px;transition:transform .2s;display:inline-block}
.cat-arrow.open{transform:rotate(90deg)}
[dir="rtl"] .cat-arrow{transform:rotate(180deg)}
[dir="rtl"] .cat-arrow.open{transform:rotate(90deg)}
.cat-icon{font-size:17px}
.cat-label{font-family:'Outfit','Noto Sans Arabic',sans-serif;font-weight:600;font-size:13px;color:var(--heading)}
.cat-count{background:var(--bg3);color:var(--text2);padding:1px 7px;border-radius:10px;font-size:10px}
.cat-hw{color:var(--text3);font-size:10px}
.cat-sep{color:var(--border2);font-size:9px}
.cat-votes{
  background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent);
  padding:1px 9px;border-radius:10px;font-size:10px;font-weight:600;
}

/* ═══════ GRID ═══════ */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:7px;padding:4px 0 14px;
  animation:fadeIn .25s ease;
}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;cursor:pointer;transition:all .15s;position:relative;
  display:flex;align-items:flex-start;gap:10px;
}
.card:hover{border-color:var(--accent-border);background:var(--card-hover)}
.card.voted{background:var(--voted-bg);border-color:var(--voted-border)}
.card-body{flex:1;min-width:0}
.card-name{
  font-family:'Outfit','Noto Sans Arabic',sans-serif;font-weight:600;font-size:12.5px;
  color:var(--heading);margin-bottom:5px;word-break:break-word;transition:color .15s;
}
.card.voted .card-name{color:var(--accent)}
.card-name a{color:inherit;text-decoration:none}
.card-name a:hover{text-decoration:underline;opacity:.85}
.card-desc{color:var(--text2);font-size:10.5px;line-height:1.55}
.hw-badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.hw-badge{
  display:inline-block;font-size:9px;line-height:1;padding:2px 5px;border-radius:3px;
  background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent2);
  text-decoration:none;white-space:nowrap;transition:all .15s;
}
.card-done{position:absolute;top:4px;right:4px;font-size:11px;cursor:pointer;opacity:.5}.card-done:hover{opacity:1}.card.completed{border-color:#4a9!important}.card{position:relative}
.card-diff{font-size:9px;color:#d4a03c;letter-spacing:1px;margin-top:3px}
.hw-badge:hover{background:var(--accent-border);color:var(--heading);text-decoration:none}
.card-check{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:1px;
  border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-size:14px;color:transparent;
}
.card-check:hover{transform:scale(1.08)}
.card.voted .card-check{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* ═══════ FOOTER ═══════ */
.foot{
  text-align:center;padding:24px 20px 40px;
  border-top:1px solid var(--border);color:var(--text3);font-size:10px;
}
.foot-logo{width:24px;margin:0 auto 8px;opacity:.3}
.foot-logo svg{width:100%;height:auto;display:block}

/* ═══════ ANIMATIONS ═══════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ═══════ RESPONSIVE ═══════ */
@media(max-width:600px){
  .splash-box{padding:32px 24px}
  .grid{grid-template-columns:1fr}
  .hdr-top{gap:6px}
  .hdr-voter{display:none}
}

/* ═══════ HIDDEN ═══════ */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ═══════ SPLASH ═══════ -->
<div class="splash" id="splash">
<div class="splash-box">
  <div class="splash-logo" id="splash-logo"></div>
  <h1 class="splash-title heading">Workshop-Diy</h1>
  <h2 class="splash-sub heading" data-i18n="splash_sub">Ops Catalog</h2>
  <p class="splash-desc" data-i18n="splash_desc">413 project ideas across 50 categories. Vote on the ones you want built first.</p>
  <input class="splash-input" id="name-input" data-i18n-ph="splash_ph" placeholder="Enter your name" autocomplete="off"/>
  <button class="btn-primary" id="enter-btn" data-i18n="splash_enter" disabled>Enter HQ</button>
  <button class="btn-skip" id="skip-btn" data-i18n="splash_skip">Skip &mdash; browse without voting</button>

  <div class="switchers" style="justify-content:center;margin-top:20px">
    <div class="sw-group">
      <span class="sw-label">Lang</span>
      <button class="sw-btn on" data-setlang="en" title="English">EN</button>
      <button class="sw-btn" data-setlang="fr" title="Français">FR</button>
      <button class="sw-btn" data-setlang="ar" title="العربية">ع</button>
    </div>
    <div class="sw-group">
      <span class="sw-label">Theme</span>
      <button class="sw-btn on" data-settheme="terminal" title="Terminal">🖥</button>
      <button class="sw-btn" data-settheme="midnight" title="Midnight">🌌</button>
      <button class="sw-btn" data-settheme="ember" title="Ember">🔥</button>
      <button class="sw-btn" data-settheme="phosphor" title="Phosphor">💚</button>
      <button class="sw-btn" data-settheme="signal" title="Signal">📡</button>
      <button class="sw-btn" data-settheme="redshift" title="Redshift">🔴</button>
      <button class="sw-btn" data-settheme="arctic" title="Arctic">❄️</button>
      <button class="sw-btn" data-settheme="sand" title="Sand">🏜</button>
    </div>
  </div>
</div>
</div>

<!-- ═══════ MAIN ═══════ -->
<div class="main" id="main">
<div class="hdr"><div class="container">
  <div class="hdr-top">
    <div class="hdr-brand">
      <div class="hdr-logo" id="hdr-logo"></div>
      <span class="hdr-name heading">Workshop-Diy</span>
      <span class="hdr-tag" data-i18n="hdr_tag">OPS CATALOG</span>
    </div>
    <div class="hdr-right">
      <span class="hdr-voter" id="hdr-voter"></span>
      <span class="badge" id="hdr-badge">0</span>
      <button class="btn-sm btn-export" id="export-btn" data-i18n="export" disabled>Export</button>
    </div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-input" id="search" data-i18n-ph="search_ph" placeholder="Search projects..." autocomplete="off"/>
    </div>
    <select class="ctrl-select" id="sort-select">
      <option value="category" data-i18n-opt="sort_cat">By Category</option>
      <option value="votes" data-i18n-opt="sort_votes">By Votes</option>
    </select>
    <button class="btn-ghost" id="expand-btn" data-i18n="expand">Expand All</button>
    <button class="btn-ghost" id="collapse-btn" data-i18n="collapse">Collapse</button>
  </div>
  <div class="toolbar" id="hw-bar"></div>
  <div class="switchers">
    <div class="sw-group">
      <span class="sw-label">Lang</span>
      <button class="sw-btn on" data-setlang="en">EN</button>
      <button class="sw-btn" data-setlang="fr">FR</button>
      <button class="sw-btn" data-setlang="ar">ع</button>
    </div>
    <div class="sw-group">
      <span class="sw-label">Theme</span>
      <button class="sw-btn on" data-settheme="terminal">🖥</button>
      <button class="sw-btn" data-settheme="midnight">🌌</button>
      <button class="sw-btn" data-settheme="ember">🔥</button>
      <button class="sw-btn" data-settheme="phosphor">💚</button>
      <button class="sw-btn" data-settheme="signal">📡</button>
      <button class="sw-btn" data-settheme="redshift">🔴</button>
      <button class="sw-btn" data-settheme="arctic">❄️</button>
      <button class="sw-btn" data-settheme="sand">🏜</button>
    </div>
  </div>
  <div class="summary" id="summary"></div>
</div></div>
<div class="container categories" id="categories"></div>
<div class="foot">

  $$("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $$("[data-i18n-opt]").forEach(el=>el.textContent=t(el.dataset.i18nOpt));
  buildHwBar();render();
}

function setTheme(th){
  document.documentElement.dataset.theme=th;
  $$("[data-settheme]").forEach(b=>b.classList.toggle("on",b.dataset.settheme===th));
}

function injectLogos(){
  const colored=LOGO;
  ["splash-logo","hdr-logo","foot-logo"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=colored;
  });
}

function matchHw(catHw,filter){
  if(filter==="hw_all") return true;
  if(filter==="hw_none") return catHw==="None";
  if(filter==="hw_mix") return catHw.includes("Mixed")||catHw.includes("Full")||catHw.includes("+");
  const map={hw_mb:"micro:bit",hw_esp:"ESP32",hw_hrf:"HackRF",hw_wifi:"WiFi",hw_rpi:"Pi"};
  return catHw.includes(map[filter]||"");
}

function getDesc(app){return app[lang==="fr"?4:lang==="ar"?5:3]}

function filteredApps(){
  const q=search.toLowerCase();
  return A.filter(a=>{
    const cat=CATS.find(c=>c.id===a[1]);
    if(!cat) return false;
    if(!matchHw(cat.hw,hwFilter)) return false;
    if(!q) return true;
    return a[2].toLowerCase().includes(q)||getDesc(a).toLowerCase().includes(q);
  });
}

/* ═══════════════════════════════════════════════════════════
   BUILD
   ═══════════════════════════════════════════════════════════ */
function buildHwBar(){
  const bar=$("#hw-bar");
  bar.innerHTML=HW_KEYS.map(k=>`<button class="pill${hwFilter===k?" on":""}" data-hw="${k}">${t(k)}</button>`).join("");
  bar.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{hwFilter=b.dataset.hw;buildHwBar();render()});
}


const progress=JSON.parse(localStorage.getItem('ops-progress')||'{}');
function toggleDone(id,e){e.stopPropagation();progress[id]=!progress[id];localStorage.setItem('ops-progress',JSON.stringify(progress));render();}
function render(){
  const apps=filteredApps();
  const votedCount=Object.values(votes).filter(v=>v).length;
  const badge=$("#hdr-badge");
  badge.textContent=votedCount+" "+t("voted");
  badge.className="badge"+(votedCount>0?" active":"");
  $("#export-btn").disabled=votedCount===0;
  $("#summary").textContent=apps.length+" "+t("shown");
  if(voterName) $("#hdr-voter").textContent=voterName;

  let cats=sortBy==="votes"?[...CATS].sort((a,b)=>{
    const av=apps.filter(x=>x[1]===a.id&&votes[x[0]]).length;
    const bv=apps.filter(x=>x[1]===b.id&&votes[x[0]]).length;
    return bv-av;
  }):CATS;

  const container=$("#categories");
  container.innerHTML="";

  cats.forEach(cat=>{
    const catApps=apps.filter(a=>a[1]===cat.id);
    if(!catApps.length) return;
    const catVotes=catApps.filter(a=>votes[a[0]]).length;
    const isOpen=expanded.has(cat.id);

    const section=document.createElement("div");
    section.className="cat-section";

    const hdr=document.createElement("div");
    hdr.className="cat-hdr";
    hdr.innerHTML=`
      <div class="cat-left">
        <span class="cat-arrow${isOpen?" open":""}">&#9654;</span>
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-label">${t(cat.id)}</span>
        <span class="cat-count">${catApps.length}</span>
        <span class="cat-sep">|</span>
        <span class="cat-hw">${cat.hw}</span>
      </div>
      ${catVotes>0?`<span class="cat-votes">${catVotes} ${t("voted")}</span>`:""}
    `;
    hdr.onclick=()=>{expanded.has(cat.id)?expanded.delete(cat.id):expanded.add(cat.id);render()};
    section.appendChild(hdr);

    if(isOpen){
      const grid=document.createElement("div");
      grid.className="grid";
      catApps.forEach(app=>{
        const v=!!votes[app[0]];
        const card=document.createElement("div");
        card.className="card"+(v?" voted":"");
        const appPath=APP_PATH[app[0]];
        const linkHtml=appPath?`<a href="${appPath}/index.html" target="_blank" onclick="event.stopPropagation()">${app[2]}</a>`:app[2];
        card.innerHTML=`
          <div class="card-body">
            <div class="card-name">${linkHtml}</div>
            <div class="card-desc">${getDesc(app)}</div>
            ${hwBadges(app[0])}<div class="card-diff">${"★".repeat(DIFFICULTY[app[0]]||2)+"☆".repeat(3-(DIFFICULTY[app[0]]||2))}</div>
          </div>
          `<span class="card-done" onclick="toggleDone('${app[0]}',event)">${progress[app[0]]?\"✅\":\"⬜\"}</span>`+
          ${canVote?`<div class="card-check">${v?"&#10003;":""}</div>`:""}
        `;
        if(canVote) card.onclick=()=>{votes[app[0]]=!votes[app[0]];render()};
        grid.appendChild(card);
      });
      section.appendChild(grid);
    }
    container.appendChild(section);
  });
}

function exportVotes(){
  const voted=A.filter(a=>votes[a[0]]);
  const lines=voted.map(a=>{
    const cat=CATS.find(c=>c.id===a[1]);
    return `${t(cat.id)} | ${a[2]} | ${getDesc(a).slice(0,80)}`;
  });
  const text=`WORKSHOP-DIY ROADMAP VOTES\n${voterName||"Anonymous"}\n${"=".repeat(50)}\n${voted.length} projects:\n\n${lines.join("\n")}`;
  const blob=new Blob([text],{type:"text/plain"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`votes-${(voterName||"anon").replace(/\s/g,"-")}.txt`;a.click();
  URL.revokeObjectURL(url);
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
function enterApp(){
  $("#splash").style.display="none";
  $("#main").classList.add("active");
  render();
}

document.addEventListener("DOMContentLoaded",()=>{
  injectLogos();setLang("en");setTheme("terminal");

  // Splash
  const ni=$("#name-input"),eb=$("#enter-btn"),sb=$("#skip-btn");
  ni.addEventListener("input",()=>eb.disabled=!ni.value.trim());
  ni.addEventListener("keydown",e=>{if(e.key==="Enter"&&ni.value.trim()){voterName=ni.value.trim();enterApp()}});
  eb.addEventListener("click",()=>{if(ni.value.trim()){voterName=ni.value.trim();enterApp()}});
  sb.addEventListener("click",()=>{canVote=false;voterName="";enterApp()});

  // Lang + Theme
  $$("[data-setlang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.setlang)));
  $$("[data-settheme]").forEach(b=>b.addEventListener("click",()=>setTheme(b.dataset.settheme)));

  // Controls
  $("#search").addEventListener("input",e=>{search=e.target.value;render()});
  $("#sort-select").addEventListener("change",e=>{sortBy=e.target.value;render()});
  $("#expand-btn").addEventListener("click",()=>{expanded=new Set(CATS.map(c=>c.id));render()});
  $("#collapse-btn").addEventListener("click",()=>{expanded=new Set();render()});
  $("#export-btn").addEventListener("click",exportVotes);
});
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
