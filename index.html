<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="terminal" data-lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Workshop-Diy — Ops Catalog</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════ RESET ═══════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;-webkit-font-smoothing:antialiased}

/* ═══════ THEMES ═══════ */
:root{--transition:0.2s ease}

[data-theme="terminal"]{
  --bg:#0a0c10;--bg2:#0d1117;--bg3:#161b22;--border:#21262d;--border2:#30363d;
  --text:#c9d1d9;--text2:#8b949e;--text3:#484f58;--heading:#e6edf3;
  --accent:#00ff88;--accent2:#00cc6a;--accent-bg:rgba(0,255,136,0.06);--accent-border:rgba(0,255,136,0.2);
  --card-hover:rgba(0,255,136,0.03);--voted-bg:rgba(0,255,136,0.05);--voted-border:rgba(0,255,136,0.25);
  --scanline:rgba(0,255,136,0.015);--glow:0 0 20px rgba(0,255,136,0.1);
}
[data-theme="midnight"]{
  --bg:#08090d;--bg2:#0e1018;--bg3:#171a26;--border:#1e2235;--border2:#2a2f45;
  --text:#b8c0d9;--text2:#7580a0;--text3:#4a5070;--heading:#e0e5f5;
  --accent:#6c5ce7;--accent2:#5a4bd1;--accent-bg:rgba(108,92,231,0.06);--accent-border:rgba(108,92,231,0.25);
  --card-hover:rgba(108,92,231,0.04);--voted-bg:rgba(108,92,231,0.06);--voted-border:rgba(108,92,231,0.3);
  --scanline:transparent;--glow:0 0 20px rgba(108,92,231,0.1);
}
[data-theme="ember"]{
  --bg:#0f0a08;--bg2:#161010;--bg3:#201816;--border:#2d2220;--border2:#3d302c;
  --text:#d4b8a8;--text2:#9a7e70;--text3:#6a5448;--heading:#f0ddd0;
  --accent:#ff6b35;--accent2:#e55a28;--accent-bg:rgba(255,107,53,0.06);--accent-border:rgba(255,107,53,0.25);
  --card-hover:rgba(255,107,53,0.04);--voted-bg:rgba(255,107,53,0.06);--voted-border:rgba(255,107,53,0.3);
  --scanline:transparent;--glow:0 0 20px rgba(255,107,53,0.1);
}
[data-theme="arctic"]{
  --bg:#f4f7fa;--bg2:#ffffff;--bg3:#eaeff5;--border:#d0d7e0;--border2:#b8c4d0;
  --text:#3a4555;--text2:#6b7a8d;--text3:#9aa8b8;--heading:#1a2535;
  --accent:#0066cc;--accent2:#0055aa;--accent-bg:rgba(0,102,204,0.06);--accent-border:rgba(0,102,204,0.2);
  --card-hover:rgba(0,102,204,0.03);--voted-bg:rgba(0,102,204,0.06);--voted-border:rgba(0,102,204,0.25);
  --scanline:transparent;--glow:0 0 15px rgba(0,102,204,0.08);
}
[data-theme="phosphor"]{
  --bg:#001100;--bg2:#001a00;--bg3:#002200;--border:#003300;--border2:#004400;
  --text:#33cc33;--text2:#228822;--text3:#116611;--heading:#44ff44;
  --accent:#44ff44;--accent2:#33dd33;--accent-bg:rgba(68,255,68,0.06);--accent-border:rgba(68,255,68,0.2);
  --card-hover:rgba(68,255,68,0.03);--voted-bg:rgba(68,255,68,0.06);--voted-border:rgba(68,255,68,0.25);
  --scanline:rgba(68,255,68,0.02);--glow:0 0 25px rgba(68,255,68,0.15);
}
[data-theme="signal"]{
  --bg:#0c0a14;--bg2:#110e1c;--bg3:#1a1628;--border:#252040;--border2:#352e55;
  --text:#c8b8e8;--text2:#8878b8;--text3:#5a4a80;--heading:#e8ddf8;
  --accent:#00e5ff;--accent2:#00bcd4;--accent-bg:rgba(0,229,255,0.06);--accent-border:rgba(0,229,255,0.2);
  --card-hover:rgba(0,229,255,0.03);--voted-bg:rgba(0,229,255,0.06);--voted-border:rgba(0,229,255,0.25);
  --scanline:rgba(0,229,255,0.01);--glow:0 0 20px rgba(0,229,255,0.1);
}
[data-theme="redshift"]{
  --bg:#100808;--bg2:#180c0c;--bg3:#221414;--border:#331a1a;--border2:#442222;
  --text:#d4a8a8;--text2:#9a6e6e;--text3:#6a4848;--heading:#f0cccc;
  --accent:#ff3355;--accent2:#dd2244;--accent-bg:rgba(255,51,85,0.06);--accent-border:rgba(255,51,85,0.25);
  --card-hover:rgba(255,51,85,0.04);--voted-bg:rgba(255,51,85,0.06);--voted-border:rgba(255,51,85,0.3);
  --scanline:transparent;--glow:0 0 20px rgba(255,51,85,0.1);
}
[data-theme="sand"]{
  --bg:#f5f0e8;--bg2:#faf7f0;--bg3:#ede6d8;--border:#d8cebb;--border2:#c5b8a0;
  --text:#4a4035;--text2:#7a6e60;--text3:#a09585;--heading:#2a2018;
  --accent:#b8860b;--accent2:#9a7209;--accent-bg:rgba(184,134,11,0.06);--accent-border:rgba(184,134,11,0.2);
  --card-hover:rgba(184,134,11,0.03);--voted-bg:rgba(184,134,11,0.06);--voted-border:rgba(184,134,11,0.25);
  --scanline:transparent;--glow:0 0 15px rgba(184,134,11,0.08);
}

/* ═══════ BASE ═══════ */
body{
  background:var(--bg);color:var(--text);
  font-family:'IBM Plex Mono','Menlo',monospace;font-size:13px;line-height:1.6;
  transition:background var(--transition),color var(--transition);
}
[data-lang="ar"] body{font-family:'Noto Sans Arabic','IBM Plex Mono',monospace}
h1,h2,h3,.heading{font-family:'Outfit','Noto Sans Arabic',sans-serif;color:var(--heading)}
a{color:var(--accent);text-decoration:none}

/* ═══════ SCANLINE ═══════ */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,var(--scanline) 0px,var(--scanline) 1px,transparent 1px,transparent 3px);
}

/* ═══════ SCROLLBAR ═══════ */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ═══════ SPLASH ═══════ */
.splash{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.splash-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  padding:48px 40px;max-width:460px;width:100%;text-align:center;
  box-shadow:var(--glow);animation:fadeUp .5s ease;
}
.splash-logo{width:80px;margin:0 auto 20px;display:block}
.splash-logo svg{width:100%;height:auto}
.splash-title{font-size:24px;font-weight:700;margin-bottom:4px}
.splash-sub{color:var(--accent);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:28px;font-weight:500}
.splash-desc{color:var(--text2);font-size:12px;line-height:1.7;margin-bottom:28px}
.splash-input{
  width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border2);
  border-radius:8px;color:var(--heading);font-size:14px;font-family:inherit;outline:none;
  margin-bottom:12px;transition:border-color var(--transition);
}
.splash-input:focus{border-color:var(--accent)}
.splash-input::placeholder{color:var(--text3)}
.btn-primary{
  width:100%;padding:12px;background:var(--accent);color:var(--bg);border:none;
  border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;letter-spacing:1px;text-transform:uppercase;
  transition:all var(--transition);
}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:default;transform:none}
.btn-skip{
  background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;
  margin-top:12px;font-family:inherit;transition:color var(--transition);
}
.btn-skip:hover{color:var(--text2)}

/* ═══════ MAIN LAYOUT ═══════ */
.main{display:none}
.main.active{display:block}
.container{max-width:1120px;margin:0 auto;padding:0 20px}

/* ═══════ HEADER ═══════ */
.hdr{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 85%,transparent 100%);
  padding:14px 0 20px;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-logo{width:32px;flex-shrink:0}
.hdr-logo svg{width:100%;height:auto;display:block}
.hdr-name{font-family:'Outfit',sans-serif;font-weight:700;font-size:17px;color:var(--heading)}
.hdr-tag{color:var(--text3);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-left:6px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hdr-voter{color:var(--text2);font-size:11px}
.badge{
  padding:3px 11px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid var(--border);color:var(--text2);
}
.badge.active{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent)}
.btn-sm{
  padding:5px 12px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;letter-spacing:.5px;text-transform:uppercase;
  border:none;transition:all var(--transition);
}
.btn-export{background:var(--accent);color:var(--bg)}
.btn-export:disabled{background:var(--border);color:var(--text3);cursor:default}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text2);cursor:pointer;font-family:inherit;font-size:10px;padding:4px 9px;border-radius:5px}
.btn-ghost:hover{border-color:var(--accent-border);color:var(--text)}

/* ═══════ CONTROLS ROW ═══════ */
.controls{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1 1 260px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;pointer-events:none}
.search-input{
  width:100%;padding:8px 12px 8px 32px;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;color:var(--heading);font-size:12px;font-family:inherit;outline:none;
  transition:border-color var(--transition);
}
[dir="rtl"] .search-icon{left:auto;right:11px}
[dir="rtl"] .search-input{padding:8px 32px 8px 12px}
.search-input:focus{border-color:var(--accent-border)}
.search-input::placeholder{color:var(--text3)}
.ctrl-select{
  padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  color:var(--heading);font-size:11px;font-family:inherit;outline:none;cursor:pointer;
}

/* ═══════ TOOLBAR ROWS ═══════ */
.toolbar{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pill{
  padding:3px 11px;border-radius:20px;font-size:10px;cursor:pointer;
  border:1px solid var(--border);color:var(--text2);background:none;
  font-family:inherit;transition:all .15s;white-space:nowrap;
}
.pill:hover{border-color:var(--accent-border)}
.pill.on{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent);font-weight:600}

/* ═══════ SWITCHER BARS ═══════ */
.switchers{margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sw-group{display:flex;gap:3px;align-items:center}
.sw-label{color:var(--text3);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
[dir="rtl"] .sw-label{margin-right:0;margin-left:4px}
.sw-btn{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
  background:none;color:var(--text2);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.sw-btn:hover{border-color:var(--accent-border)}
.sw-btn.on{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent)}

.summary{margin-top:6px;color:var(--text3);font-size:10px}

/* ═══════ CATEGORIES ═══════ */
.categories{padding-bottom:60px}
.cat-section{margin-bottom:2px}
.cat-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;cursor:pointer;border-radius:10px;
  transition:background .15s;user-select:none;
}
.cat-hdr:hover{background:var(--card-hover)}
.cat-left{display:flex;align-items:center;gap:8px}
.cat-arrow{color:var(--text3);font-size:9px;transition:transform .2s;display:inline-block}
.cat-arrow.open{transform:rotate(90deg)}
[dir="rtl"] .cat-arrow{transform:rotate(180deg)}
[dir="rtl"] .cat-arrow.open{transform:rotate(90deg)}
.cat-icon{font-size:17px}
.cat-label{font-family:'Outfit','Noto Sans Arabic',sans-serif;font-weight:600;font-size:13px;color:var(--heading)}
.cat-count{background:var(--bg3);color:var(--text2);padding:1px 7px;border-radius:10px;font-size:10px}
.cat-hw{color:var(--text3);font-size:10px}
.cat-sep{color:var(--border2);font-size:9px}
.cat-votes{
  background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent);
  padding:1px 9px;border-radius:10px;font-size:10px;font-weight:600;
}


/* EVIL GENIUS UI */
.matrix-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.06}
.card:hover .card-name{animation:glitch .3s ease}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,2px)}80%{transform:translate(1px,-2px)}100%{transform:translate(0)}}
.card:hover{box-shadow:0 0 8px var(--accent-border);text-shadow:0 0 2px var(--accent)}
.classified{position:absolute;top:8px;right:40px;font-size:8px;color:#f44;opacity:.7;font-family:monospace;text-transform:uppercase;transform:rotate(-8deg);border:1px solid #f44;padding:1px 5px;border-radius:2px;pointer-events:none}
.terminal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;padding:20px;overflow-y:auto;font-family:monospace;color:#0f0;font-size:14px}
.terminal-overlay.active{display:block}
.terminal-input{background:none;border:none;color:#0f0;font-family:monospace;font-size:14px;width:calc(100% - 30px);outline:none}
.terminal-prompt{color:#0f0}
#matrixToggle,#terminalToggle{cursor:pointer;opacity:.6;font-size:11px;margin-left:8px}
#matrixToggle:hover,#terminalToggle:hover{opacity:1}

/* ═══════ GRID ═══════ */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:7px;padding:4px 0 14px;
  animation:fadeIn .25s ease;
}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;cursor:pointer;transition:all .15s;position:relative;
  display:flex;align-items:flex-start;gap:10px;
}
.card:hover{border-color:var(--accent-border);background:var(--card-hover)}
.card.voted{background:var(--voted-bg);border-color:var(--voted-border)}
.card-body{flex:1;min-width:0}
.card-name{
  font-family:'Outfit','Noto Sans Arabic',sans-serif;font-weight:600;font-size:12.5px;
  color:var(--heading);margin-bottom:5px;word-break:break-word;transition:color .15s;
}
.card.voted .card-name{color:var(--accent)}
.card-name a{color:inherit;text-decoration:none}
.card-name a:hover{text-decoration:underline;opacity:.85}
.card-desc{color:var(--text2);font-size:10.5px;line-height:1.55}
.hw-badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.hw-badge{
  display:inline-block;font-size:9px;line-height:1;padding:2px 5px;border-radius:3px;
  background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent2);
  text-decoration:none;white-space:nowrap;transition:all .15s;
}
.card-done{position:absolute;top:4px;right:4px;font-size:11px;cursor:pointer;opacity:.5}.card-done:hover{opacity:1}.card.completed{border-color:#4a9!important}.card{position:relative}
.card-diff{font-size:9px;color:#d4a03c;letter-spacing:1px;margin-top:3px}
.hw-badge:hover{background:var(--accent-border);color:var(--heading);text-decoration:none}
.card-check{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:1px;
  border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-size:14px;color:transparent;
}
.card-check:hover{transform:scale(1.08)}
.card.voted .card-check{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* ═══════ FOOTER ═══════ */
.foot{
  text-align:center;padding:24px 20px 40px;
  border-top:1px solid var(--border);color:var(--text3);font-size:10px;
}
.foot-logo{width:24px;margin:0 auto 8px;opacity:.3}
.foot-logo svg{width:100%;height:auto;display:block}

/* ═══════ ANIMATIONS ═══════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ═══════ RESPONSIVE ═══════ */
@media(max-width:600px){
  .splash-box{padding:32px 24px}
  .grid{grid-template-columns:1fr}
  .hdr-top{gap:6px}
  .hdr-voter{display:none}
}

/* ═══════ HIDDEN ═══════ */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ═══════ SPLASH ═══════ -->
<div class="splash" id="splash">
<div class="splash-box">
  <div class="splash-logo" id="splash-logo"></div>
  <h1 class="splash-title heading">Workshop-Diy</h1>
  <h2 class="splash-sub heading" data-i18n="splash_sub">Ops Catalog</h2>
  <p class="splash-desc" data-i18n="splash_desc">488 project ideas across 55 categories. Vote on the ones you want built first.</p>
  <input class="splash-input" id="name-input" data-i18n-ph="splash_ph" placeholder="Enter your name" autocomplete="off"/>
  <button class="btn-primary" id="enter-btn" data-i18n="splash_enter" disabled>Enter HQ</button>
  <button class="btn-skip" id="skip-btn" data-i18n="splash_skip">Skip &mdash; browse without voting</button>

  <div class="switchers" style="justify-content:center;margin-top:20px">
    <div class="sw-group">
      <span class="sw-label">Lang</span>
      <button class="sw-btn on" data-setlang="en" title="English">EN</button>
      <button class="sw-btn" data-setlang="fr" title="Français">FR</button>
      <button class="sw-btn" data-setlang="ar" title="العربية">ع</button>
    </div>
    <div class="sw-group">
      <span class="sw-label">Theme</span>
      <button class="sw-btn on" data-settheme="terminal" title="Terminal">🖥</button>
      <button class="sw-btn" data-settheme="midnight" title="Midnight">🌌</button>
      <button class="sw-btn" data-settheme="ember" title="Ember">🔥</button>
      <button class="sw-btn" data-settheme="phosphor" title="Phosphor">💚</button>
      <button class="sw-btn" data-settheme="signal" title="Signal">📡</button>
      <button class="sw-btn" data-settheme="redshift" title="Redshift">🔴</button>
      <button class="sw-btn" data-settheme="arctic" title="Arctic">❄️</button>
      <button class="sw-btn" data-settheme="sand" title="Sand">🏜</button>
    </div>
  </div>
</div>
</div>

<!-- ═══════ MAIN ═══════ -->
<div class="main" id="main">
<div class="hdr"><div class="container">
  <div class="hdr-top">
    <div class="hdr-brand">
      <div class="hdr-logo" id="hdr-logo"></div>
      <span class="hdr-name heading">Workshop-Diy</span>
      <span class="hdr-tag" data-i18n="hdr_tag">OPS CATALOG</span>
    </div>
    <div class="hdr-right">
      <span class="hdr-voter" id="hdr-voter"></span>
      <span class="badge" id="hdr-badge">0</span>
      <button class="btn-sm btn-export" id="export-btn" data-i18n="export" disabled>Export</button>
    </div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input class="search-input" id="search" data-i18n-ph="search_ph" placeholder="Search projects..." autocomplete="off"/>
    </div>
    <select class="ctrl-select" id="sort-select">
      <option value="category" data-i18n-opt="sort_cat">By Category</option>
      <option value="votes" data-i18n-opt="sort_votes">By Votes</option>

["dead-drop","spy-mb","dead-drop","micro:bit stores encrypted messages. Two agents bump micro:bits (BLE handshake) to transfer secrets. No internet, no trace.","Le micro:bit stocke des messages chiffrés localement. Deux agents rapprochent leurs appareils pour un transfert via protocole BLE — aucun serveur, aucune trace réseau. Initiation au chiffrement pair-à-pair.","يخزن micro:bit رسائل مشفرة ويتبادلها عميلان عبر مصافحة بلوتوث منخفض الطاقة (BLE) بمجرد تقريب الجهازين. نقل سري بدون إنترنت ولا أثر رقمي."],
["shake-cipher","spy-mb","shake-cipher","Shake micro:bit in a secret pattern to unlock a hidden message. Wrong pattern shows decoy.","Secouez le micro:bit selon un motif gestuel secret pour déchiffrer un message. L'accéléromètre vérifie la séquence — un mauvais motif déclenche un leurre. Initiation au chiffrement cinétique.","هز micro:bit بنمط حركي سري لفك تشفير رسالة مخفية. مستشعر التسارع يتحقق من التسلسل، والنمط الخاطئ يعرض رسالة مضللة كطعم."],
["stealth-alarm","spy-mb","stealth-alarm","Light sensor detects broken beams, accelerometer detects pickup. Browser silently logs intrusions.","Le capteur de lumière détecte la rupture de faisceaux et l'accéléromètre repère toute manipulation physique. Le navigateur journalise chaque intrusion silencieusement — système d'alarme furtif.","مستشعر الضوء يكشف انقطاع الأشعة ومقياس التسارع يرصد رفع الجهاز. المتصفح يسجل محاولات التسلل بصمت تام دون إنذار مرئي."],
["spy-compass","spy-mb","spy-compass","Compass + accelerometer guide agent to waypoints. Reach target zone to unlock secret file.","La boussole numérique et l'accéléromètre guident l'agent vers des coordonnées secrètes. Atteignez la zone cible pour déverrouiller le dossier classifié — navigation terrain avec capteurs réels.","البوصلة الرقمية ومقياس التسارع يرشدان العميل نحو نقاط إحداثيات سرية. عند بلوغ المنطقة المستهدفة يُفتح ملف المهمة السري تلقائياً."],
["micro-wire","spy-mb","micro-wire","micro:bit mic streams audio to browser via BLE. Real-time transcription with Web Speech API.","Le microphone du micro:bit diffuse l'audio vers le navigateur via Bluetooth Low Energy. Transcription vocale en temps réel grâce à l'API Web Speech — découvrez le traitement du signal audio.","ميكروفون micro:bit يبث الصوت مباشرة إلى المتصفح عبر بلوتوث منخفض الطاقة مع تحويل فوري للكلام إلى نص باستخدام واجهة Web Speech API."],
["panic-button","spy-mb","panic-button","Shake hard or press both buttons — browser sends alert, wipes mission data, shows decoy screen.","Secouez violemment ou pressez les deux boutons pour activer le protocole d'urgence — alerte transmise, données de mission effacées et écran de couverture affiché. Apprenez l'effacement sécurisé.","هز الجهاز بقوة أو اضغط كلا الزرين لتفعيل وضع الطوارئ — يُرسل تنبيه فوري وتُمسح بيانات المهمة وتظهر شاشة تمويهية."],
["field-scanner","spy-mb","field-scanner","Reads magnetic field, light, temp, sound. Browser displays spy HUD threat assessment.","Analyse le champ magnétique, la luminosité, la température et le niveau sonore via les capteurs intégrés. Le navigateur affiche un tableau de bord d'évaluation des menaces style renseignement.","يقيس المجال المغناطيسي وشدة الضوء ودرجة الحرارة ومستوى الصوت. المتصفح يعرض لوحة تقييم تهديدات استخباراتية بأسلوب الماسحات العسكرية."],
["agent-id","spy-mb","agent-id","Encrypted agent profile on micro:bit. Custom BLE handshake authenticates. Wrong sequence = alarm.","Profil d'agent chiffré stocké sur le micro:bit. Authentification par protocole de poignée de main BLE personnalisé — toute séquence erronée déclenche l'alarme. Apprenez l'authentification matérielle.","ملف تعريف عميل مشفر مخزن على micro:bit. بروتوكول مصافحة BLE مخصص للمصادقة الآمنة، وأي تسلسل خاطئ يطلق إنذار اختراق فوري."],
["invisible-ink","spy-mb","invisible-ink","Draw message on screen — it vanishes. Only specific micro:bit with right combo reveals it. Self-destructs after one read.","Dessinez un message à l'écran — il disparaît instantanément. Seul le micro:bit détenant la bonne clé de chiffrement peut le révéler, puis il s'autodétruit après une seule lecture.","ارسم رسالة على الشاشة فتختفي فوراً. فقط micro:bit يحمل المفتاح الصحيح يستطيع كشفها. الرسالة تتلف ذاتياً بعد قراءة واحدة فقط."],
// SPY — ESP32
["dark-net-radio","spy-esp","dark-net-radio","ESP32 creates private WiFi mesh (no internet). Encrypted text/voice. Fully offline, untraceable.","L'ESP32 crée un réseau maillé WiFi privé sans accès internet. Communications texte et voix chiffrées de bout en bout. Fonctionne entièrement hors ligne et reste intraçable.","ESP32 ينشئ شبكة WiFi شبكية خاصة بالكامل بدون إنترنت. اتصالات نصية وصوتية مشفرة بتشفير قوي. تعمل دون اتصال وغير قابلة للتتبع."],
["packet-sniffer-101","spy-esp","packet-sniffer-101","ESP32 monitor mode captures WiFi packets. Browser visualizes as live radar.","L'ESP32 en mode moniteur capture les paquets WiFi transitant dans les airs. Le navigateur les affiche sur un radar en temps réel — apprenez l'analyse de trafic réseau sans fil.","ESP32 في وضع المراقبة يلتقط حزم الشبكة اللاسلكية المارة في الهواء. المتصفح يعرض البيانات الملتقطة كرادار حي بتصور بصري فوري."],
["ghost-beacon","spy-esp","ghost-beacon","ESP32 broadcasts BLE beacons with hidden encoded messages. Only right app decodes them.","L'ESP32 diffuse des balises Bluetooth Low Energy contenant des messages encodés invisibles. Seule l'application possédant la bonne clé peut les décoder — stéganographie radiofréquence.","ESP32 يبث إشارات بلوتوث منخفض الطاقة تحمل رسائل مخفية مرمّزة داخل البيانات. فقط التطبيق المعتمد بالمفتاح الصحيح يستطيع فك ترميزها."],
["dead-zone","spy-esp","dead-zone","Detects all WiFi devices in range. Find hidden phones, spot cameras, discover who's nearby.","Détecte tous les appareils WiFi dans le périmètre. Repérez téléphones dissimulés, caméras de surveillance et appareils espions — apprenez la cartographie des émissions radiofréquence.","يكتشف جميع أجهزة WiFi ضمن النطاق اللاسلكي. ابحث عن الهواتف المخفية واكشف كاميرات المراقبة واعرف من يتواجد بقربك لاسلكياً."],
["shadow-cam","spy-esp","shadow-cam","ESP32-CAM with motion detection. Captures, encrypts, auto-deletes after viewing. Face blur built in.","ESP32-CAM avec détection de mouvement intégrée. Capture les images, les chiffre automatiquement et les supprime après consultation. Floutage facial inclus pour la protection de la vie privée.","كاميرا ESP32-CAM مع مستشعر كشف الحركة. تلتقط الصور وتشفرها وتحذفها تلقائياً بعد المشاهدة. خاصية تمويه الوجوه مدمجة لحماية الخصوصية."],
["frequency-hunter","spy-esp","frequency-hunter","Scans radio frequencies, visualizes signal activity. Hunt hidden transmitters with hot/cold feedback.","Balayage des fréquences radio avec visualisation de l'activité spectrale. Traquez les émetteurs cachés grâce à un indicateur chaud/froid — apprenez la radiogoniométrie par la pratique.","يمسح نطاقات الترددات الراديوية ويعرض نشاط الإشارات بصرياً. اصطد المرسلات المخفية بتوجيه ساخن/بارد يرشدك نحو المصدر."],
["usb-rubber-ducky","spy-esp","usb-rubber-ducky","ESP32-S2 as USB keyboard. Write harmless payloads, deploy via USB. Teaches USB attack vectors.","L'ESP32-S2 se fait passer pour un clavier USB et exécute des commandes automatisées. Écrivez des charges utiles éducatives et découvrez les vecteurs d'attaque USB en cybersécurité.","ESP32-S2 يتظاهر كلوحة مفاتيح USB لتنفيذ أوامر آلية. اكتب حمولات تعليمية غير ضارة وتعلم كيف تعمل ناقلات هجوم USB في الأمن السيبراني."],
["vault","spy-esp","vault","Fingerprint + NFC + keypad. Three-factor auth to unlock vault interface.","Empreinte digitale + lecteur NFC + code clavier : authentification à trois facteurs pour déverrouiller l'interface du coffre-fort numérique. Explorez la sécurité multicouche en pratique.","نظام مصادقة ثلاثي العوامل يجمع بين بصمة الإصبع وبطاقة NFC ورمز لوحة المفاتيح. اجتز الثلاثة لفتح واجهة الخزنة الرقمية الآمنة."],
["wifi-jammer-detector","spy-esp","wifi-jammer-detector","Monitors deauth packets in real time. Alerts on network attacks. Defensive cybersecurity.","Surveille les paquets de désauthentification WiFi en temps réel et alerte dès qu'une attaque réseau est détectée. Outil de cybersécurité défensive pour protéger votre réseau sans fil.","يراقب حزم إلغاء المصادقة اللاسلكية في الزمن الحقيقي. ينبهك فوراً عند اكتشاف هجمات على الشبكة. أداة أمن سيبراني دفاعية عملية."],
["tor-relay-visual","spy-esp","tor-relay-visual","Routes messages through multiple ESP32 nodes. Browser visualizes onion routing path.","Achemine les messages chiffrés à travers plusieurs nœuds ESP32 simulant le réseau Tor. Le navigateur visualise le routage en oignon couche par couche — découvrez l'anonymisation réseau.","يوجه الرسائل المشفرة عبر سلسلة عقد ESP32 متعددة تحاكي شبكة Tor. المتصفح يعرض مسار التوجيه البصلي طبقة بطبقة بصرياً."],
// SPY — Browser
["cipher-suite","spy-web","cipher-suite","All-in-one crypto: Caesar, Vigenere, RSA, AES, steganography. One-time pads.","Suite cryptographique complète : chiffrement de César, Vigenère, RSA, AES et stéganographie. Explorez aussi les masques jetables pour un chiffrement théoriquement incassable.","مجموعة تشفير متكاملة تضم خوارزميات قيصر وفيجنير وRSA وAES وتقنية إخفاء المعلومات في الصور. مع دفاتر الاستخدام الواحد للسرية التامة."],
["steganography-lab","spy-web","steganography-lab","Hide secret messages inside normal images. Only the app can extract them.","Dissimulez des messages secrets dans des images d'apparence ordinaire grâce à la stéganographie. Personne ne soupçonne leur présence — seule cette application peut les extraire et les révéler.","أخفِ رسائل سرية داخل صور عادية المظهر باستخدام تقنية إخفاء المعلومات. لا أحد يشك بوجودها وفقط هذا التطبيق يستطيع استخراجها."],
["metadata-detective","spy-web","metadata-detective","Upload any photo, extract hidden metadata: GPS, camera, timestamp. See what photos reveal.","Importez n'importe quelle photo et extrayez ses métadonnées EXIF cachées : coordonnées GPS, modèle d'appareil, horodatage. Découvrez ce que vos photos révèlent à votre insu.","ارفع أي صورة واستخرج بياناتها الوصفية المخفية: إحداثيات GPS ونوع الكاميرا والطابع الزمني. اكتشف ما تكشفه صورك عنك دون علمك."],
["dark-profile","spy-web","dark-profile","Paste username, search across platforms. Teaches digital footprint and privacy.","Collez un pseudonyme et recherchez sa présence sur de multiples plateformes. Apprenez les concepts d'empreinte numérique et de protection de la vie privée en ligne de manière concrète.","الصق اسم مستخدم وابحث عن تواجده عبر منصات متعددة. يعلّمك مفهوم البصمة الرقمية وأهمية حماية الخصوصية على الإنترنت."],
["onion-simulator","spy-web","onion-simulator","Visual Tor/onion routing simulation. Watch messages bounce through encrypted relay nodes.","Simulation visuelle du routage en oignon type Tor. Observez les messages rebondir entre des nœuds relais chiffrés multicouches — chaque couche de chiffrement est retirée à chaque saut.","محاكاة بصرية تفاعلية لنظام التوجيه البصلي Tor. شاهد الرسائل وهي تتنقل عبر عقد ترحيل مشفرة متعددة الطبقات لإخفاء هوية المرسل."],
["phishing-trainer","spy-web","phishing-trainer","Fake vs real login pages, emails, URLs. Score points spotting fakes.","Distinguez les vraies pages de connexion, emails et URLs des contrefaçons. Gagnez des points en repérant les tentatives d'hameçonnage — entraînement essentiel en cybersécurité défensive.","تدرب على التمييز بين صفحات تسجيل الدخول والرسائل وعناوين URL المزيفة والحقيقية. اكسب نقاطاً بكشف محاولات التصيد الاحتيالي."],
["burner-chat","spy-web","burner-chat","P2P encrypted chat (WebRTC). No server, no history. Close tab = gone forever.","Messagerie pair-à-pair chiffrée via WebRTC. Aucun serveur intermédiaire, aucun historique conservé. Fermez l'onglet et tout disparaît — découvrez le chiffrement éphémère de bout en bout.","دردشة مشفرة من نظير إلى نظير عبر تقنية WebRTC. بدون خادم وسيط ولا سجل محادثات. أغلق التبويب وتختفي الرسائل إلى الأبد."],
["password-cracker-sim","spy-web","password-cracker-sim","Visual brute force, dictionary, rainbow table attacks. Watch passwords crack in real time.","Simulation visuelle d'attaques par force brute, dictionnaire et tables arc-en-ciel. Observez le cassage de mots de passe en temps réel et comprenez pourquoi le hachage salé est essentiel.","محاكاة بصرية لهجمات القوة الغاشمة والقواميس وجداول قوس قزح. شاهد كلمات المرور وهي تُكسر أمامك في الزمن الحقيقي لتتعلم اختيار كلمات أقوى."],
["network-map","spy-web","network-map","WebRTC peer discovery as spy network graph. Encrypted messages through the network.","Découverte automatique des pairs via WebRTC, visualisée sous forme de graphe de réseau d'espionnage. Échangez des messages chiffrés à travers les nœuds — topologie réseau interactive.","اكتشاف الأقران عبر WebRTC وعرضهم كرسم بياني لشبكة تجسس تفاعلية. تبادل رسائل مشفرة بين العقد عبر مسارات الشبكة."],
["exif-eraser","spy-web","exif-eraser","Strip all metadata from photos before sharing. Learn what data phones embed.","Supprimez toutes les métadonnées EXIF de vos photos avant de les partager. Découvrez quelles données sensibles (GPS, appareil, heure) votre téléphone intègre dans chaque cliché.","أزل جميع البيانات الوصفية من صورك قبل مشاركتها لحماية خصوصيتك. تعلم ما تدمجه الهواتف من معلومات مخفية في كل صورة تلتقطها."],
// SPY — Combos
["spy-kit-pro","spy-combo","spy-kit-pro","Full loadout: micro:bit wearable + ESP32 field device + browser HQ. Encrypted comms, missions.","Kit d'espionnage complet : micro:bit comme gadget portable, ESP32 comme dispositif de terrain et navigateur comme quartier général. Communications chiffrées et missions coordonnées.","عدة تجسس كاملة: micro:bit قابل للارتداء كأداة ميدانية + ESP32 كجهاز اتصالات ميداني + المتصفح كمقر قيادة. اتصالات مشفرة ومهام تجسسية."],
["capture-the-flag-spy","spy-combo","capture-the-flag","Physical CTF: ESP32s broadcast clues, micro:bit scans, browser tracks. Teams compete.","Capture du drapeau physique et numérique : les ESP32 diffusent des indices chiffrés, le micro:bit les scanne et le navigateur suit la progression. Compétition d'équipes en temps réel.","مسابقة التقاط العلم فعلية وميدانية: ESP32 يبث أدلة مشفرة وmicro:bit يمسح ويجمعها والمتصفح يتتبع التقدم. فرق تتنافس في الميدان."],
["escape-hq","spy-combo","escape-hq","Spy escape room: ESP32 locks/sensors, micro:bit gadget, browser puzzles and storyline.","Escape room d'espionnage : l'ESP32 contrôle serrures et capteurs, le micro:bit sert de gadget d'agent et le navigateur gère les énigmes et le scénario. Immersion totale multi-appareils.","غرفة هروب تجسسية تفاعلية: ESP32 يتحكم بالأقفال والمستشعرات وmicro:bit كأداة العميل السرية والمتصفح يدير الألغاز وخط القصة التشويقي."],
// NET — ESP32
["mesh-whisper","net-esp","mesh-whisper","Self-healing mesh. Messages hop node to node. Kill a node — mesh reroutes. Visualize every hop.","Réseau maillé auto-réparant : les messages sautent de nœud en nœud. Supprimez une unité et le maillage se reconfigure automatiquement — visualisez chaque saut et la topologie dynamique.","شبكة شبكية ذاتية الإصلاح حيث تقفز الرسائل من عقدة لأخرى. أزل أي عقدة وشاهد الشبكة تعيد توجيه نفسها تلقائياً مع تصور كل قفزة بصرياً."],
["dead-letter-box","net-esp","dead-letter-box","ESP32 hidden WiFi AP. Agents connect to find encrypted files. Digital dead drops.","L'ESP32 agit comme point d'accès WiFi furtif pour l'échange de fichiers chiffrés. Les agents se connectent discrètement pour récupérer les documents — boîte aux lettres morte numérique.","ESP32 يعمل كنقطة وصول WiFi مخفية لتبادل الملفات المشفرة. العملاء يتصلون سراً للعثور على المستندات وتنزيلها. نقطة إسقاط رقمية سرية."],
["packet-storm","net-esp","packet-storm","ESP32 generates fake local traffic. Cyberpunk visualization. Learn packet headers.","L'ESP32 génère du trafic réseau local simulé avec une visualisation style cyberpunk. Apprenez la structure des en-têtes de paquets IP, TCP et UDP de manière immersive.","ESP32 يولد حركة مرور شبكية محلية وهمية مع تصور بصري بأسلوب سايبربانك. تعلم بنية رؤوس حزم البيانات وكيف تتنقل عبر الشبكة."],
["rogue-ap-detector","net-esp","rogue-ap-detector","Scans WiFi APs, fingerprints them. Unknown AP (evil twin)? Alert with full details.","Scanne et prend l'empreinte numérique de chaque point d'accès WiFi. Un AP inconnu usurpant votre réseau (jumeau maléfique) ? Alerte immédiate avec détails techniques complets.","يمسح نقاط وصول WiFi ويأخذ بصمتها الرقمية الفريدة. اكتشف نقطة وصول مجهولة تنتحل هوية شبكتك (هجوم التوأم الشرير)؟ تنبيه فوري بالتفاصيل."],
["network-cartographer","net-esp","network-cartographer","Scans WiFi, BLE, ESP-NOW. Builds live map of invisible radio landscape.","Scanne simultanément WiFi, Bluetooth Low Energy et ESP-NOW. Construit une cartographie en direct du paysage radiofréquence invisible qui vous entoure — exploration spectrale interactive.","يمسح شبكات WiFi وبلوتوث وESP-NOW في محيطك. يبني خريطة حية ومتجددة للمشهد الراديوي غير المرئي من حولك بتصور تفاعلي."],
["signal-ghost","net-esp","signal-ghost","Rapidly switches MAC addresses, appearing as hundreds of phantom devices.","Permute les adresses MAC à haute fréquence, faisant apparaître des centaines d'appareils fantômes sur le réseau. Apprenez les techniques d'usurpation d'identité réseau et de camouflage sans fil.","يبدل عناوين التحكم بالوصول (MAC) بسرعة فائقة ليظهر كمئات من الأجهزة الشبحية الوهمية على الشبكة. تعلم تقنيات التمويه اللاسلكي."],
["esp-honeypot","net-esp","esp-honeypot","Fake SSH, HTTP login, FTP. Browser logs every connection attempt. Real honeypot.","Services SSH, HTTP et FTP fictifs fonctionnant comme des pots de miel. Le navigateur journalise chaque tentative de connexion pour analyser le comportement des attaquants en détail.","خدمات SSH وHTTP وFTP مزيفة تعمل كمصائد أمنية حقيقية. المتصفح يسجل كل محاولة اتصال ودخول بالتفصيل لتحليل سلوك المهاجمين."],
["dns-playground","net-esp","dns-playground","ESP32 tiny DNS server. Redirect domains from browser. Teaches DNS poisoning.","Serveur DNS miniature sur ESP32. Redirigez les noms de domaine depuis le navigateur et comprenez comment fonctionne l'empoisonnement de cache DNS et ses implications en cybersécurité.","خادم نظام أسماء النطاقات (DNS) مصغر على ESP32. أعد توجيه النطاقات من المتصفح وتعلم كيف يعمل تسميم DNS وتأثيره على الأمان."],
["arp-detective","net-esp","arp-detective","Monitors ARP tables. Visualizes who talks to who, spots ARP spoofing and MITM.","Surveille les tables ARP du réseau local et visualise les communications entre appareils. Détecte les attaques par usurpation ARP et les interceptions de type homme du milieu (MITM).","يراقب جداول بروتوكول تحليل العناوين (ARP) ويعرض بصرياً من يتواصل مع من على الشبكة. يكشف هجمات انتحال ARP وهجمات الرجل في الوسط."],
["captive-portal-lab","net-esp","captive-portal-lab","WiFi with captive portal you design. Learn how hotel WiFi works and abuse vectors.","Créez un réseau WiFi avec un portail captif que vous concevez vous-même. Comprenez le fonctionnement des réseaux d'hôtels et d'aéroports ainsi que leurs failles de sécurité potentielles.","شبكة WiFi مع بوابة تسجيل أسيرة تصممها بنفسك. تعلم كيف تعمل شبكات WiFi في الفنادق والمطارات وكيف يمكن استغلال ثغراتها الأمنية."],
["wifi-thermometer","net-esp","wifi-thermometer","Maps WiFi signal strength as you walk. Live heatmap. Find dead zones.","Cartographiez la puissance du signal WiFi en vous déplaçant. Générez une carte thermique en direct pour identifier les zones mortes et optimiser le placement de vos points d'accès sans fil.","يرسم خريطة حرارية حية لقوة إشارة WiFi أثناء تجولك في المكان. اكتشف المناطق الميتة ونقاط الضعف في تغطية شبكتك اللاسلكية."],
["spectrum-wars-net","net-esp","spectrum-wars","Multiple ESP32s compete for bandwidth. Visualize collisions and throughput collapse.","Plusieurs ESP32 rivalisent pour la même bande passante radiofréquence. Visualisez les collisions de paquets et l'effondrement du débit — apprenez la gestion du spectre et l'accès multiple.","عدة أجهزة ESP32 تتنافس على نفس النطاق الترددي في آن واحد. شاهد تصادم الحزم وانهيار معدل النقل بصرياً لفهم إدارة الطيف الراديوي."],
// NET — Browser
["traceroute-quest","net-web","traceroute-quest","Visual traceroute across globe. Every hop on animated world map through cities and cables.","Traceroute visuel à travers le globe. Chaque saut réseau est animé sur une carte mondiale, traversant villes et câbles sous-marins — découvrez le chemin réel de vos données sur Internet.","تتبع مسار الحزم بصرياً عبر الكرة الأرضية. شاهد كل قفزة شبكية على خريطة عالمية متحركة تمر عبر المدن وكابلات الألياف البحرية."],
["protocol-decoder","net-web","protocol-decoder","Paste raw hex packet. Animated layer-by-layer decode: Ethernet > IP > TCP > HTTP.","Collez un paquet hexadécimal brut et observez son décodage animé couche par couche : Ethernet, IP, TCP puis HTTP. Apprenez le modèle OSI de manière visuelle et interactive.","الصق حزمة بيانات سداسية عشرية خام وشاهد فك ترميزها بالتحريك طبقة بطبقة: إيثرنت ثم IP ثم TCP ثم HTTP. تعلم نموذج الشبكة بصرياً."],
["subnet-architect","net-web","subnet-architect","Design networks visually: drag routers, switches, hosts. Simulate traffic and failures.","Concevez des architectures réseau par glisser-déposer : routeurs, commutateurs, hôtes. Simulez le flux de trafic et testez des scénarios de panne et de basculement en temps réel.","صمم بنية الشبكات بصرياً بسحب وإفلات الموجهات والمحولات والأجهزة المضيفة. حاكِ حركة المرور واختبر سيناريوهات الأعطال والاسترداد."],
["firewall-fortress","net-web","firewall-fortress","Tower defense with firewall rules. Packets stream in — write rules to block attacks.","Jeu de défense de tour basé sur les règles de pare-feu. Les paquets de données affluent vers votre réseau — rédigez des règles de filtrage intelligentes pour bloquer les attaques entrantes.","لعبة دفاع برجي تعتمد على كتابة قواعد جدار الحماية. حزم البيانات تتدفق نحوك — اكتب قواعد تصفية ذكية لصد الهجمات وحماية الشبكة."],
["port-scanner-sim","net-web","port-scanner-sim","Simulated Nmap: scan virtual servers, discover ports, services, OS fingerprints. CTF scoring.","Simulateur Nmap : scannez des serveurs virtuels pour découvrir les ports ouverts, les services actifs et les empreintes d'OS. Système de notation style Capture The Flag pour la compétition.","محاكاة لأداة Nmap: امسح خوادم افتراضية واكتشف المنافذ المفتوحة والخدمات وبصمات أنظمة التشغيل. نظام تسجيل نقاط بأسلوب مسابقات CTF."],
["vpn-tunnel-visual","net-web","vpn-tunnel-visual","Animated VPN: data encrypted, tunneled, exits. Toggle off = data exposed.","Animation interactive d'un VPN : observez vos données se chiffrer, traverser un tunnel sécurisé et ressortir. Désactivez le chiffrement pour voir les données exposées aux interceptions.","محاكاة متحركة لشبكة VPN: شاهد البيانات تُشفَّر وتمر عبر نفق آمن ثم تخرج. أوقف التشفير لترى كيف تصبح البيانات مكشوفة للمتطفلين."],
["mitm-sim","net-web","man-in-the-middle-sim","Three-party sim: Alice, Bob, Eve. Play as Eve intercepting. Then defend with encryption.","Simulation d'attaque homme du milieu avec Alice, Bob et Eve. Incarnez Eve pour intercepter les messages, puis apprenez comment le chiffrement asymétrique protège les communications.","محاكاة هجوم الرجل في الوسط بثلاثة أطراف: أليس وبوب وإيف. العب دور إيف في اعتراض الرسائل ثم تعلم كيف يحمي التشفير منه."],
["certificate-inspector","net-web","certificate-inspector","Paste URL, visualize TLS certificate chain: root CA > intermediate > leaf.","Collez une URL et visualisez toute la chaîne de certificats TLS : de l'autorité racine au certificat intermédiaire jusqu'au certificat du site. Comprenez l'infrastructure à clé publique (PKI).","الصق أي عنوان URL وتصور سلسلة شهادات الأمان TLS بالكامل بصرياً: من سلطة التصديق الجذرية إلى الوسيطة إلى شهادة الموقع النهائية."],
["dns-odyssey","net-web","dns-odyssey","Type domain, watch full recursive DNS resolution animated step by step.","Tapez un nom de domaine et suivez la résolution DNS récursive complète en animation pas à pas : du serveur racine aux serveurs de noms jusqu'à l'adresse IP finale. Comprenez le DNS en profondeur.","اكتب اسم نطاق وشاهد عملية تحليل DNS التكراري الكاملة متحركة خطوة بخطوة. من الخادم الجذري حتى الحصول على عنوان IP النهائي."],
["bgp-simulator","net-web","bgp-simulator","Simplified BGP sim. Run autonomous systems, inject bad routes, hijack traffic.","Simulateur simplifié du protocole BGP. Gérez des systèmes autonomes, injectez de fausses routes et détournez le trafic — comprenez comment fonctionne le routage de l'Internet mondial.","محاكي مبسط لبروتوكول بوابة الحدود (BGP). أدِر أنظمة مستقلة وحقن مسارات خاطئة واختطف حركة المرور لفهم كيف يعمل توجيه الإنترنت العالمي."],
["darknet-simulator","net-web","darknet-simulator","Safe sandboxed onion network. Relay nodes, hidden services, deanonymization attempts.","Réseau en oignon sécurisé dans un bac à sable isolé. Expérimentez les nœuds relais, les services cachés et les techniques de désanonymisation — le dark web sans risque, à but éducatif.","شبكة بصلية مظلمة آمنة في بيئة رملية معزولة. جرب عقد الترحيل والخدمات المخفية وتقنيات كشف هوية المستخدمين المجهولين تعليمياً."],
["botnet-defense","net-web","botnet-defense","Simulated botnet: compromised nodes, C2 server, DDoS. Isolate and trace before it's too late.","Simulation de réseau de zombies : nœuds compromis, serveur de commande et contrôle (C2), attaque DDoS. Isolez les machines infectées et remontez à la source avant qu'il ne soit trop tard.","محاكاة لشبكة بوتنت: عقد مخترقة وخادم قيادة وتحكم (C2) وهجوم حجب الخدمة الموزع. اعزل العقد المصابة وتتبع المصدر قبل فوات الأوان."],
["blockchain-messenger","net-web","blockchain-messenger","Messages in mini blockchain. Tamper with one = chain breaks visibly.","Messages stockés dans une mini chaîne de blocs. Tentez de falsifier un message et observez la rupture visible de la chaîne — apprenez le principe d'intégrité cryptographique et de hachage.","رسائل مخزنة في سلسلة كتل مصغرة. حاول التلاعب بأي رسالة وشاهد كيف تنكسر السلسلة بأكملها بصرياً. تعلم مبدأ سلامة البيانات في البلوكتشين."],
["packet-racer","net-web","packet-racer","Multiplayer: each player is a packet navigating routers, firewalls, congested links.","Course multijoueur : chaque participant incarne un paquet de données naviguant entre routeurs, pare-feu et liens congestionnés. Qui atteindra la destination le premier sans être bloqué ?","لعبة سباق متعددة اللاعبين حيث كل لاعب يتقمص دور حزمة بيانات تتنقل بين الموجهات وجدران الحماية والوصلات المزدحمة. من يصل أولاً؟"],
// NET — micro:bit
["ble-mesh-chat","net-mb","ble-mesh-chat","Multiple micro:bits form BLE mesh. Messages hop until reaching target. No WiFi needed.","Plusieurs micro:bits forment un réseau maillé Bluetooth. Les messages sautent de nœud en nœud jusqu'à atteindre le destinataire — aucune connexion WiFi nécessaire. Réseau ad hoc pur.","عدة أجهزة micro:bit تشكل شبكة بلوتوث شبكية. الرسائل تقفز من جهاز لآخر حتى تصل الهدف. لا حاجة لشبكة WiFi على الإطلاق."],
["radio-sniffer","net-mb","radio-sniffer","Scans micro:bit radio frequencies. Visualize all radio traffic in the room.","Scanne les fréquences radio du micro:bit et visualise tout le trafic sans fil dans la pièce. Outil d'analyse spectrale simplifié pour comprendre les communications radiofréquence en direct.","يمسح ترددات الراديو الخاصة بـ micro:bit ويعرض جميع حركة البيانات اللاسلكية في الغرفة بصرياً. أداة تحليل طيفي تعليمية مبسطة."],
["micro-vpn","net-mb","micro-vpn","Two micro:bits through browser relay with E2E encryption. Toggle on/off to show difference.","Deux micro:bits communiquent via le navigateur comme relais avec chiffrement de bout en bout. Activez ou désactivez le chiffrement pour voir concrètement la différence — VPN miniature pédagogique.","جهازا micro:bit يتواصلان عبر المتصفح كعقدة ترحيل مع تشفير شامل من طرف لطرف. فعّل وأوقف التشفير لترى الفرق بوضوح بين الحالتين."],
["mesh-rescue","net-mb","mesh-rescue","micro:bits form network. Remove relay = reroutes. Browser shows mesh healing in real time.","Les micro:bits forment un réseau maillé résilient. Retirez un relais et observez le reroutage automatique en direct. Le navigateur montre la guérison du réseau maillé en temps réel.","أجهزة micro:bit تشكل شبكة ترحيل. أزل أي عقدة وشاهد الشبكة تعيد توجيه نفسها وتتعافى تلقائياً. المتصفح يعرض عملية الإصلاح الذاتي مباشرة."],
["radio-cartographer","net-mb","radio-cartographer","Walk around logging signal strength. Browser builds signal map around walls and obstacles.","Déplacez-vous en enregistrant la puissance du signal radio avec le micro:bit. Le navigateur construit une carte de couverture détaillée montrant l'impact des murs et obstacles physiques.","تجول في المكان وسجل قوة الإشارة اللاسلكية بجهاز micro:bit. المتصفح يبني خريطة إشارة تفصيلية توضح تأثير الجدران والعوائق المادية."],
// NET — Multi ESP32
["swarm-net","net-multi","swarm-net","Fleet of ESP32s running ESP-NOW. Browser command center. Coordinated swarm intelligence.","Flotte d'ESP32 communicant via le protocole ESP-NOW. Le navigateur sert de centre de commande pour coordonner l'essaim — expérimentez l'intelligence distribuée et les algorithmes de consensus.","أسطول من أجهزة ESP32 يعمل ببروتوكول ESP-NOW اللاسلكي. المتصفح يعمل كمركز قيادة وتحكم. تجربة عملية لمفهوم ذكاء السرب المنسق."],
["internet-simulator","net-multi","internet-simulator","Each ESP32 is DNS/web server/router/firewall. Browser visualizes traffic. Build the internet on your desk.","Chaque ESP32 incarne un composant d'Internet : serveur DNS, serveur web, routeur ou pare-feu. Le navigateur visualise le trafic. Construisez un Internet miniature sur votre bureau.","كل ESP32 يمثل مكوناً من الإنترنت: خادم DNS أو خادم ويب أو موجه أو جدار حماية. المتصفح يعرض حركة المرور. ابنِ إنترنت مصغراً على مكتبك."],
["tor-in-a-box","net-multi","tor-in-a-box","Three ESP32s as onion relays. Message encrypted in 3 layers, each strips one. Real onion routing.","Trois ESP32 fonctionnent comme relais en oignon réels. Le message est chiffré en trois couches et chaque nœud en retire une — véritable routage en oignon, pas une simple simulation.","ثلاثة أجهزة ESP32 تعمل كعقد ترحيل بصلية حقيقية. الرسالة تُشفَّر بثلاث طبقات وكل عقدة تزيل طبقة واحدة. توجيه بصلي فعلي وليس محاكاة."],
["cyber-range","net-multi","cyber-range","ESP32s simulate corporate network. Red team attacks, blue team defends. Physical cyber training.","Les ESP32 simulent un réseau d'entreprise complet. L'équipe rouge lance des attaques, l'équipe bleue défend et contre-attaque — entraînement cybersécurité sur infrastructure physique réelle.","أجهزة ESP32 تحاكي شبكة مؤسسية كاملة. الفريق الأحمر يشن الهجمات والفريق الأزرق يدافع ويصد. تدريب أمن سيبراني ميداني حقيقي."],
["gossip-protocol","net-multi","gossip-protocol","ESP32s spread data via gossip/epidemic protocol. Watch infection-like spread in real time.","Les ESP32 propagent les données via le protocole gossip épidémique. Observez la diffusion virale d'information de nœud en nœud en temps réel — algorithme fondamental des systèmes distribués.","أجهزة ESP32 تنشر البيانات عبر بروتوكول الشائعات (Gossip) الوبائي. شاهد كيف تنتشر المعلومات كالعدوى من عقدة لأخرى في الزمن الحقيقي."],
["consensus-lab","net-multi","consensus-lab","ESP32 nodes run Raft/PBFT consensus. Visualize elections, replication, crashes.","Les nœuds ESP32 exécutent les algorithmes de consensus Raft et PBFT. Visualisez l'élection du leader, la réplication des données et la récupération après crash — cœur des systèmes distribués.","عقد ESP32 تشغل خوارزميات الإجماع الموزع Raft وPBFT. تصور عملية انتخاب القائد والنسخ المتماثل واستعادة الأعطال بصرياً وعملياً."],
["network-time-machine","net-multi","network-time-machine","All events logged. Scrub through time replaying network evolution. Full network DVR.","Chaque événement réseau est journalisé avec précision temporelle. Naviguez dans le temps pour rejouer l'évolution complète du réseau — un magnétoscope numérique pour votre infrastructure.","جميع أحداث الشبكة مسجلة بدقة. تنقل عبر الزمن لإعادة تشغيل تطور الشبكة لحظة بلحظة. مسجل فيديو رقمي كامل لشبكتك."],
// NET — Ultimate
["cyber-academy","net-ult","cyber-academy","20+ interactive lessons from 'what is IP' to 'run a honeypot.' Hands-on labs.","Plus de 20 leçons interactives progressives, de la découverte du protocole IP jusqu'au déploiement d'un pot de miel. Travaux pratiques intégrés couvrant tous les niveaux de compétence réseau.","أكثر من 20 درساً تفاعلياً تبدأ من أساسيات بروتوكول IP وصولاً لتشغيل مصيدة أمنية. مختبرات عملية تطبيقية تغطي كل مستويات الشبكات."],
["hackathon-arena","net-ult","hackathon-arena","PeerJS multiplayer: teams compete in live network challenges. Scoreboard, replays.","Arène de hackathon multijoueur via PeerJS : les équipes s'affrontent sur des défis réseau en direct. Tableau de scores en temps réel et rediffusion des parties pour analyser les stratégies.","ساحة هاكاثون متعددة اللاعبين عبر PeerJS: فرق تتنافس في تحديات شبكات حية مع لوحة نتائج فورية وإعادة عرض المباريات."],
["operation-blackout","net-ult","operation-blackout","City network under attack. Incident response with real tools. Save the city before time runs out.","Le réseau d'une ville est sous cyberattaque massive. Pilotez la réponse aux incidents avec des outils d'analyse réels et sauvez l'infrastructure critique avant que le temps ne s'épuise.","شبكة المدينة تحت هجوم سيبراني شامل. قُد فريق الاستجابة للحوادث بأدوات تحليل حقيقية وأنقذ البنية التحتية قبل نفاد الوقت."],
// HackRF — Core
["rf-waterfall","hrf-core","rf-waterfall","Live waterfall from HackRF. See WiFi, Bluetooth, FM, keyfobs. The invisible world revealed.","Affichage en cascade spectrale en direct depuis le HackRF. Visualisez les signaux WiFi, Bluetooth, FM et télécommandes — révélez le monde radiofréquence invisible qui vous entoure.","عرض شلالي حي من جهاز HackRF. شاهد إشارات WiFi وBluetooth وFM ومفاتيح السيارات. اكتشف العالم الراديوي غير المرئي من حولك."],
["fm-pirate-radio","hrf-core","fm-pirate-radio","Broadcast tiny FM station. Browser DJ booth: upload audio, TTS, mix live.","Diffusez votre propre micro-station FM avec le HackRF. Le navigateur devient une cabine DJ complète : importez des fichiers audio, synthèse vocale et mixage en direct sur les ondes.","ابث محطة FM مصغرة خاصة بك. المتصفح يتحول لكابينة DJ: ارفع ملفات صوتية واستخدم تحويل النص لكلام وامزج البث مباشرة."],
["signal-hunter","hrf-core","signal-hunter","Gamified RF scavenger hunt. Hide transmitters, scan, triangulate, capture.","Chasse au trésor radiofréquence ludique. Dissimulez des émetteurs, balayez le spectre et triangulez leur position — apprenez la radiogoniométrie et la localisation de sources d'émission.","لعبة صيد كنوز راديوية تفاعلية. أخفِ المرسلات وامسح الترددات وثلّث الموقع بالإشارة والتقط الأهداف. تعلم تقنيات تحديد مصادر الإشارات."],
["rf-fingerprinter","hrf-core","rf-fingerprinter","Capture unique RF signature of devices: garage remote, keyfob, weather station.","Capturez l'empreinte radiofréquence unique de chaque appareil : télécommande de garage, clé de voiture, station météo. Chaque émetteur possède une signature RF analysable et identifiable.","التقط البصمة الراديوية الفريدة لكل جهاز إلكتروني: جهاز تحكم المرآب ومفتاح السيارة ومحطة الطقس. كل جهاز له توقيع RF مميز يمكن تحليله."],
["replay-lab","hrf-core","replay-lab","Capture 433MHz signal, analyze waveform, replay. Then show why rolling codes defeat replays.","Capturez un signal à 433 MHz, analysez sa forme d'onde et rejouez-le. Puis découvrez pourquoi les codes tournants rendent les attaques par rejeu obsolètes — sécurité RF en pratique.","التقط إشارة لاسلكية على تردد 433MHz وحلل شكل موجتها وأعد تشغيلها. ثم تعلم لماذا تمنع الرموز المتدحرجة هجمات إعادة التشغيل."],
["spectrum-wars-rf","hrf-core","spectrum-wars","Two players fight over frequency bands. Transmit while jamming opponent.","Deux joueurs s'affrontent pour le contrôle des bandes de fréquence. Transmettez vos données tout en brouillant l'adversaire — une véritable guerre du spectre radiofréquence en temps réel.","لاعبان يتنافسان على السيطرة على نطاقات التردد الراديوي. أرسل بياناتك بنجاح أثناء محاولة تشويش إرسال الخصم. حرب طيف حقيقية."],
["satellite-listener","hrf-core","satellite-listener","Tune to NOAA 137MHz. Decode APT into actual satellite weather images from space.","Accordez le HackRF sur 137 MHz pour capter les satellites météo NOAA. Décodez le signal APT et recevez de véritables images satellite de la Terre prises depuis l'espace en direct.","اضبط على تردد أقمار NOAA عند 137MHz وفك ترميز بث APT لاستقبال صور الطقس الحقيقية من الفضاء مباشرة أثناء مرور القمر الصناعي فوقك."],
["aircraft-radar","hrf-core","aircraft-radar","Receive ADS-B at 1090MHz. Plot every aircraft overhead: altitude, speed, callsign.","Recevez les trames ADS-B à 1090 MHz et cartographiez chaque aéronef au-dessus de vous : altitude, vitesse, indicatif d'appel. Radar aérien personnel avec démodulation en temps réel.","استقبل بيانات نظام المراقبة التلقائية ADS-B على تردد 1090MHz. ارسم كل طائرة فوقك على الخريطة مع الارتفاع والسرعة وعلامة النداء."],
["pager-decoder","hrf-core","pager-decoder","Tune POCSAG pager frequencies. Decode messages in real time. Unencrypted radio is public.","Accordez les fréquences du protocole POCSAG et décodez les messages des récepteurs d'appel en temps réel. Comprenez pourquoi les transmissions radio non chiffrées sont accessibles à tous.","اضبط ترددات نداء POCSAG وفك ترميز رسائل أجهزة النداء في الزمن الحقيقي. تعلم لماذا الإرسال الراديوي غير المشفر متاح للجميع."],
["radio-telescope","hrf-core","radio-telescope","Capture hydrogen line at 1420MHz. Detect galaxy structure. Actual radio astronomy.","Captez la raie d'émission de l'hydrogène neutre à 1420 MHz et détectez la structure spirale de notre galaxie. Radioastronomie réelle avec votre HackRF comme radiotélescope d'initiation.","التقط خط انبعاث الهيدروجين المحايد عند تردد 1420MHz واكتشف البنية الحلزونية لمجرتنا. علم فلك راديوي حقيقي بجهاز HackRF."],
["ism-band-explorer","hrf-core","ism-band-explorer","Scan 433/868/915MHz ISM bands. Identify every device transmitting.","Balayez les bandes ISM (industrielles, scientifiques, médicales) sur 433, 868 et 915 MHz. Identifiez et classifiez chaque appareil émettant sur ces fréquences ouvertes — exploration IoT.","امسح نطاقات ISM الصناعية والعلمية والطبية على ترددات 433 و868 و915MHz. حدد وصنف كل جهاز يرسل إشارات في هذه النطاقات المفتوحة."],
["signal-zoo","hrf-core","signal-zoo","Catalog modulation types: AM, FM, FSK, PSK, LoRa, Zigbee. Visual encyclopedia.","Encyclopédie visuelle interactive des modulations radio : AM, FM, FSK, PSK, LoRa, Zigbee. Comparez les signatures spectrales de chaque type et apprenez à les identifier sur le cascade.","صنف واستكشف أنواع التعديل الراديوي: AM وFM وFSK وPSK وLoRa وZigbee. موسوعة بصرية تفاعلية لكل نوع مع شكل الإشارة المميز."],
["gsm-tower-mapper","hrf-core","gsm-tower-mapper","Scan GSM/LTE. Map every cell tower: signal, band, cell ID.","Scannez les fréquences GSM et LTE pour cartographier chaque antenne-relais environnante : puissance du signal, bande de fréquence et identifiant de cellule. Analyse du réseau cellulaire.","امسح ترددات الشبكات الخلوية GSM وLTE. ارسم خريطة لكل برج خلوي في محيطك مع قوة الإشارة والنطاق الترددي ومعرف الخلية الفريد."],
["rf-time-machine","hrf-core","rf-time-machine","Record spectrum, replay and analyze later. Scrub through time, find missed signals.","Enregistrez le spectre radiofréquence complet puis rejouez et analysez les signaux à votre rythme. Naviguez dans le temps pour trouver les émissions manquées — magnétoscope radio ultime.","سجل الطيف الراديوي كاملاً وأعد تشغيله وحلله لاحقاً بحرية. تنقل عبر الزمن واكتشف الإشارات التي فاتتك. مسجل فيديو رقمي للراديو."],
// HackRF + micro:bit
["rf-remote-control","hrf-mb","rf-remote-control","micro:bit sends via radio, HackRF captures/decodes. Then flip. Build your own radio protocol.","Le micro:bit émet par radio et le HackRF capture et décode le signal. Inversez ensuite les rôles. Concevez votre propre protocole de communication radiofréquence de zéro.","micro:bit يرسل عبر الراديو وHackRF يلتقط الإشارة ويفك ترميزها. ثم اعكس الأدوار وجرب العكس. ابنِ بروتوكول اتصال لاسلكي خاص بك من الصفر."],
["frequency-duel","hrf-mb","frequency-duel","micro:bit transmits 2.4GHz. HackRF shows exact signal on waterfall. See YOUR transmission.","Le micro:bit transmet sur la bande 2,4 GHz et le HackRF affiche votre signal exact sur le cascade spectral. Observez VOTRE propre émission radiofréquence en temps réel — analyse spectrale concrète.","micro:bit يرسل على نطاق 2.4GHz وHackRF يعرض الإشارة بدقة على العرض الشلالي. شاهد إرسالك أنت بشكل مباشر على الطيف الراديوي."],
["rf-alarm-system","hrf-mb","rf-alarm-system","micro:bit alarm transmits. HackRF monitors. Try to jam/spoof. Break your security, then improve it.","Le micro:bit émet l'alarme sans fil pendant que le HackRF surveille le spectre. Tentez le brouillage ou l'usurpation du signal, puis renforcez votre système — sécurité RF offensive et défensive.","micro:bit يرسل إشارة الإنذار اللاسلكية وHackRF يراقب الطيف. حاول التشويش أو انتحال الإشارة. اكسر نظام الأمان ثم أعد تصميمه بحماية أقوى."],
["micro-radar","hrf-mb","micro-radar","micro:bit ultrasonic + HackRF RF scanning. Browser fuses physical + electromagnetic map.","Le micro:bit scanne par ultrasons l'environnement physique tandis que le HackRF cartographie le spectre électromagnétique. Le navigateur fusionne les deux cartes — radar hybride multi-capteurs.","micro:bit يستخدم الموجات فوق الصوتية للمسح المادي وHackRF يمسح الطيف الكهرومغناطيسي. المتصفح يدمج الخريطتين المادية والراديوية معاً."],
// HackRF + ESP32
["lora-lab","hrf-esp","lora-lab","ESP32 LoRa sends long-range. HackRF captures chirp spectrum. See km range with mW.","L'ESP32 LoRa émet sur de longues distances à faible puissance. Le HackRF capture le spectre chirp caractéristique de la modulation LoRa — observez comment quelques milliwatts parcourent des kilomètres.","ESP32 يرسل عبر تقنية LoRa لمسافات بعيدة بطاقة منخفضة. HackRF يلتقط طيف إشارة النقيق المميزة. شاهد كيف تصل كيلومترات بملي واط."],
["wifi-dissector","hrf-esp","wifi-dissector","ESP32 runs WiFi. HackRF captures raw 2.4GHz. Browser decodes 802.11 frames.","L'ESP32 opère en WiFi pendant que le HackRF capture le signal brut à 2,4 GHz. Le navigateur décode les trames 802.11 et révèle l'anatomie complète du protocole sans fil.","ESP32 يشغل شبكة WiFi وHackRF يلتقط الإشارة الخام على نطاق 2.4GHz. المتصفح يفك ترميز إطارات بروتوكول 802.11 ويعرض بنيتها الداخلية."],
["ble-xray","hrf-esp","ble-xray","ESP32 BLE beacons. HackRF shows 1600 hops/sec frequency hopping visualized.","L'ESP32 émet des balises Bluetooth LE pendant que le HackRF visualise le saut de fréquence à 1600 sauts par seconde. Observez comment le BLE parcourt le spectre pour éviter les interférences.","ESP32 يبث إشارات بلوتوث BLE وHackRF يعرض تقنية قفز التردد بمعدل 1600 قفزة في الثانية بصرياً. شاهد كيف يتنقل البلوتوث بين الترددات."],
["esp-rf-bridge","hrf-esp","esp-rf-bridge","ESP32 streams HackRF data over WiFi. SDR on any device. Wireless SDR for classroom.","L'ESP32 diffuse les données du HackRF via WiFi vers n'importe quel appareil. Transformez un seul HackRF en radio logicielle (SDR) partagée sans fil pour tout le groupe ou la classe.","ESP32 يبث بيانات HackRF لاسلكياً عبر WiFi لأي جهاز. حوّل HackRF إلى راديو معرّف بالبرمجيات لاسلكي مشترك لكل طلاب الفصل."],
["rf-iot-audit","hrf-esp","rf-iot-audit","ESP32 runs WiFi/BLE/ESP-NOW. HackRF captures all simultaneously side by side.","L'ESP32 émet simultanément en WiFi, BLE et ESP-NOW. Le HackRF capture toutes ces émissions en parallèle — audit de sécurité complet des protocoles IoT côte à côte sur le spectre.","ESP32 يشغل بروتوكولات WiFi وBLE وESP-NOW معاً. HackRF يلتقط جميع الإشارات في آن واحد جنباً إلى جنب لتدقيق أمن إنترنت الأشياء."],
["collision-visualizer","hrf-esp","collision-visualizer","ESP32 + micro:bit both transmit 2.4GHz. HackRF captures collision. See data corruption.","L'ESP32 et le micro:bit émettent simultanément sur 2,4 GHz. Le HackRF capture la collision radiofréquence en direct — observez visuellement comment les interférences corrompent les données.","ESP32 وmicro:bit يرسلان معاً على نطاق 2.4GHz. HackRF يلتقط لحظة التصادم الراديوي. شاهد كيف يتلف التداخل البيانات المرسلة بصرياً."],
// HackRF — Spy
["bug-sweeper","hrf-spy","bug-sweeper","Scan surveillance frequencies. Alert on suspicious transmitters. Professional RF sweep.","Balayez les fréquences de surveillance et d'écoute clandestine. Recevez des alertes sur tout émetteur suspect détecté — outil professionnel de contre-mesures électroniques (TSCM) pour sécuriser les lieux.","امسح ترددات أجهزة المراقبة والتنصت وتلقَّ تنبيهات فورية على أي مرسلات مشبوهة. أداة مسح طيف راديوي احترافية لتأمين الأماكن الحساسة."],
["tracker-hunter","hrf-spy","tracker-hunter","Scan for AirTag/Tile/SmartTag BLE beacons. Map and alert on unknown trackers.","Scannez les balises Bluetooth des traqueurs AirTag, Tile et SmartTag. Cartographiez leur position et recevez des alertes sur les traqueurs inconnus à proximité — protection anti-pistage.","امسح إشارات بلوتوث لأجهزة التتبع مثل AirTag وTile وSmartTag. ارسم خريطة لها وتلقَّ تنبيهات فورية عند اكتشاف متتبعات مجهولة قريبة."],
["rf-cloak","hrf-spy","rf-cloak","Analyze personal RF emissions. Visibility report showing how trackable you are.","Analysez toutes les émissions radiofréquence de vos appareils personnels. Obtenez un rapport de visibilité détaillé révélant votre degré de traçabilité électromagnétique — bilan de discrétion RF.","حلل جميع الانبعاثات الراديوية الصادرة من أجهزتك الشخصية. احصل على تقرير شامل يوضح مدى قابليتك للتتبع والرصد الإلكتروني."],
["covert-channel","hrf-spy","covert-channel","Hide data in normal radio: FM noise, WiFi beacons, BLE ads. Radio steganography.","Dissimulez des données secrètes dans des émissions radio ordinaires : bruit FM, balises WiFi, annonces BLE. Apprenez la stéganographie radiofréquence — l'art de cacher l'information dans le spectre.","أخفِ بيانات سرية داخل إرسال راديوي عادي: ضوضاء FM أو إشارات WiFi أو إعلانات BLE. تعلم تقنية إخفاء المعلومات في الطيف الراديوي."],
["direction-finder","hrf-spy","direction-finder","HackRF + directional antenna. Arrow points toward signal source. Track transmitters.","HackRF couplé à une antenne directionnelle pour la radiogoniométrie. Un indicateur directionnel pointe vers la source du signal — apprenez les techniques de localisation d'émetteurs clandestins.","HackRF مع هوائي اتجاهي لتحديد مصادر الإشارات. سهم على الشاشة يرشدك نحو المرسل المخفي. تعلم تقنيات تحديد الاتجاه الراديوي."],
["rf-jail","hrf-spy","rf-jail","Monitor all frequencies leaving a room. Alert on unauthorized transmissions. Build a SCIF.","Surveillez toutes les émissions radiofréquence sortant d'une pièce et alertez sur toute transmission non autorisée. Apprenez à construire une salle sécurisée (SCIF) isolée électromagnétiquement.","راقب جميع الترددات الراديوية الخارجة من غرفة ما وتنبّه لأي إرسال غير مصرح به. تعلم كيف تُبنى الغرف الآمنة المعزولة كهرومغناطيسياً (SCIF)."],
["signal-forge","hrf-spy","signal-forge","Design custom radio signals: frequency, modulation, data. HackRF transmits. RF sandbox.","Concevez des signaux radio sur mesure : choisissez la fréquence, le type de modulation et les données à transmettre. Le HackRF les émet réellement — laboratoire de radiofréquence expérimental.","صمم إشارات راديو مخصصة بالكامل: اختر التردد ونوع التعديل والبيانات المحمولة. HackRF يبثها فعلياً. بيئة تجريب راديوية مفتوحة."],
// WiFi — Recon
["wifi-sonar","wifi-rec","wifi-sonar","Every WiFi frame on sonar radar. APs as fixed points, clients orbiting. Living WiFi map.","Chaque trame WiFi apparaît sur un radar sonar en direct. Les points d'accès sont des repères fixes, les clients gravitent autour — cartographie dynamique de votre environnement sans fil.","كل إطار WiFi يظهر على شاشة رادار سونار حية. نقاط الوصول كنقاط ثابتة والأجهزة المتصلة تدور حولها. خريطة WiFi حية ومتجددة."],
["probe-tracker","wifi-rec","probe-tracker","Capture probe requests. Map devices and networks they've visited. Phones leak location history.","Capturez les requêtes de sondage WiFi émises par les appareils. Cartographiez chaque terminal et les réseaux auxquels il s'est connecté — découvrez comment les téléphones trahissent votre historique.","التقط طلبات استكشاف الشبكات اللاسلكية. ارسم خريطة للأجهزة وكل الشبكات التي اتصلت بها سابقاً. اكتشف كيف تسرّب الهواتف تاريخ تنقلاتك."],
["handshake-theater","wifi-rec","handshake-theater","Capture WPA 4-way handshake. Animate every step: nonces, MIC, keys derived.","Capturez la poignée de main WPA en 4 étapes et animez chaque phase : échange de nonces, calcul du code d'intégrité (MIC) et dérivation des clés de chiffrement. Cryptographie WiFi démystifiée.","التقط مصافحة WPA رباعية الاتجاه وشاهد كل خطوة متحركة بصرياً: القيم العشوائية ورمز سلامة الرسالة واشتقاق مفاتيح التشفير."],
["beacon-flood-viz","wifi-rec","beacon-flood-viz","Capture all AP beacons. Visualize SSIDs, channels, encryption, vendors, hidden networks.","Capturez toutes les balises de points d'accès environnants. Visualisez les SSID, canaux, types de chiffrement, fabricants et réseaux masqués — analyse complète de l'écosystème WiFi ambiant.","التقط جميع إشارات نقاط الوصول اللاسلكية. تصور أسماء الشبكات والقنوات ونوع التشفير والشركة المصنعة والشبكات المخفية في عرض بصري شامل."],
["deauth-detector","wifi-rec","deauth-detector","Watch for deauth frames. Alert on attacks. Wireless IDS.","Surveillez les trames de désauthentification sur le réseau sans fil et recevez des alertes lors d'attaques. Système de détection d'intrusion sans fil (IDS) complet pour la défense de votre réseau.","راقب إطارات إلغاء المصادقة على الشبكة اللاسلكية وتنبّه فوراً عند اكتشاف هجمات. نظام كشف تسلل لاسلكي (Wireless IDS) متكامل."],
["channel-heatmap","wifi-rec","channel-heatmap","Hop across WiFi channels. Live congestion heatmap. Pick the best channel.","Balayez tous les canaux WiFi et générez une carte thermique de congestion en temps réel. Analysez l'occupation spectrale de chaque canal pour choisir la fréquence optimale pour votre réseau.","تنقل بين قنوات WiFi واعرض خريطة حرارية حية لمستوى الازدحام على كل قناة. حلل البيانات واختر أفضل قناة لتحسين أداء شبكتك."],
["client-fingerprinter","wifi-rec","client-fingerprinter","Fingerprint devices by WiFi behavior. MAC randomization alone doesn't hide you.","Identifiez les appareils par leur comportement WiFi unique : fréquence des sondes, débits supportés, capacités annoncées. Comprenez pourquoi la randomisation MAC seule ne protège pas votre anonymat.","بصم الأجهزة من خلال سلوكها على شبكة WiFi. تعلم لماذا عشوائية عنوان MAC وحدها لا تكفي لإخفاء هوية جهازك عن المراقبين."],
["evil-twin-spotter","wifi-rec","evil-twin-spotter","Compare beacons. Two APs same name, different fingerprints? Evil twin flagged.","Comparez les empreintes numériques des balises WiFi. Deux points d'accès portant le même nom mais avec des signatures différentes ? Attaque par jumeau maléfique détectée et signalée automatiquement.","قارن إشارات نقاط الوصول المحيطة. نقطتا وصول بنفس الاسم لكن ببصمات رقمية مختلفة؟ هجوم التوأم الشرير مكشوف ومُعلَّم تلقائياً."],
["packet-microscope","wifi-rec","packet-microscope","Raw 802.11 frame dissection byte by byte. Color-coded fields. Beautiful Wireshark.","Dissection des trames 802.11 octet par octet avec codage couleur de chaque champ. Analyse de paquets élégante à la manière de Wireshark — comprenez l'anatomie du protocole WiFi en profondeur.","تشريح إطارات بروتوكول 802.11 اللاسلكي بايت ببايت مع ترميز لوني لكل حقل. تحليل حزم أنيق يشبه Wireshark بشكل بصري تعليمي جذاب."],
["wifi-timeline","wifi-rec","wifi-timeline","Every event with ms precision. Timeline editor. Reconstruct what happened on the network.","Chaque événement réseau horodaté à la milliseconde sur une chronologie interactive éditable. Reconstituez la séquence exacte des faits pour l'analyse forensique de votre réseau sans fil.","كل حدث شبكي مسجل بدقة المللي ثانية على خط زمني تفاعلي قابل للتحرير. أعد بناء تسلسل الأحداث واكتشف ما حدث فعلاً على الشبكة."],
// WiFi — Spy
["ghost-detector","wifi-spy","ghost-detector","Find hidden cameras, rogue APs, unknown clients. Vendor lookup, threat level. Room sweep.","Détectez caméras cachées, points d'accès malveillants et clients inconnus. Identification du fabricant et évaluation du niveau de menace — balayage de sécurité complet d'une pièce.","ابحث عن كاميرات مراقبة مخفية ونقاط وصول مارقة وأجهزة مجهولة. تحقق من الشركة المصنعة ومستوى التهديد. أداة مسح أمني شاملة للغرف."],
["movement-tracker","wifi-spy","movement-tracker","Track movement via RSSI changes. Purely passive. WiFi surveillance lesson.","Suivez les déplacements en analysant les variations du RSSI (puissance du signal reçu) de manière purement passive. Leçon pratique sur la surveillance par radiofréquence sans émission.","تتبع حركة الأشخاص عبر تغيرات مؤشر قوة الإشارة (RSSI) بشكل سلبي تماماً دون إرسال أي شيء. درس عملي في تقنيات المراقبة اللاسلكية."],
["persona-builder","wifi-spy","persona-builder","Probe requests reveal visited networks. Build owner profile from WiFi data alone.","Les requêtes de sondage WiFi révèlent tous les réseaux précédemment visités. Construisez un profil complet du propriétaire d'un appareil uniquement à partir de ses métadonnées WiFi — vie privée en question.","طلبات استكشاف WiFi تكشف الشبكات التي اتصل بها الجهاز سابقاً. ابنِ ملفاً تعريفياً كاملاً عن مالك الجهاز من بيانات WiFi وحدها."],
["invisibility-test","wifi-spy","invisibility-test","Try MAC randomization, disable probes. Monitor tries to detect you. Cat-and-mouse privacy.","Activez la randomisation MAC et désactivez les sondes pour devenir invisible. Le système de surveillance tente quand même de vous identifier — jeu du chat et de la souris sur la vie privée WiFi.","جرب تفعيل عشوائية عنوان MAC وتعطيل طلبات الاستكشاف. نظام المراقبة يحاول كشف هويتك رغم ذلك. لعبة قط وفأر في خصوصية WiFi."],
["covert-exfil-lab","wifi-spy","covert-exfil-lab","Embed data in beacon SSIDs, probe requests, timing. Monitor captures and decodes.","Intégrez des données secrètes dans les noms de réseaux (SSID), les requêtes de sondage et le minutage des paquets. Le moniteur capture et tente de décoder ces canaux cachés — exfiltration furtive.","ادمج بيانات سرية في أسماء الشبكات وطلبات الاستكشاف وتوقيت الحزم. نظام المراقبة يلتقط الإشارات ويحاول فك ترميز البيانات المخفية."],
["rf-lineup","wifi-spy","rf-lineup","Cross-reference WiFi + BLE + cellular captures. Complete radio profile per device.","Croisez les captures WiFi, Bluetooth et cellulaires pour créer un profil radiofréquence complet de chaque appareil environnant. Corrélation multi-protocoles pour l'identification avancée.","اربط بين التقاطات اللاسلكية من WiFi وبلوتوث والشبكة الخلوية معاً. أنشئ ملفاً راديوياً شاملاً ومتقاطعاً لكل جهاز في المحيط."],
// WiFi + HackRF
["full-spectrum-dashboard","wifi-hrf","full-spectrum-dashboard","HackRF sub-GHz to 6GHz + WiFi 802.11 decode + device map. God-view RF dashboard.","Le HackRF couvre le spectre de sous-GHz à 6 GHz combiné au décodage WiFi 802.11 et à une cartographie des appareils. Tableau de bord radiofréquence omniscient à vision panoramique totale.","HackRF يغطي الطيف من دون الغيغاهرتز حتى 6GHz مع فك ترميز WiFi 802.11 وخريطة أجهزة حية. لوحة تحكم راديوية شاملة بنظرة إلهية."],
["protocol-rainbow","wifi-hrf","protocol-rainbow","Raw RF + WiFi + BLE. Three layers simultaneously: spectrum > protocol > data.","Affichage simultané de trois couches : le spectre radiofréquence brut, les protocoles WiFi et BLE décodés, puis les données applicatives extraites. Arc-en-ciel de protocoles en temps réel.","عرض متزامن لثلاث طبقات من البيانات اللاسلكية: الطيف الراديوي الخام ثم بروتوكولات WiFi وBLE ثم البيانات المفككة. قوس قزح البروتوكولات."],
["frequency-forensics","wifi-hrf","frequency-forensics","Record spectrum + packets simultaneously. Click burst = see decoded packet. Time-synced.","Enregistrez le spectre et les paquets réseau en synchronisation temporelle parfaite. Cliquez sur une rafale dans le cascade spectral pour voir le paquet correspondant décodé instantanément.","سجل الطيف الراديوي والحزم الشبكية بتزامن زمني دقيق. انقر على أي دفقة في العرض الشلالي لتشاهد الحزمة المقابلة مفككة ومحللة فوراً."],
["jamming-lab","wifi-hrf","jamming-lab","HackRF noise on WiFi channel. Monitor measures impact. Graph destruction. Teach countermeasures.","Le HackRF injecte du bruit radiofréquence sur un canal WiFi. Le moniteur mesure la dégradation du débit en graphiques. Apprenez le brouillage et les contre-mesures de résilience spectrale.","HackRF يولد ضوضاء راديوية على قناة WiFi والمراقب يقيس التأثير على الأداء بيانياً. تعلم تقنيات التشويش والتدابير المضادة للحماية منه."],
["hidden-network-revealer","wifi-hrf","hidden-network-revealer","HackRF sees raw beacon energy. WiFi waits for association. Correlate to unmask hidden networks.","Le HackRF détecte l'énergie brute des balises même sans SSID diffusé. Le moniteur WiFi guette les tentatives d'association. Corrélation croisée pour démasquer les réseaux volontairement cachés.","HackRF يكشف طاقة الإشارات الخام حتى بدون بث اسم الشبكة. WiFi ينتظر محاولات الارتباط. اربط البيانات معاً لكشف الشبكات المخفية."],
// WiFi — Classroom
["wifi-101-lab","wifi-edu","wifi-101-lab","Interactive course with live monitor demos. Beacons > probes > handshake > attacks > defense.","Formation interactive complète avec démonstrations en mode moniteur. Progression pédagogique : balises, sondes, poignée de main WPA, vecteurs d'attaque puis techniques de défense réseau.","دورة تعليمية تفاعلية مع عروض حية من وضع المراقبة. تتدرج من الإشارات إلى الاستكشاف ثم المصافحة ثم الهجمات وأخيراً تقنيات الدفاع."],
["network-detective","wifi-edu","network-detective","Murder-mystery: 'Something happened at 14:32.' Analyze packet capture to solve. Different scenarios.","Enquête réseau façon polar : un incident s'est produit à 14h32. Analysez les captures de paquets pour identifier le coupable. Scénarios variés à difficulté croissante — forensique réseau ludique.","لغز تحقيقي شبكي: حدث شيء مريب في الساعة 14:32. حلل ملف التقاط الحزم للكشف عن الجاني. سيناريوهات متعددة بمستويات صعوبة مختلفة."],
["wifi-escape-room","wifi-edu","wifi-escape-room","Clues in beacons, SSIDs, probes, payloads. Capture and decode to advance. Physical + technical.","Escape room WiFi : les indices sont cachés dans les balises, les SSID et les sondes réseau. Capturez les paquets et décodez-les pour progresser — défi technique et physique combiné.","غرفة هروب لاسلكية: الأدلة مخفية في إشارات نقاط الوصول وأسماء الشبكات وطلبات الاستكشاف. التقط الحزم وفك ترميزها للتقدم في اللغز."],
["security-audit-sim","wifi-edu","security-audit-sim","Full WiFi audit on ESP32 test network. Discover, enumerate, capture, test, report.","Audit de sécurité WiFi complet sur un réseau test ESP32. Découverte, énumération, capture de poignées de main, test de vulnérabilités et rédaction de rapport — méthodologie professionnelle.","تدقيق أمني كامل لشبكة WiFi تجريبية على ESP32. اكتشف الأجهزة وعدّدها والتقط المصافحات واختبر نقاط الضعف واكتب تقرير التدقيق."],
["attack-defense-arena","wifi-edu","attack-defense-arena","Red team: deauth, evil twin. Blue team: detect and block. Browser referees with live scoring.","Équipe rouge : attaques par désauthentification et jumeau maléfique. Équipe bleue : détection et blocage des menaces. Le navigateur arbitre avec un score en temps réel — cyberdéfense compétitive.","الفريق الأحمر يشن هجمات إلغاء مصادقة وتوأم شرير. الفريق الأزرق يكشف ويحظر التهديدات. المتصفح يحكّم بتسجيل نقاط فوري مباشر."],
// WiFi + ESP32
["honeypot-network","wifi-esp","honeypot-network","ESP32 fake open WiFi. Monitor captures everything. See why open WiFi is dangerous.","L'ESP32 crée un faux réseau WiFi ouvert servant de pot de miel. Le moniteur capture l'intégralité du trafic des victimes. Constatez par vous-même les dangers des réseaux sans fil ouverts.","ESP32 ينشئ شبكة WiFi مفتوحة مزيفة كمصيدة أمنية. المراقب يلتقط كل حركة مرور المتصلين. اكتشف بنفسك لماذا شبكات WiFi المفتوحة خطيرة."],
["wifi-canary","wifi-esp","wifi-canary","ESP32 trusted network. Monitor watches for attacks. DIY wireless IDS.","L'ESP32 établit un réseau WiFi de référence fiable. Le moniteur traque toute attaque ou anomalie suspecte. Construisez votre propre système de détection d'intrusion sans fil artisanal (IDS DIY).","ESP32 ينشئ شبكة WiFi موثوقة كمرجع. المراقب يرصد أي هجمات أو تغييرات مشبوهة. ابنِ نظام كشف تسلل لاسلكي بنفسك من الصفر."],
["roaming-visualizer","wifi-esp","roaming-visualizer","ESP32 multiple APs. Phone roams. Monitor captures handoff with timing and signal.","Plusieurs ESP32 forment des points d'accès distincts. Le téléphone bascule entre eux en itinérance et le moniteur capture chaque transfert intercellulaire avec chronométrage et niveaux de signal.","عدة أجهزة ESP32 كنقاط وصول متعددة. الهاتف يتجول بينها والمراقب يلتقط عملية تسليم الاتصال مع توقيت دقيق ومستوى الإشارة."],
["captive-portal-atk","wifi-esp","captive-portal-attack-defense","ESP32 captive portal. Monitor captures all. Learn, bypass, then make secure.","L'ESP32 héberge un portail captif pendant que le moniteur capture tout le trafic. Apprenez son fonctionnement, tentez de le contourner puis reconceptez-le avec des mesures de sécurité robustes.","ESP32 ينشئ بوابة تسجيل أسيرة والمراقب يلتقط كل حركة المرور. تعلم آلية عملها ثم تجاوزها أمنياً ثم أعد تصميمها بحماية أقوى."],
