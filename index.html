["mesh-vs-traditional","wifi-esp","mesh-vs-traditional","ESP32 mesh + traditional AP. Monitor compares latency, overhead, resilience.","Réseau maillé ESP32 contre point d'accès WiFi traditionnel en face-à-face. Le moniteur compare latence, surcharge protocolaire et résilience aux pannes — quel modèle est le plus performant ?","شبكة ESP32 شبكية مقابل نقطة وصول تقليدية. المراقب يقارن بينهما في زمن الاستجابة والحمل الإضافي والمرونة أمام الأعطال عملياً."],
// Ham — Core
["band-explorer","ham-core","band-explorer","HackRF tunes all ham bands. Band plan overlay on live waterfall. Color-coded by allocation.","Le HackRF explore toutes les bandes radioamateur. Le plan de bande officiel se superpose à l'analyse spectrale en cascade en direct, avec un codage couleur par type d'attribution.","HackRF يضبط جميع نطاقات الراديو الهواة. خريطة تخصيص النطاقات مرئية فوق العرض الشلالي الحي مع ترميز لوني حسب نوع التخصيص."],
["cw-decoder","ham-core","cw-decoder","Receive CW (Morse) on any band. Real-time decode: waveform, tone, text simultaneously.","Recevez les signaux Morse (CW) sur n'importe quelle bande de fréquence. Décodage en temps réel avec affichage simultané de la forme d'onde, de la tonalité audio et du texte traduit.","استقبل إشارات مورس (CW) على أي نطاق تردد. فك ترميز فوري مع عرض متزامن لشكل الموجة والنغمة الصوتية والنص المترجم على الشاشة."],
["cw-keyer","ham-core","cw-keyer","Type message, generate CW audio. HackRF transmits (with license). Complete CW station.","Saisissez un message texte et générez le signal Morse audio correspondant. Le HackRF peut l'émettre sur les ondes (licence requise) — station CW complète et opérationnelle depuis le navigateur.","اكتب رسالة نصية وحوّلها إلى إشارات مورس صوتية. HackRF يبثها على الهواء (بترخيص هواة). محطة مورس كاملة ومتكاملة."],
["ssb-visualizer","ham-core","ssb-visualizer","Receive SSB voice. See audio waveform, spectrum, and waterfall simultaneously.","Recevez la voix en bande latérale unique (SSB) et visualisez simultanément la forme d'onde, l'analyse spectrale audio et le cascade. Comprenez la démodulation SSB de manière visuelle et intuitive.","استقبل الصوت بتعديل النطاق الجانبي الأحادي (SSB). شاهد شكل الموجة الصوتية والتحليل الطيفي والعرض الشلالي متزامنة على الشاشة."],
["qso-logger","ham-core","qso-logger","Auto-decode callsigns from CW, FT8, APRS. Auto-log with world map plot.","Décodage automatique des indicatifs d'appel depuis les modes CW, FT8 et APRS. Journal de bord généré automatiquement avec position de chaque station tracée sur la carte du monde.","فك ترميز تلقائي لعلامات نداء المحطات من أوضاع CW وFT8 وAPRS. تسجيل آلي للاتصالات مع رسم مواقع المحطات على خريطة العالم."],
["propagation-monitor","ham-core","propagation-monitor","Monitor beacons 24/7. Map propagation with solar data overlay. Watch ionosphere breathe.","Surveillez les balises radioamateur en continu. Cartographiez la propagation ionosphérique avec superposition des données d'activité solaire — observez l'ionosphère respirer au rythme du soleil.","راقب المنارات الراديوية على مدار الساعة. ارسم خريطة انتشار الموجات مع تراكب بيانات النشاط الشمسي. شاهد طبقة الأيونوسفير وهي تتنفس."],
["repeater-map","ham-core","repeater-map","Scan 2m/70cm. Map every active repeater with CTCSS/DCS tones and activity.","Balayez les bandes 2 m et 70 cm pour cartographier chaque relais actif dans votre région, avec identification des tonalités CTCSS/DCS et du niveau d'activité. Découverte du réseau amateur local.","امسح نطاقي 2 متر و70 سنتيمتر. ارسم خريطة لكل مكرر إشارة نشط في منطقتك مع نغمات CTCSS/DCS ومستوى النشاط الحالي."],
["waterfall-art","ham-core","waterfall-art","Receive Hellschreiber, SSTV, MFSK. Reveal hidden art in spectrum. Hunt secret pictures.","Recevez les modes Hellschreiber, SSTV et MFSK pour révéler l'art caché dans le spectre radiofréquence. Partez à la chasse aux images secrètes transmises par les radioamateurs du monde entier.","استقبل أوضاع Hellschreiber وSSTV وMFSK واكشف الفن والصور المخفية داخل الطيف الراديوي. اصطد الصور السرية المبثوثة على الموجات."],
// Ham — Digital
["digi-mode-zoo","ham-digi","digi-mode-zoo","Decode FT8, FT4, JS8Call, PSK31, RTTY, Olivia, MFSK. Unique waterfall signatures.","Décodez tous les modes numériques : FT8, FT4, JS8Call, PSK31, RTTY, Olivia et MFSK. Chacun possède une signature spectrale unique sur le cascade — apprenez à les reconnaître visuellement.","فك ترميز جميع الأوضاع الرقمية: FT8 وFT4 وJS8Call وPSK31 وRTTY وOlivia وMFSK. لكل وضع بصمة شلالية فريدة ومميزة يمكن التعرف عليها."],
["ft8-world-map","ham-digi","ft8-world-map","Passive FT8 receive. Plot stations worldwide. 50+ countries in minutes. No license needed.","Réception passive du mode FT8 mondial. Localisez les stations sur une carte en temps réel — plus de 50 pays captés en quelques minutes sans émettre. Aucune licence radioamateur requise.","استقبال سلبي لإشارات FT8 العالمية. ارسم مواقع المحطات على خريطة العالم. أكثر من 50 دولة خلال دقائق معدودة. لا حاجة لرخصة."],
["ft8-station","ham-digi","ft8-station","Receive 14.074 MHz FT8. Decode callsigns, grids, reports. Plot on world map.","Recevez le mode FT8 sur 14,074 MHz. Décodez les indicatifs d'appel, les locators Maidenhead et les rapports de signal. Chaque contact décodé est tracé sur la carte mondiale en temps réel.","استقبل إشارات FT8 على تردد 14.074 MHz. فك ترميز علامات النداء والمربعات الشبكية وتقارير الإشارة وارسم كل اتصال على خريطة العالم."],
["js8-messenger","ham-digi","js8-messenger","JS8Call weak-signal chat. Read ionosphere conversations. With license: transmit.","Messagerie JS8Call spécialisée dans les signaux extrêmement faibles. Lisez les conversations rebondissant sur l'ionosphère entre stations du monde entier. Avec licence radioamateur : émettez aussi.","دردشة JS8Call المتخصصة بالإشارات الضعيفة جداً. اقرأ المحادثات المرتدة عن طبقة الأيونوسفير بين محطات العالم. مع ترخيص الهواة: أرسل أنت أيضاً."],
["psk31-chat","ham-digi","psk31-chat","14.070 MHz PSK31. Dozens of simultaneous conversations in waterfall. Click any to read.","Explorez la bande PSK31 sur 14,070 MHz. Des dizaines de conversations numériques coexistent sur le cascade spectral — cliquez sur n'importe quel signal pour démoduler et lire l'échange en direct.","استقبل PSK31 على تردد 14.070 MHz. عشرات المحادثات تجري متزامنة على العرض الشلالي. انقر على أي إشارة لقراءة محادثتها فوراً."],
["aprs-dashboard","ham-digi","aprs-dashboard","Receive APRS 144.800MHz. Decode packets, plot stations, weather, vehicles on live map.","Recevez le système APRS sur 144,800 MHz. Décodez les paquets radio et affichez stations, données météorologiques et véhicules en mouvement sur une carte géographique actualisée en continu.","استقبل نظام تقرير الحزم التلقائي APRS على 144.800MHz. فك ترميز الحزم وارسم المحطات وبيانات الطقس والمركبات على خريطة حية متجددة."],
["aprs-tracker","ham-digi","aprs-tracker","ESP32 + GPS portable tracker. HackRF base. Browser shows live position on map.","ESP32 avec module GPS comme balise APRS portable. Le HackRF sert de station de base réceptrice. Le navigateur affiche la position géolocalisée en temps réel sur la carte — suivi terrain.","ESP32 مع وحدة GPS كمتتبع محمول يرسل موقعه لاسلكياً. HackRF يعمل كمحطة قاعدة. المتصفح يعرض الموقع الحي على الخريطة فوراً."],
["packet-radio-station","ham-digi","packet-radio-station","AX.25 packet radio. Browser terminal. The original wireless internet from the 1980s.","Station de radio par paquets AX.25 avec terminal dans le navigateur. Revivez l'Internet sans fil originel tel que les radioamateurs l'ont inventé dans les années 1980 — archéologie réseau vivante.","محطة راديو حزم ببروتوكول AX.25 مع طرفية في المتصفح. أعد إحياء الإنترنت اللاسلكي الأصلي كما اخترعه هواة الراديو في الثمانينات."],
["winlink-gateway","ham-digi","winlink-gateway","Send/receive email over radio. No internet needed. Emergency comms standard.","Envoyez et recevez des courriels uniquement par ondes radio, sans aucune connexion Internet. Le protocole Winlink est le standard mondial des communications d'urgence pour les situations de crise.","أرسل واستقبل رسائل البريد الإلكتروني عبر موجات الراديو بدون أي اتصال بالإنترنت. نظام Winlink هو المعيار العالمي لاتصالات الطوارئ."],
["wspr-beacon","ham-digi","wspr-beacon","Transmit WSPR beacons. See milliwatt signal received worldwide. Ionospheric propagation.","Émettez des balises WSPR à quelques milliwatts seulement et observez votre signal capté par des stations du monde entier. Expérience fascinante pour étudier la propagation ionosphérique longue distance.","أرسل منارات WSPR بقدرة ملي واط فقط وشاهد إشارتك وهي تُستقبل في محطات حول العالم. تجربة مذهلة لدراسة انتشار الموجات الأيونوسفيرية."],
["sstv-gallery","ham-digi","sstv-gallery","Receive SSTV on 14.230 MHz. Decode images line by line. ISS SSTV = photos from space.","Recevez la télévision à balayage lent (SSTV) sur 14,230 MHz. Décodez les images ligne par ligne en temps réel. Captez le SSTV de la Station spatiale internationale — photos transmises depuis l'espace.","استقبل تلفزيون المسح البطيء SSTV على تردد 14.230 MHz. فك ترميز الصور سطراً بسطر. التقط بث SSTV من محطة الفضاء الدولية لصور من الفضاء."],
// Ham — Satellites
["iss-contact","ham-sat","iss-contact","Track ISS. Tune 145.800 MHz. Decode APRS or voice from ISS. Hear astronauts.","Suivez l'ISS en orbite et accordez le HackRF sur 145,800 MHz. Décodez les paquets APRS ou écoutez les communications vocales en direct — entendez de vrais astronautes depuis votre station.","تتبع محطة الفضاء الدولية مباشرة واضبط على تردد 145.800 MHz. فك ترميز بيانات APRS أو استمع للصوت مباشرة. اسمع رواد الفضاء الحقيقيين."],
["satellite-commander","ham-sat","satellite-commander","Live amateur satellite positions. Auto Doppler correction. Click satellite, hear downlink.","Positions en temps réel des satellites radioamateur sur leur orbite, avec correction automatique de l'effet Doppler. Cliquez sur n'importe quel satellite pour écouter sa liaison descendante en direct.","عرض حي لمواقع أقمار الهواة الصناعية على مدارها مع تصحيح تلقائي لانزياح دوبلر. انقر على أي قمر لسماع وصلته الهابطة مباشرة."],
["noaa-weather-lab","ham-sat","noaa-weather-lab","Receive NOAA 137 MHz. Decode APT images as satellite passes. Photos from space.","Recevez les satellites météo NOAA sur 137 MHz et décodez les images APT au passage de chaque satellite. Reconstruisez de véritables photographies de la Terre prises depuis l'orbite en temps réel.","استقبل بث أقمار NOAA الجوية على تردد 137 MHz. فك ترميز صور الطقس بنظام APT أثناء مرور القمر فوقك. صور حقيقية ملتقطة من الفضاء."],
["meteor-m2-hd","ham-sat","meteor-m2-hd","Receive Meteor-M2 137 MHz LRPT. High-res weather: false color, thermal, visible.","Recevez le satellite russe Meteor-M2 en LRPT sur 137 MHz. Images météorologiques haute résolution en fausses couleurs, infrarouge thermique et spectre visible — qualité supérieure aux satellites NOAA.","استقبل بث القمر الروسي Meteor-M2 بنظام LRPT على 137 MHz. صور طقس عالية الدقة بالألوان الزائفة والأشعة الحرارية والضوء المرئي."],
["cubesat-telemetry","ham-sat","cubesat-telemetry","Receive CubeSat UHF telemetry. Monitor real spacecraft health in real time.","Recevez la télémétrie UHF des nanosatellites CubeSat en orbite. Surveillez en temps réel l'état de santé d'engins spatiaux réels : tension, température, orientation — radioamateur spatial appliqué.","استقبل بيانات القياس عن بعد من أقمار CubeSat المصغرة على نطاق UHF. راقب حالة مركبات فضائية حقيقية في مدارها في الزمن الحقيقي."],
["moon-bounce-viz","ham-sat","moon-bounce-viz","EME visualization: signal to Moon and back. Plot real EME contacts. Ultimate distance.","Visualisation du rebond lunaire (EME) : le signal voyage jusqu'à la Lune et revient. Tracez les contacts EME réels sur la carte mondiale — la distance de communication ultime en radioamateur.","تصور بصري لاتصال ارتداد القمر (EME): أرسل إشارة للقمر وانتظر عودتها. ارسم اتصالات EME حقيقية. أقصى مسافة ممكنة للراديو الهاوي."],
["graves-meteor","ham-sat","graves-radar-meteor","Receive GRAVES radar reflections off meteor trails. Detect shooting stars with radio.","Captez les réflexions du radar GRAVES sur les traînées ionisées des météores. Détectez les étoiles filantes par radiofréquence même en plein jour ou par ciel couvert — astronomie radio passive.","استقبل انعكاسات رادار GRAVES الفرنسي عن مسارات الشهب المتأينة في الغلاف الجوي. اكتشف الشهب والنجوم المتساقطة باستخدام الراديو فقط."],
// Ham + micro:bit
["cw-paddle","ham-mb","cw-paddle","micro:bit as CW paddle. Buttons for dit/dah, accelerometer for speed. HackRF transmits.","Le micro:bit devient un manipulateur Morse (CW) : boutons A/B pour les points et traits, accéléromètre pour contrôler la vitesse par inclinaison. Le HackRF émet le signal sur les ondes.","micro:bit يتحول لمفتاح مورس (CW): الأزرار للنقطة والشرطة ومقياس التسارع يتحكم بالسرعة بالإمالة. HackRF يبث الإشارة على الهواء."],
["signal-meter","ham-mb","signal-meter","micro:bit displays S-meter from HackRF on LED matrix. Find best antenna position.","Le micro:bit affiche le S-mètre du HackRF sur sa matrice LED intégrée. Outil de terrain portable idéal pour optimiser le positionnement et l'orientation de votre antenne radiofréquence.","micro:bit يعرض مقياس قوة الإشارة (S-meter) من HackRF على مصفوفة LED المدمجة. استخدمه كأداة ميدانية محمولة لإيجاد أفضل موضع للهوائي."],
["satellite-alarm","ham-mb","satellite-alarm","micro:bit buzzes for satellite/ISS passes. Never miss a pass.","Le micro:bit vibre et alerte lors de chaque passage de satellite radioamateur ou de l'ISS au-dessus de votre position. Ne manquez plus jamais une opportunité de réception spatiale.","micro:bit يهتز وينبهك عند مرور الأقمار الصناعية ومحطة الفضاء الدولية فوق موقعك. لا تفوّت أي فرصة استقبال بعد الآن."],
["fox-hunt-compass","ham-mb","fox-hunt-compass","micro:bit compass + HackRF signal strength. Arrow toward hidden transmitter.","La boussole du micro:bit combinée au niveau de signal du HackRF crée un outil de radiogoniométrie portatif. Un indicateur directionnel vous guide vers l'émetteur caché — chasse au renard radio.","بوصلة micro:bit الرقمية مع مؤشر قوة إشارة HackRF. سهم على الشاشة يرشدك مباشرة نحو المرسل المخفي في مسابقة صيد الثعلب الراديوي."],
// Ham + ESP32
["aprs-igate","ham-esp","aprs-igate","ESP32 receives APRS, forwards to internet (iGate). Run real infrastructure.","L'ESP32 reçoit les paquets APRS par radio et les retransmet vers Internet en tant que passerelle iGate. Exploitez une infrastructure radioamateur réelle et contribuez au réseau mondial APRS.","ESP32 يستقبل حزم APRS من الهواء ويحولها إلى الإنترنت كبوابة iGate حقيقية. شغّل جزءاً فعلياً من البنية التحتية لراديو الهواة."],
["digi-repeater","ham-esp","digi-repeater","ESP32 digital repeater for packet radio. Visualize relay chain.","L'ESP32 fonctionne comme répéteur numérique pour la radio par paquets : réception, stockage et retransmission pour étendre la portée du réseau. Visualisez la chaîne de relais complète en temps réel.","ESP32 يعمل كمكرر رقمي لراديو الحزم اللاسلكية. يستقبل الحزم ويعيد إرسالها لتوسيع مدى الشبكة. تصور بصري لسلسلة الترحيل كاملة."],
["remote-sdr","ham-esp","remote-sdr","ESP32 streams HackRF over WiFi. Shared radio station for classroom.","L'ESP32 diffuse les données du HackRF en WiFi vers tous les appareils connectés. Transformez un seul récepteur en station de radio logicielle (SDR) partagée pour toute la classe.","ESP32 يبث بيانات HackRF لاسلكياً عبر WiFi لجميع الأجهزة. حوّل جهاز راديو واحد إلى محطة راديو معرّف بالبرمجيات مشتركة لكل الفصل."],
["antenna-analyzer","ham-esp","antenna-analyzer","ESP32 RF bridge + HackRF. Plot SWR, impedance, resonance. Design and test antennas.","Pont radiofréquence sur ESP32 couplé au HackRF. Tracez les courbes de ROS (rapport d'ondes stationnaires), d'impédance et de résonance. Concevez et testez vos antennes avec précision.","جسر RF على ESP32 مع HackRF. ارسم منحنيات نسبة الموجة المستقرة (SWR) والمعاوقة وتردد الرنين. صمم الهوائيات واختبر أداءها عملياً."],
["beacon-controller","ham-esp","beacon-controller","ESP32 controls HackRF as automated beacon: WSPR, CW, FT8. Propagation research.","L'ESP32 pilote le HackRF comme balise d'émission automatique en WSPR, CW et FT8. Outil de recherche scientifique pour cartographier la propagation ionosphérique sur de longues périodes.","ESP32 يتحكم بجهاز HackRF كمنارة إرسال آلية بأوضاع WSPR وCW وFT8. أداة بحث علمي لدراسة انتشار الموجات الراديوية عبر الأيونوسفير."],
["solar-monitor","ham-esp","solar-monitor","ESP32 solar sensor + SFI/SSN data. Correlate with HackRF observations.","L'ESP32 avec capteur solaire et données SFI (flux solaire) et SSN (taches solaires). Corrélation directe entre activité solaire et qualité de propagation observée par le HackRF — science citoyenne.","ESP32 مع مستشعر شمسي وبيانات مؤشر التدفق الشمسي (SFI) وعدد البقع الشمسية (SSN). اربط النشاط الشمسي بملاحظات انتشار HackRF."],
// Ham — Emergency
["go-box-dashboard","ham-em","go-box-dashboard","Portable EmComm: HackRF + ESP32 + battery. Radio, digital modes, APRS, Winlink, solar status.","Station de communications d'urgence portable : HackRF + ESP32 + batterie autonome. Intègre radio voix, modes numériques, APRS et Winlink avec suivi de l'état de charge solaire.","نظام اتصالات طوارئ محمول متكامل: HackRF + ESP32 + بطارية. يشمل الراديو والأوضاع الرقمية وAPRS وWinlink ومراقبة حالة الطاقة الشمسية."],
["mesh-emergency-net","ham-em","mesh-emergency-net","ESP32 mesh local + HackRF long-range HF. Bridge local and distant comms.","Réseau maillé ESP32 pour les communications locales combiné au HackRF en ondes courtes HF pour la longue portée. Pont reliant les secours locaux au monde extérieur en situation de crise.","شبكة ESP32 شبكية محلية للاتصال القريب مع HackRF للاتصال بعيد المدى عبر موجات HF. جسر يربط اتصالات الطوارئ المحلية بالعالم الخارجي."],
["field-day-station","ham-em","field-day-station","Complete Field Day: HackRF radio, browser logging, ESP32 antenna control, micro:bit meter.","Station de Field Day complète : HackRF comme émetteur-récepteur, navigateur pour la journalisation automatique, ESP32 pour le contrôle d'antenne et micro:bit comme S-mètre de terrain.","محطة يوم ميداني كاملة: راديو HackRF للإرسال والاستقبال وتسجيل تلقائي بالمتصفح وتحكم بالهوائي عبر ESP32 ومقياس إشارة micro:bit."],
["skywarn-station","ham-em","skywarn-station","ESP32 weather sensors + HackRF APRS weather. Contribute to national weather network.","Capteurs météorologiques ESP32 couplés au HackRF pour l'émission de bulletins APRS. Contribuez au réseau national de surveillance météorologique comme station d'observation officielle Skywarn.","مستشعرات طقس ESP32 ترسل بياناتها عبر APRS بواسطة HackRF. ساهم فعلياً في شبكة رصد الطقس الوطنية كمحطة أرصاد جوية لاسلكية."],
// Ham — Learning
["ham-exam-trainer","ham-learn","ham-exam-trainer","Exam prep with live HackRF demos. Theory meets practice instantly.","Préparation à l'examen de licence radioamateur avec démonstrations HackRF en direct. Chaque concept théorique est immédiatement illustré par une expérience pratique sur le spectre réel.","تحضير لامتحان رخصة الراديو الهاوي مع عروض توضيحية حية بجهاز HackRF. كل مفهوم نظري يُعرض فوراً بتجربة عملية تطبيقية مباشرة."],
["band-condition-game","ham-learn","band-condition-game","'What band is open to Japan?' Check with HackRF, get scored. Live propagation learning.","Quelle bande est ouverte vers le Japon en ce moment ? Vérifiez votre réponse avec le HackRF et gagnez des points. Apprentissage ludique et interactif de la propagation ionosphérique réelle.","لعبة تعليمية: أي نطاق تردد مفتوح الآن للاتصال باليابان؟ تحقق من إجابتك بـ HackRF واحصل على نقاط. تعلم انتشار الموجات بشكل تفاعلي."],
["antenna-sim-vs-real","ham-learn","antenna-sim-vs-real","Browser simulates patterns. HackRF + analyzer measures real antenna. Compare sim vs reality.","Le navigateur simule les diagrammes de rayonnement d'antenne en théorie. Le HackRF et l'analyseur mesurent l'antenne réelle. Comparez simulation et réalité — physique des antennes appliquée.","المتصفح يحاكي أنماط إشعاع الهوائي نظرياً. HackRF مع محلل يقيس الهوائي الحقيقي فعلياً. قارن بين نتائج المحاكاة والقياس الواقعي."],
["qsl-card-maker","ham-learn","qsl-card-maker","Auto-generate QSL cards: callsign, freq, mode, waterfall screenshot, location map.","Génération automatique de cartes QSL de confirmation de contact : indicatif d'appel, fréquence, mode, capture du cascade spectral et carte géographique. Tradition radioamateur modernisée.","توليد تلقائي لبطاقات تأكيد الاتصال QSL: تتضمن علامة النداء والتردد والوضع ولقطة من العرض الشلالي وخريطة الموقع الجغرافي."],
// Ham — God-Tier
["all-band-all-mode","ham-ult","all-band-all-mode","HackRF as radio, browser as full transceiver: VFO, waterfall, every decoder. One app.","Le HackRF devient un émetteur-récepteur complet piloté par le navigateur : oscillateur à fréquence variable, cascade spectrale et tous les démodulateurs réunis dans une seule application universelle.","HackRF كراديو متكامل والمتصفح كجهاز إرسال واستقبال شامل: مذبذب تردد متغير وشلال وكل مزيلات التعديل في تطبيق واحد موحد."],
["ionosphere-mapper","ham-ult","ionosphere-mapper","HackRF beacons + ESP32 solar data. Real-time 3D ionosphere model. The invisible mirror.","Balises HackRF combinées aux données solaires de l'ESP32 pour construire un modèle 3D de l'ionosphère en temps réel. Visualisez ce miroir invisible qui réfléchit les ondes courtes autour du globe.","منارات HackRF مع بيانات النشاط الشمسي من ESP32 لبناء نموذج ثلاثي الأبعاد حي للغلاف الأيونوسفيري. شاهد المرآة غير المرئية التي ترتد عنها الموجات."],
["radio-observatory-365","ham-ult","radio-observatory-365","24/7 spectrum recording. Long-term: seasonal propagation, solar cycles, meteor showers.","Observatoire radio enregistrant le spectre en continu, 24h/24 et 365 jours par an. Analyse à long terme des cycles de propagation saisonniers, des cycles solaires et des pluies de météores.","مرصد راديوي يسجل الطيف على مدار الساعة طوال العام. تحليل طويل المدى لأنماط الانتشار الموسمية والدورات الشمسية وزخات الشهب."],
["contest-station","ham-ult","contest-station","Full contest: logging, decode, score, rate meter, multiplier map, rotator control.","Station de concours radioamateur tout-en-un : journalisation automatique, décodage multi-modes, compteur de score et de cadence, carte des multiplicateurs et pilotage du rotor d'antenne. Prêt pour la compétition.","محطة مسابقات راديو هواة كاملة: تسجيل آلي وفك ترميز تلقائي وعداد معدل اتصالات وخريطة مضاعفات وتحكم بدوار الهوائي. كل شيء موحد."],
// SDR — DSP
["dsp-workbench","sdr-dsp","dsp-workbench","Visual DSP sandbox: drag-drop filters, mixers, demodulators, FFT. Build your receiver.","Bac à sable de traitement numérique du signal (DSP) visuel : glissez filtres, mélangeurs, démodulateurs et FFT. Construisez votre récepteur.","ورشة معالجة إشارات رقمية (DSP) بصرية: اسحب وأفلت المُرشّحات والخلّاطات ومُزيلات التعديل وتحويل فورييه السريع. ابنِ جهاز استقبالك الخاص."],
["filter-forge","sdr-dsp","filter-forge","Design FIR/IIR filters visually. See filter applied to live signal. Poles, zeros, impulse response.","Concevez des filtres FIR/IIR visuellement avec pôles, zéros et réponse impulsionnelle. Appliquez-les au signal en direct et observez l'effet instantanément.","صمم مُرشّحات FIR وIIR بصرياً وشاهد تأثيرها على الإشارة الحية فوراً. تحكم بالأقطاب والأصفار واستجابة النبضة ومنحنى التردد تفاعلياً."],
["modulation-lab","sdr-dsp","modulation-lab","Generate/analyze AM, FM, SSB, QAM, OFDM, FSK. Constellation, eye diagrams, BER curves.","Laboratoire de modulation : générez et analysez AM, FM, SSB, QAM, OFDM et FSK. Diagrammes de constellation, diagrammes de l'œil et courbes BER.","مختبر التعديل الراديوي: وّلد وحلّل أنظمة AM وFM وSSB وQAM وOFDM وFSK. مخططات الكوكبة وعين الإشارة ومنحنيات معدل خطأ البت."],
["iq-explorer","sdr-dsp","iq-explorer","Visualize raw IQ data every way: time, frequency, spectrogram, constellation, phase.","Explorez les données IQ brutes sous tous les angles : domaine temporel, fréquentiel, spectrogramme dynamique, constellation et diagramme de phase.","تصور بيانات IQ الخام من الراديو المعرّف بالبرمجيات بكل الطرق: المجال الزمني والترددي والمخطط الطيفي ومخطط الكوكبة والطور."],
["fft-racing","sdr-dsp","fft-racing","Compare FFT sizes, window functions, overlap. See how settings affect resolution.","Course de transformées de Fourier rapides (FFT) : comparez tailles, fonctions de fenêtrage et chevauchement. Visualisez l'impact sur la résolution spectrale.","سباق تحويل فورييه السريع: قارن أحجام FFT ودوال النوافذ (هامينغ، بلاكمان، هان) ونسب التداخل. شاهد تأثير كل إعداد على دقة التحليل الطيفي."],
["signal-generator","sdr-dsp","signal-generator","Arbitrary waveform generator. Design chirps, bursts, sweeps. HackRF transmits.","Générateur de forme d'onde arbitraire : concevez chirps, impulsions et balayages fréquentiels personnalisés. HackRF transmet vos créations sur l'air.","مولّد أشكال موجية اعتباطية: صمم إشارات النقيق والدفقات والمسحات الترددية المخصصة. HackRF يبثها فعلياً على الهواء للاختبار والتجريب."],
["demod-challenge","sdr-dsp","demod-challenge","Mystery signals on waterfall. Identify modulation, build demod chain to decode. CTF for DSP.","Signaux mystères sur la cascade spectrale. Identifiez la modulation et construisez la chaîne de démodulation pour décoder. Un CTF pour passionnés de DSP.","إشارات غامضة تظهر على العرض الشلالي. حدد نوع التعديل وابنِ سلسلة إزالة تعديل لفك ترميزها. مسابقة التقاط علم لمعالجة الإشارات الرقمية."],
["noise-floor-lab","sdr-dsp","noise-floor-lab","Measure noise figure, SNR, dynamic range. Compare antennas, preamps. Dig out weak signals.","Mesurez le facteur de bruit, le rapport signal/bruit (SNR) et la plage dynamique. Comparez antennes et préamplificateurs pour extraire les signaux faibles.","مختبر أرضية الضوضاء: قس رقم الضوضاء ونسبة الإشارة للضوضاء (SNR) والنطاق الديناميكي. قارن أداء الهوائيات والمضخمات الأولية لاستخراج أضعف الإشارات."],
// SDR — Multi-Receiver
["coherent-sdr","sdr-multi","coherent-sdr","Two phase-locked HackRFs. Compute angle of arrival. Real direction-finding array.","Deux HackRFs verrouillés en phase pour calculer l'angle d'arrivée des signaux. Goniométrie réelle : localisez les émetteurs par radiogoniométrie.","جهازا HackRF مقفلان بالطور لحساب زاوية وصول الإشارة بدقة. مصفوفة تحديد اتجاه راديوي حقيقية لرسم خريطة مصادر الإرسال."],
["wideband-recorder","sdr-multi","wideband-recorder","Record 20MHz continuously. Scrub through time, demodulate anything after the fact. Radio DVR.","Enregistrez 20 MHz de bande passante en continu. Parcourez le temps et démodulez n'importe quel signal après coup. Un magnétoscope numérique pour la radio.","سجّل 20 ميجاهرتز من عرض النطاق باستمرار. تنقل عبر الزمن وأزل تعديل أي إشارة لاحقاً بعد التسجيل. مسجل فيديو رقمي للطيف الراديوي بالكامل."],
["sdr-farm","sdr-multi","sdr-farm","Multiple RTL-SDRs, each on different band. Browser stitches into wideband display.","Ferme de RTL-SDR : chaque récepteur couvre une bande différente, le navigateur assemble tout en un affichage spectral large bande unifié et continu.","مزرعة أجهزة RTL-SDR متعددة كل جهاز مضبوط على نطاق تردد مختلف. المتصفح يدمج العروض الشلالية في عرض طيفي واسع النطاق وموحد."],
["tdoa-locator","sdr-multi","tdoa-locator","Three SDRs at known positions. Compute TDOA to triangulate any transmitter on map.","Trois SDR positionnés stratégiquement calculent le TDOA (différence de temps d'arrivée) pour trianguler et localiser tout émetteur sur la carte.","ثلاثة أجهزة SDR في مواقع جغرافية معروفة. احسب فرق وقت الوصول (TDOA) لتحديد موقع أي مرسل راديوي وتثليثه على الخريطة بدقة."],
["doppler-tracker","sdr-multi","doppler-tracker","Track moving transmitters by Doppler shift. Compute velocity and trajectory.","Pistez les émetteurs mobiles grâce à l'analyse du décalage Doppler en temps réel. Calculez vitesse, trajectoire et tracez le parcours sur la carte.","تتبع المرسلات اللاسلكية المتحركة من خلال تحليل انزياح دوبلر في التردد. احسب سرعة الهدف ومساره وارسم مسار حركته على الخريطة."],
["correlation-detector","sdr-multi","correlation-detector","Cross-correlate two SDRs to extract signals below noise floor. Radio interferometry.","Corrélation croisée de deux SDR pour extraire des signaux enfouis sous le plancher de bruit. Interférométrie radio : voir l'invisible ensemble.","ارتباط تبادلي بين جهازي SDR لاستخراج إشارات مدفونة تحت أرضية الضوضاء. قياس التداخل الراديوي يكشف ما لا يراه مستقبل واحد بمفرده."],
// SDR — Aviation/Maritime
["vhf-airband","sdr-avia","vhf-airband","Receive 118-137 MHz aviation. Decode ACARS, log frequencies. Live airport radio.","Recevez la bande aéronautique VHF 118-137 MHz, décodez les messages ACARS et écoutez les communications air-sol en direct. Radio d'aéroport captivante.","استقبل نطاق الطيران VHF بين 118 و137 ميجاهرتز. فك ترميز رسائل ACARS وسجل الترددات النشطة. راديو مطار حي مع مراقبة الاتصالات الجوية."],
["acars-decoder","sdr-avia","acars-decoder","Decode ACARS: flight info, weather, position, maintenance. Real aircraft data.","Décodez le système ACARS : informations de vol, bulletins météo, positions GPS et données de maintenance. Télémétrie d'avions réels en temps réel.","فك ترميز نظام ACARS لاتصالات الطائرات: معلومات الرحلة وتقارير الطقس والموقع الجغرافي وبيانات الصيانة. بيانات طائرات حقيقية مباشرة."],
["ais-maritime","sdr-avia","ais-maritime","Receive AIS 162 MHz. Plot ships: name, course, speed, destination, cargo.","Recevez le système AIS à 162 MHz et cartographiez les navires en temps réel : nom, cap, vitesse, destination et type de cargaison sur une carte maritime.","استقبل نظام التعرف التلقائي AIS على تردد 162 ميجاهرتز. ارسم السفن على الخريطة مع اسم كل سفينة ومسارها وسرعتها ووجهتها ونوع حمولتها."],
["vdl-mode2","sdr-avia","vdl-mode2","Decode VDL Mode 2 aircraft datalink. Next-gen aviation monitoring.","Décodez la liaison de données numériques VDL Mode 2 des avions. Surveillance aéronautique nouvelle génération avec des données bien plus riches que l'ACARS.","فك ترميز وصلة بيانات الطائرات VDL Mode 2 الرقمية. مراقبة الطيران من الجيل التالي ببيانات أغنى وأدق من نظام ACARS التقليدي."],
["navtex-decoder","sdr-avia","navtex-decoder","Receive NAVTEX 518/490 kHz. Maritime safety: weather warnings, hazards, SAR alerts.","Recevez NAVTEX sur 518/490 kHz : bulletins de sécurité maritime, alertes météo, dangers de navigation et messages de recherche et sauvetage en mer.","استقبل نظام NAVTEX البحري على ترددي 518 و490 كيلوهرتز. نشرات سلامة بحرية تشمل تحذيرات الطقس والمخاطر الملاحية وتنبيهات البحث والإنقاذ."],
["radiosondes-tracker","sdr-avia","radiosondes-tracker","Decode weather balloon telemetry 400-406 MHz. Track path, temperature, humidity, wind.","Décodez la télémétrie des ballons-sondes météo sur 400-406 MHz. Suivez leur ascension, température, humidité et vitesse du vent en altitude temps réel.","فك ترميز بيانات القياس عن بعد من بالونات الطقس على نطاق 400-406 ميجاهرتز. تتبع مسار الصعود ودرجة الحرارة والرطوبة وسرعة الرياح في طبقات الجو."],
["lightning-detector","sdr-avia","lightning-detector","SDR detects radio sferics from lightning. Map strikes in real time. DIY lightning network.","Le SDR détecte les sphériques radio émis par la foudre. Cartographiez les impacts en temps réel et créez votre propre réseau de détection d'orages.","الراديو المعرّف بالبرمجيات يكشف الموجات الراديوية الصادرة عن البرق (السفيريات). ارسم خريطة ضربات البرق مباشرة. شبكة رصد برق محلية الصنع."],
// SDR — Science
["radio-spectrometer","sdr-sci","radio-spectrometer","SDR as scientific instrument. Calibrated spectral data. Real radio science.","Le SDR comme véritable instrument scientifique : données spectrales calibrées et exportables. Radioastronomie et physique spectrale à portée de main.","الراديو المعرّف بالبرمجيات كأداة قياس علمية دقيقة. بيانات طيفية معايرة وقابلة للتصدير. علم فلك راديوي وفيزياء طيفية حقيقية بأجهزة ميسورة."],
["solar-flare-monitor","sdr-sci","solar-flare-monitor","Monitor solar radio bursts on VHF. Alert on sudden ionospheric disturbances. Detect flares.","Surveillez les sursauts radio solaires en VHF et recevez des alertes sur les perturbations ionosphériques soudaines. Détectez les éruptions solaires vous-même.","راقب الانفجارات الراديوية الشمسية على نطاق VHF وتلقَّ تنبيهات فورية عند حدوث اضطرابات أيونوسفيرية مفاجئة. اكتشف التوهجات الشمسية بجهازك."],
["jupiter-receiver","sdr-sci","jupiter-receiver","Receive Jupiter's decametric emissions at 20 MHz. Detect Io-related bursts. Planetary radio.","Recevez les émissions décamétriques de Jupiter à 20 MHz et détectez les sursauts liés au satellite Io. Radioastronomie planétaire avec votre propre station.","استقبل الانبعاثات الراديوية الديكامترية من كوكب المشتري عند تردد 20 ميجاهرتز. اكتشف الانفجارات المرتبطة بقمر Io. علم فلك كوكبي راديوي حقيقي."],
["rfi-hunter","sdr-sci","rfi-hunter","Map RF interference sources. Plot with spectrum fingerprint. Keep bands clean.","Cartographiez les sources d'interférences RF (RFI) avec leur empreinte spectrale unique. Outil indispensable pour garder les bandes de fréquences propres.","ارسم خريطة لمصادر التداخل الراديوي (RFI) في محيطك مع البصمة الطيفية لكل مصدر. أداة أساسية للحفاظ على نظافة نطاقات التردد."],
["propagation-beacon-net","sdr-sci","propagation-beacon-net","Deploy SDRs at multiple locations. Crowdsourced ionospheric research.","Déployez des SDR à plusieurs emplacements géographiques pour bâtir un réseau collaboratif de balises de propagation. Recherche ionosphérique participative.","انشر أجهزة الراديو المعرّف بالبرمجيات في مواقع جغرافية متعددة لبناء شبكة منارات انتشار تعاونية. بحث أيونوسفيري جماعي بمشاركة المجتمع."],
// SDR — IoT/Industrial
["lorawan-decoder","sdr-iot","lorawan-decoder","Receive and decode LoRaWAN traffic. Device addresses, frame counters, spreading factors.","Recevez et décodez le trafic LoRaWAN de l'Internet des objets. Analysez adresses, compteurs de trames et facteurs d'étalement pour auditer la sécurité IoT.","استقبل وفك ترميز حركة مرور LoRaWAN لإنترنت الأشياء. اعرض عناوين الأجهزة وعدادات الإطارات ومعاملات الانتشار لتحليل أمن شبكة IoT."],
["zigbee-sniffer","sdr-iot","zigbee-sniffer","Capture Zigbee 2.4 GHz. Decode frames, map topology, identify coordinators.","Capturez les signaux Zigbee à 2.4 GHz, décodez les trames réseau et cartographiez la topologie. Identifiez coordinateurs et nœuds terminaux du réseau.","التقط إشارات بروتوكول Zigbee على نطاق 2.4 غيغاهرتز. فك ترميز الإطارات وارسم طوبولوجيا الشبكة وحدد أجهزة التنسيق والعقد النهائية."],
["smart-meter-reader","sdr-iot","smart-meter-reader","Receive wireless smart meter transmissions 900 MHz. See utility RF data broadcasts.","Recevez les transmissions sans fil des compteurs intelligents à 900 MHz. Observez les données de consommation énergétique diffusées par radiofréquence.","استقبل إرسالات العدادات الذكية اللاسلكية على تردد 900 ميجاهرتز. شاهد بث بيانات استهلاك المرافق عبر الترددات الراديوية وحلل بنيتها."],
["tpms-scanner","sdr-iot","tpms-scanner","Decode tire pressure sensors 315/433 MHz. Pressure, temperature, sensor IDs.","Décodez les capteurs TPMS de pression des pneus sur 315/433 MHz : pression, température et identifiants uniques de chaque capteur en temps réel.","فك ترميز إشارات مستشعرات ضغط الإطارات (TPMS) على ترددات 315 و433 ميجاهرتز. اقرأ بيانات الضغط والحرارة ومعرّفات المستشعرات الفريدة."],
["keyfob-analyzer","sdr-iot","keyfob-analyzer","Analyze car keyfob signals: fixed vs rolling code, modulation. Security analysis, never replay.","Analysez les signaux de télécommandes auto : comparez codes fixes et codes roulants, étudiez la modulation. Analyse de sécurité éducative sans rejeu.","حلل إشارات مفاتيح السيارة اللاسلكية: قارن بين الرموز الثابتة والمتدحرجة ونوع التعديل. تحليل أمني تعليمي بدون إعادة إرسال أي إشارة."],
["industrial-scanner","sdr-iot","industrial-scanner","Scan for SCADA/industrial wireless: WirelessHART, ISA100. ICS security awareness.","Scannez les protocoles industriels sans fil WirelessHART et ISA100.11a. Sensibilisation à la cybersécurité des systèmes de contrôle industriel (SCADA/ICS).","امسح البروتوكولات الصناعية اللاسلكية مثل WirelessHART وISA100. رفع الوعي بالأمن السيبراني لأنظمة التحكم الصناعية (ICS/SCADA) اللاسلكية."],
// SDR — Tools
["antenna-profiler","sdr-tool","antenna-profiler","SDR + noise source. Measure gain, bandwidth, VSWR. Calibrated antenna reports.","SDR avec source de bruit calibrée : mesurez le gain, la bande passante et le VSWR de vos antennes. Générez des rapports de performance professionnels.","SDR مع مصدر ضوضاء معاير لقياس كسب الهوائي وعرض النطاق الترددي ونسبة الموجة المستقرة (VSWR). تقارير أداء هوائيات معايرة واحترافية."],
["oscilloscope-mode","sdr-tool","oscilloscope-mode","SDR as RF oscilloscope. Triggered waveforms, measurements. Basic RF test equipment.","Transformez votre SDR en oscilloscope RF : formes d'onde déclenchées, mesures d'amplitude et de fréquence. Équipement de test RF à coût minimal.","الراديو المعرّف بالبرمجيات كأوسيلوسكوب للترددات الراديوية. أشكال موجية محفّزة مع قياسات دقيقة للسعة والتردد. معدات اختبار RF أساسية بتكلفة منخفضة."],
["signal-classifier","sdr-tool","signal-classifier","ML on SDR data: auto-identify and classify signals. Train on known, identify unknowns.","Apprentissage automatique appliqué aux données SDR : identifiez et classifiez les signaux inconnus automatiquement. Entraînez le modèle et détectez l'inconnu.","تعلم آلي (ML) مطبق على بيانات الراديو المعرّف بالبرمجيات: حدد الإشارات المجهولة وصنفها تلقائياً. درّب النموذج على إشارات معروفة لكشف المجهول."],
["band-allocator","sdr-tool","band-allocator","Input country, overlay legal band allocations on live waterfall. Know what's legal.","Sélectionnez votre pays et superposez les allocations de bandes légales sur la cascade en direct. Sachez instantanément ce qui est autorisé à émettre.","أدخل بلدك وشاهد تخصيصات النطاقات الترددية القانونية متراكبة على العرض الشلالي الحي. اعرف ما هو مسموح الإرسال عليه في منطقتك فوراً."],
["interference-finder","sdr-tool","interference-finder","SDR identifies interference: harmonics, spurs, intermod. Trace to likely source. Debug RF.","Le SDR identifie les interférences : harmoniques, raies parasites et intermodulation. Tracez la source probable pour nettoyer votre environnement RF.","SDR يحدد مصادر التداخل الراديوي: التوافقيات والنتوءات الزائفة والتعديل المتبادل. تتبع المصدر المحتمل لتنظيف بيئتك الكهرومغناطيسية."],
["sdr-benchmark","sdr-tool","sdr-benchmark","Test SDR hardware: sensitivity, dynamic range, frequency accuracy. Performance reports.","Banc d'essai SDR : mesurez sensibilité, plage dynamique et précision fréquentielle de vos récepteurs. Rapports comparatifs pour choisir le bon matériel.","اختبر أداء أجهزة الراديو المعرّف بالبرمجيات: قس الحساسية والنطاق الديناميكي ودقة التردد. تقارير مقارنة أداء لاختيار الجهاز الأنسب لاحتياجاتك."],
// SDR — Learning
["rf-101","sdr-learn","rf-101","Interactive course from zero: radio waves, frequency, propagation, modulation. 30+ lessons with live SDR.","Cours interactif partant de zéro : ondes radio, fréquence, propagation et modulation. Plus de 30 leçons avec démonstrations en direct sur votre SDR.","دورة تفاعلية تبدأ من الصفر: موجات الراديو والتردد والانتشار والتعديل. أكثر من 30 درساً مع عروض حية على الراديو المعرّف بالبرمجيات."],
["sdr-sandbox","sdr-learn","sdr-sandbox","Safe receive-only exploration. Guided overlays explaining each signal.","Bac à sable SDR en réception seule, sans risque. Guides interactifs superposés expliquant chaque signal visible sur le spectre. Apprenez sans crainte.","بيئة استكشاف آمنة بوضع الاستقبال فقط لـ SDR. أدلة إرشادية بصرية متراكبة تشرح كل إشارة تظهر على الطيف. تعلم دون خوف من الخطأ."],
["build-a-receiver","sdr-learn","build-a-receiver","Step-by-step: write FFT, build filter, implement demodulator on live SDR data.","Construisez votre récepteur pas à pas : codez la FFT, concevez un filtre numérique et implémentez un démodulateur fonctionnant sur des données SDR en direct.","ابنِ جهاز استقبال خطوة بخطوة: اكتب تحويل فورييه السريع (FFT) ثم ابنِ مُرشّحاً رقمياً ثم نفّذ مُزيل تعديل يعمل على بيانات SDR حية."],
["protocol-reverse-lab","sdr-learn","protocol-reverse-lab","Unknown signal. Measure baud rate, identify encoding, extract data. Reverse engineering.","Signal inconnu devant vous : mesurez le débit en bauds, identifiez l'encodage et extrayez les données. Rétro-ingénierie de protocoles radio en pratique.","مختبر الهندسة العكسية للبروتوكولات: إشارة مجهولة أمامك. قس معدل البود وحدد نوع الترميز واستخرج البيانات المفيدة. تعلم فن فك الغموض."],
["exam-lab-sdr","sdr-learn","exam-lab-sdr","Ham exam questions linked to live SDR demos. 'What is a mixer?' — see it live.","Questions d'examen radioamateur illustrées par des démonstrations SDR en direct. Qu'est-ce qu'un mélangeur ? Voyez la réponse en action sur le spectre.","أسئلة امتحان رخصة الراديو الهاوي مرتبطة بعروض حية على الراديو المعرّف بالبرمجيات. اسأل ما هو الخلّاط؟ وشاهد الإجابة عملياً أمامك."],
// SDR — God-Tier
["universal-decoder","sdr-ult","universal-decoder","Auto-detect and decode everything: ADS-B, AIS, APRS, POCSAG, DMR, P25, FT8, SSTV, NOAA APT...","Détection automatique et décodage universel : ADS-B, AIS, APRS, POCSAG, DMR, P25, FT8, SSTV, NOAA APT et plus. Aucune configuration nécessaire.","كشف تلقائي وفك ترميز لكل البروتوكولات: ADS-B وAIS وAPRS وPOCSAG وDMR وP25 وFT8 وSSTV وNOAA APT. فك ترميز شامل بلا إعداد مسبق."],
["sdr-server","sdr-ult","sdr-server","HackRF as network SDR server. Multiple users, multiple frequencies, one receiver.","HackRF transformé en serveur SDR réseau : plusieurs utilisateurs écoutent des fréquences différentes simultanément depuis un seul récepteur partagé.","HackRF كخادم راديو معرّف بالبرمجيات عبر الشبكة. عدة مستخدمين يضبطون ترددات مختلفة في آن واحد من مستقبل واحد مشترك على الشبكة المحلية."],
["spectrum-observatory","sdr-ult","spectrum-observatory","24/7 monitoring. Long-term statistics, anomaly detection, occupancy. Spectrum management.","Observatoire spectral 24h/24 et 7j/7 : statistiques long terme, détection automatique d'anomalies et analyse d'occupation des bandes. Gestion du spectre RF.","مرصد طيفي يعمل على مدار الساعة طوال الأسبوع. إحصائيات طويلة المدى وكشف تلقائي للشذوذ وتحليل إشغال النطاقات. أداة إدارة الطيف الراديوي."],
["sdr-os","sdr-ult","sdr-os","Complete SDR OS in browser: receiver, transmitter, analyzer, recorder, decoder, plugins.","Système d'exploitation SDR complet dans le navigateur : récepteur, émetteur, analyseur spectral, enregistreur, décodeur et plugins extensibles.","نظام تشغيل كامل للراديو المعرّف بالبرمجيات في المتصفح: مستقبل ومُرسل ومحلل طيفي ومسجل وفك ترميز ومكونات إضافية قابلة للتوسيع."],
// ANTENNA — Build & Test
["antenna-forge","ant-build","antenna-forge","Interactive antenna designer: input frequency, select type (dipole, Yagi, loop, patch, helical). Browser calculates dimensions, 3D model, cutting template. HackRF tests.","Concepteur d'antenne interactif : choisissez fréquence et type (dipôle, Yagi, boucle, patch, hélicoïdale). Modèle 3D, gabarit de découpe et test HackRF.","مصمم هوائيات تفاعلي: أدخل التردد واختر النوع (ثنائي القطب، ياغي، حلقة، رقعة، لولبي). نموذج ثلاثي الأبعاد وقالب قطع جاهز. HackRF يختبر الأداء."],
["antenna-range","ant-build","antenna-range","Automated test range: HackRF transmits reference, ESP32 rotator spins antenna, browser plots radiation pattern live.","Banc d'essai d'antenne automatisé : HackRF émet une référence, ESP32 fait tourner l'antenne et le navigateur trace le diagramme de rayonnement en direct.","نطاق اختبار هوائيات آلي: HackRF يرسل إشارة مرجعية وESP32 يدير الهوائي عبر محرك دوران والمتصفح يرسم نمط الإشعاع الفعلي مباشرة."],
["yagi-optimizer","ant-build","yagi-optimizer","Design Yagi-Uda: add/remove elements, adjust spacing, see gain and pattern change live. Build and compare with HackRF.","Optimiseur Yagi-Uda : ajoutez ou retirez des éléments, ajustez l'espacement et observez le gain et le diagramme changer en direct. Validez avec HackRF.","صمم هوائي ياغي-أودا: أضف وأزل العناصر واضبط التباعد وشاهد تغير الكسب ونمط الإشعاع حياً. ابنِ التصميم فعلياً وقارن القياسات بـ HackRF."],
["antenna-shootout","ant-build","antenna-shootout","Side-by-side comparison: switch antennas, HackRF measures each. Gain difference, bandwidth, noise floor. Data-driven selection.","Duel d'antennes côte à côte : basculez entre chaque modèle, HackRF mesure gain, bande passante et plancher de bruit. Sélection basée sur les données.","مقارنة هوائيات جنباً إلى جنب: بدّل بين الهوائيات وHackRF يقيس كلاً منها. فرق الكسب وعرض النطاق وأرضية الضوضاء. اختيار قائم على البيانات."],
["sdr-antenna-tuner","ant-build","sdr-antenna-tuner","Automated tuner: ESP32 controls variable caps/inductors, HackRF measures SWR, browser optimizes match.","Accordeur automatique d'antenne : ESP32 pilote condensateurs et inducteurs variables, HackRF mesure le ROS et le navigateur optimise l'adaptation d'impédance.","موالف هوائي آلي: ESP32 يتحكم بالمكثفات والملفات المتغيرة وHackRF يقيس نسبة الموجة المستقرة والمتصفح يحسّن مطابقة المعاوقة تلقائياً."],
["fractal-antenna-lab","ant-build","fractal-antenna-lab","Design fractal antennas: Koch, Sierpinski, Minkowski. 3D-print, HackRF measures multi-band performance.","Laboratoire d'antennes fractales : Koch, Sierpinski et Minkowski. Imprimez en 3D et mesurez les performances multibandes réelles avec HackRF.","صمم هوائيات كسورية (فراكتال): Koch وSierpinski وMinkowski. اطبعها بالطابعة ثلاثية الأبعاد وHackRF يقيس أداءها المتعدد النطاقات فعلياً."],
["wire-antenna-wizard","ant-build","wire-antenna-wizard","End-fed, dipole, EFHW, inverted-V, G5RV, OCF — calculate, build, deploy, compare each with HackRF.","Assistant antennes filaires : End-fed, dipôle, EFHW, V inversé, G5RV et OCF. Calculez les dimensions, construisez et comparez chaque modèle avec HackRF.","معالج هوائيات الأسلاك: End-fed ودايبول وEFHW وV مقلوب وG5RV وOCF. احسب الأبعاد وابنِ الهوائي وانشره وقارن أداء كل نوع بقياسات HackRF."],
["pcb-antenna-studio","ant-build","pcb-antenna-studio","Design PCB antennas: trace width, ground plane, feed point. Export Gerber, order PCB, test with HackRF.","Concevez des antennes sur circuit imprimé (PCB) : largeur de piste, plan de masse et point d'alimentation. Exportez en Gerber et validez avec HackRF.","صمم هوائيات على لوحة دارة مطبوعة (PCB): عرض المسار ومستوى الأرض ونقطة التغذية. صدّر ملفات Gerber واطلب اللوحة واختبرها مع HackRF."],
["antenna-farm-manager","ant-build","antenna-farm-manager","Multiple antennas via relay switching (ESP32). Browser selects antenna per band. HackRF compares. Manage your arsenal.","Gestion de parc d'antennes par commutation relais ESP32. Le navigateur sélectionne automatiquement la meilleure antenne par bande. Gérez votre arsenal RF.","مدير مزرعة هوائيات: تبديل بين هوائيات متعددة عبر مرحّلات يتحكم بها ESP32. المتصفح يختار الهوائي الأنسب لكل نطاق تردد. أدر ترسانتك بذكاء."],
["satellite-antenna-tracker","ant-build","satellite-antenna-tracker","Motorized dish/Yagi on pan-tilt (ESP32 servos). Browser computes satellite position, auto-points. HackRF receives.","Antenne motorisée sur tourelle pan-tilt avec servomoteurs ESP32. Le navigateur calcule la position du satellite en temps réel et pointe automatiquement.","هوائي طبق أو ياغي آلي على محور دوران بمحركات سيرفو ESP32. المتصفح يحسب موقع القمر الصناعي ويوجه الهوائي تلقائياً. HackRF يستقبل."],
["fox-antenna-builder","ant-build","fox-antenna-builder","Build directional antennas for fox hunting: tape-measure Yagi, Moxon, Adcock. Test each, use in real hunts.","Construisez des antennes directionnelles pour la chasse au renard radio : Yagi mètre-ruban, Moxon et Adcock. Testez puis partez en chasse réelle.","ابنِ هوائيات اتجاهية لمسابقات صيد الثعلب الراديوي: ياغي شريط قياس وMoxon وAdcock. اختبر أداء كل تصميم واستخدمه في صيد ميداني حقيقي."],
["magnetic-loop-tuner","ant-build","magnetic-loop-tuner","ESP32 stepper tunes magnetic loop capacitor. HackRF monitors SWR. Browser auto-tunes to any frequency.","ESP32 avec moteur pas-à-pas accorde le condensateur de la boucle magnétique. HackRF surveille le ROS en continu. Accord automatique sur toute fréquence.","ESP32 بمحرك خطوي يضبط مكثف هوائي الحلقة المغناطيسية. HackRF يراقب نسبة الموجة المستقرة. المتصفح يوالف الهوائي تلقائياً لأي تردد."],
["antenna-graveyard","ant-build","antenna-graveyard","Document antenna experiments: photos, measurements, radiation patterns, notes. Personal antenna database.","Documentez chaque expérience d'antenne : photos, mesures de gain, diagrammes de rayonnement et notes de terrain. Base de données personnelle évolutive.","وثّق جميع تجارب الهوائي: صور فوتوغرافية وقياسات أداء وأنماط إشعاع وملاحظات ميدانية. قاعدة بيانات هوائيات شخصية لتتبع تطور مشاريعك."],
// ANTENNA + Raspberry Pi
["pi-antenna-switch","ant-pi","pi-antenna-switch","Pi controls antenna relay matrix via GPIO. Browser selects antenna per band. Automated A/B testing.","Pi contrôle une matrice de relais de commutation d'antennes via GPIO. Sélection par bande depuis le navigateur avec test comparatif A/B entièrement automatisé.","Pi يتحكم بمصفوفة مرحّلات تبديل الهوائيات عبر منافذ GPIO. المتصفح يختار الهوائي الأنسب لكل نطاق تردد. اختبار مقارنة A/B آلي ودقيق."],
["pi-rotator-controller","ant-pi","pi-rotator-controller","Pi drives az/el rotator motors. Browser shows compass overlay with targets. Click target, antenna auto-tracks.","Pi pilote les moteurs de rotation azimut/élévation. Le navigateur affiche une boussole avec les cibles : cliquez et l'antenne se pointe automatiquement.","Pi يشغل محركات دوران الهوائي أفقياً وعمودياً. المتصفح يعرض بوصلة متراكبة مع الأهداف. انقر على هدف فيتوجه الهوائي تلقائياً نحوه."],
["pi-remote-station","ant-pi","pi-remote-station","Full remote ham station: Pi + HackRF + antenna + rotator at remote location. Operate via browser from anywhere.","Station radioamateur distante complète : Pi + HackRF + antenne + rotateur sur un site dégagé. Opérez depuis chez vous via le navigateur, où que vous soyez.","محطة راديو هواة بعيدة كاملة: Pi + HackRF + هوائي + دوّار في موقع مرتفع. شغّل المحطة من أي مكان في العالم عبر المتصفح فقط."],
["pi-phased-array","ant-pi","pi-phased-array","Multiple SDRs on Pi with separate antennas. Software beamforming. Steer the beam from browser. Phased array on a desk.","Plusieurs SDR sur Pi avec antennes distinctes pour la formation de faisceau logicielle (beamforming). Orientez le faisceau depuis le navigateur. Réseau phasé de bureau.","عدة أجهزة SDR على Pi بهوائيات منفصلة لتشكيل شعاع برمجي. وجّه الشعاع الراديوي من المتصفح. مصفوفة هوائيات طورية حقيقية على مكتبك."],
["pi-nec-simulator","ant-pi","pi-nec-simulator","Run NEC2 antenna simulation on Pi. Browser design interface. Compare sim with real HackRF measurements.","Exécutez la simulation d'antenne NEC2 sur Pi avec une interface de conception dans le navigateur. Comparez les résultats théoriques aux mesures réelles HackRF.","شغّل محاكاة NEC2 لتصميم الهوائيات على Pi مع واجهة تصميم بصرية في المتصفح. قارن نتائج المحاكاة النظرية بالقياسات الفعلية من HackRF."],
// RASPBERRY PI — Core
["pi-sdr-station","rpi-core","pi-sdr-station","Pi as dedicated SDR server. Runs GNU Radio, streams IQ over network. Browser connects. Always-on SDR.","Pi comme serveur radiodéfini par logiciel (SDR) dédié et permanent. Exécute GNU Radio et diffuse les données IQ sur le réseau. Tout navigateur se connecte.","Pi كخادم راديو معرّف بالبرمجيات مخصص ودائم التشغيل. يشغل GNU Radio ويبث بيانات IQ عبر الشبكة المحلية. أي متصفح يتصل ويستقبل."],
["pi-war-room","rpi-core","pi-war-room","Pi portable hacking station: Kismet, Aircrack-ng, GNU Radio, rtl_433, dump1090. Browser unifies all tools.","Station de test d'intrusion portable sur Pi : Kismet, Aircrack-ng, GNU Radio, rtl_433, dump1090. Le navigateur unifie tous les outils de cybersécurité.","محطة اختبار اختراق محمولة على Pi: Kismet وAircrack-ng وGNU Radio وrtl_433 وdump1090. المتصفح يوحد جميع أدوات الأمن السيبراني في واجهة واحدة."],
["pi-mesh-node","rpi-core","pi-mesh-node","Pi as Meshtastic/MQTT mesh node with LoRa HAT. Off-grid messaging. Browser dashboard for mesh visualization.","Pi comme nœud de réseau maillé Meshtastic/MQTT avec module LoRa. Messagerie hors réseau à longue portée avec tableau de bord de visualisation du maillage.","Pi كعقدة شبكة Meshtastic/MQTT مع وحدة LoRa. مراسلة خارج نطاق الإنترنت لمسافات طويلة. لوحة تحكم في المتصفح لتصور بنية الشبكة الشبكية."],
["pi-radio-recorder","rpi-core","pi-radio-recorder","Pi records spectrum 24/7 on schedule: FT8 at dawn, ADS-B by day, meteors at night. Browser archive.","Pi enregistre le spectre selon un planning : FT8 à l'aube, ADS-B en journée, météores la nuit. Archive consultable et navigable dans le temps via le navigateur.","Pi يسجل الطيف الراديوي وفق جدول زمني: FT8 عند الفجر وADS-B نهاراً وشهب ليلاً. أرشيف متصفح قابل للبحث والتصفح عبر الزمن."],
["pi-packet-bbs","rpi-core","pi-packet-bbs","Pi runs packet radio BBS via HackRF. AX.25 connections. 1980s ham radio internet relived.","Pi gère un BBS radio par paquets via HackRF avec le protocole AX.25. Revivez l'Internet radioamateur des années 80 avec une technologie moderne.","Pi يشغل نظام لوحة إعلانات (BBS) لراديو الحزم عبر HackRF ببروتوكول AX.25. أعد إحياء إنترنت الراديو الهاوي كما كان في الثمانينات."],
["pi-repeater","rpi-core","pi-repeater","Pi + HackRF as software-defined repeater. CTCSS/DCS, courtesy tones, timeout timer. Full repeater in software.","Pi + HackRF comme répéteur radiodéfini par logiciel : tonalités CTCSS/DCS, signaux de courtoisie et temporisateur de transmission. Répéteur complet logiciel.","Pi + HackRF كمكرر إشارة برمجي متكامل: نغمات CTCSS/DCS ونغمات مجاملة ومؤقت انتهاء الإرسال. نظام مكرر راديوي كامل بالبرمجيات."],
["pi-igate-digi","rpi-core","pi-igate-digipeater","Pi as combined APRS iGate + digipeater. Receive, relay, internet-gateway. Run real ham infrastructure.","Pi comme passerelle Internet (iGate) et digipéter APRS combinés. Relayez les paquets et connectez-les au réseau mondial. Infrastructure radioamateur réelle.","Pi كبوابة إنترنت iGate ومكرر رقمي لنظام APRS مجتمعين. استقبل وأعد إرسال الحزم وأوصلها بالإنترنت. بنية تحتية حقيقية لراديو الهواة."],
["pi-camera-trap","rpi-core","pi-camera-trap","Pi camera + motion detection + IR. Encrypted photos, local storage, browser dashboard. Night vision spy cam.","Caméra Pi avec détection de mouvement et infrarouge pour vision nocturne. Photos chiffrées en stockage local et tableau de bord sécurisé dans le navigateur.","كاميرا Pi مع كشف حركة وأشعة تحت حمراء للرؤية الليلية. صور مشفرة بتخزين محلي ولوحة تحكم في المتصفح. كاميرا مراقبة سرية."],
["pi-kiosk","rpi-core","pi-kiosk","Pi touchscreen dashboard: waterfall, APRS map, aircraft radar, weather sat — all simultaneous. Wall-mounted RF observatory.","Pi avec écran tactile : cascade spectrale, carte APRS, radar aérien et images satellite météo — tout simultanément. Observatoire RF mural permanent.","لوحة شاشة لمس Pi: عرض شلالي وخريطة APRS ورادار طيران وصور أقمار الطقس — كلها متزامنة. مرصد ترددات راديوية جداري دائم التشغيل."],
["pi-tor-router","rpi-core","pi-tor-router","Pi as transparent Tor proxy. All devices on its WiFi routed through Tor. Circuit visualization. Portable anonymity.","Pi comme proxy Tor transparent : tous les appareils connectés à son WiFi sont routés automatiquement via Tor. Visualisez les circuits. Anonymat portable.","Pi كوكيل Tor شفاف: جميع الأجهزة المتصلة بشبكة WiFi الخاصة به تُوجَّه تلقائياً عبر شبكة Tor. تصور دارات التوجيه بصرياً. إخفاء هوية محمول."],
["pi-vpn-gateway","rpi-core","pi-vpn-gateway","Pi as WireGuard VPN server/client. Browser management. Secure all devices through one point.","Pi comme serveur et client VPN WireGuard ultra-rapide. Interface de gestion dans le navigateur. Sécurisez tous vos appareils via un tunnel chiffré unique.","Pi كخادم وعميل VPN ببروتوكول WireGuard السريع. إدارة كاملة من المتصفح. أمّن جميع أجهزتك عبر نفق مشفر واحد من نقطة مركزية."],
["pi-honeypot-server","rpi-core","pi-honeypot-server","Full honeypot: fake SSH, HTTP, FTP, SMTP, DNS. Browser shows attack viz, geoIP, credential attempts.","Pot de miel complet : services SSH, HTTP, FTP, SMTP et DNS factices. Le navigateur visualise les attaques en temps réel avec géolocalisation des assaillants.","مصيدة أمنية كاملة: خدمات SSH وHTTP وFTP وSMTP وDNS مزيفة. المتصفح يعرض تصوراً بصرياً للهجمات وتحديد الموقع الجغرافي ومحاولات الدخول."],
["pi-nas-vault","rpi-core","pi-nas-vault","Encrypted NAS: AES-256 at rest, hardware key (micro:bit/NFC) to unlock. Browser file manager.","Serveur NAS chiffré AES-256 au repos. Déverrouillage par clé matérielle micro:bit ou NFC. Gestionnaire de fichiers sécurisé intégré au navigateur.","خادم تخزين شبكي (NAS) مشفر بـ AES-256 أثناء السكون. مفتاح مادي (micro:bit أو NFC) لفك القفل. مدير ملفات آمن في المتصفح."],
["pi-print-server","rpi-core","pi-print-server","Pi thermal printer: print decoded messages, QSL cards, mission briefs, network reports. Tangible output.","Imprimante thermique connectée au Pi : imprimez messages décodés, cartes QSL, briefings de mission et rapports réseau. Des résultats tangibles et immédiats.","طابعة حرارية متصلة بـ Pi: اطبع الرسائل المفكّكة وبطاقات QSL وملخصات المهمات وتقارير الشبكة. مخرجات ورقية ملموسة من عالمك الرقمي."],
["pi-clock-station","rpi-core","pi-clock-station","GPS-disciplined NTP server on Pi. Nanosecond-accurate time for TDOA, coherent SDR, timestamp correlation.","Serveur NTP de stratum 1 discipliné par GPS sur Pi. Précision nanoseconde indispensable pour le TDOA, le SDR cohérent et la corrélation temporelle.","خادم توقيت NTP منضبط بـ GPS على Pi. وقت بدقة النانو ثانية ضروري لتطبيقات فرق وقت الوصول (TDOA) والراديو المتماسك وربط الطوابع الزمنية."],

// SECRET AGENT — Field Gear
["dead-drop-pi","agt-field","dead-drop-pi","Pi hidden in everyday object. Creates WiFi AP on schedule. Agents exchange encrypted files. Timer-activated, auto-wipes.","Pi dissimulé dans un objet anodin. Crée un point d'accès WiFi programmé pour l'échange de fichiers chiffrés entre agents. Auto-effacement après la mission.","Pi مخفي داخل غرض يومي عادي. ينشئ نقطة وصول WiFi مؤقتة وفق جدول زمني. العملاء يتبادلون ملفات مشفرة. يمسح البيانات تلقائياً بعد الاستخدام."],
["covert-radio","agt-field","covert-radio","Pi + HackRF disguised. Scheduled burst transmissions: compress, encrypt, transmit in <1s. Virtually undetectable.","Pi + HackRF camouflés. Transmissions furtives en rafale : compression, chiffrement et émission en moins d'une seconde. Quasi indétectable à l'analyse spectrale.","Pi + HackRF متنكران في غطاء عادي. إرسالات دفقية مجدولة: ضغط وتشفير وبث في أقل من ثانية واحدة. شبه مستحيل الكشف بالتحليل الطيفي."],
["field-comms-kit","agt-field","field-comms-kit","Pi mesh + HackRF long-range + micro:bit panic + ESP32 beacon. All in backpack. Browser is mission control.","Kit de communication terrain : réseau maillé Pi, HackRF longue portée, bouton panique micro:bit et balise ESP32. Tout dans un sac à dos. Le navigateur est votre QG.","طقم اتصالات ميداني: شبكة Pi شبكية + HackRF بعيد المدى + زر ذعر micro:bit + منارة ESP32. كله في حقيبة ظهر. المتصفح مركز قيادة المهمة."],
["spy-pi-zero","agt-field","spy-pi-zero","Pi Zero as USB device: appears as keyboard + network adapter. Exfiltrates data to encrypted storage. Teaches USB attacks.","Pi Zero déguisé en périphérique USB : apparaît comme clavier et adaptateur réseau simultanément. Exfiltration vers stockage chiffré. Apprentissage des attaques USB.","Pi Zero يتظاهر كجهاز USB: يظهر كلوحة مفاتيح ومحول شبكة في آن واحد. ينسخ البيانات إلى تخزين مشفر. تعلم تقنيات هجمات USB تعليمياً."],
["pi-surveillance-drone","agt-field","pi-surveillance-drone","Pi Zero + camera + ESP32 WiFi downlink. Mount on RC car/drone. Live feed with GPS overlay. Mobile recon.","Pi Zero + caméra + liaison WiFi ESP32. Montez sur voiture RC ou drone. Flux vidéo en direct avec superposition GPS pour reconnaissance mobile furtive.","Pi Zero + كاميرا + وصلة WiFi عبر ESP32. ركّبه على سيارة تحكم عن بُعد أو طائرة مسيّرة. بث فيديو مباشر مع تراكب GPS. استطلاع ميداني متنقل."],
["counter-surveillance-kit","agt-field","counter-surveillance-kit","Pi scans RF (HackRF), WiFi, BLE, cameras simultaneously. Unified dashboard flags anomalies. Professional bug sweep.","Pi scanne RF (HackRF), WiFi, BLE et caméras cachées simultanément. Tableau de bord unifié signalant toute anomalie. Balayage anti-surveillance professionnel.","Pi يمسح الترددات الراديوية وWiFi وBLE والكاميرات في آن واحد. لوحة تحكم موحدة تُعلّم أي شذوذ. طقم مكافحة تنصت ومسح أمني احترافي."],
["pi-faraday-test","agt-field","pi-faraday-test","Build Faraday bags/boxes, test with HackRF inside. Pi measures signal leakage. Grade your shielding.","Construisez des cages de Faraday (sacs et boîtes), testez leur efficacité avec HackRF à l'intérieur. Pi mesure les fuites et note la qualité du blindage.","ابنِ أكياس وصناديق فاراداي للعزل الكهرومغناطيسي واختبرها مع HackRF بالداخل. Pi يقيس مقدار تسرب الإشارة ويعطي تقييماً لجودة الدرع."],
["agent-communicator","agt-field","agent-communicator","Pi runs numbers station: TTS reads encrypted sequences on HF via HackRF. Agents decode with one-time pads.","Pi opère une station de nombres : la synthèse vocale lit des séquences chiffrées en ondes courtes via HackRF. Déchiffrement par carnet à usage unique (OTP).","Pi يشغل محطة أرقام سرية: محرك تحويل النص للكلام يقرأ تسلسلات مشفرة على موجات HF عبر HackRF. العملاء يفكون التشفير بدفاتر الاستخدام الواحد."],
["burst-transmitter","agt-field","burst-transmitter","Record voice, compress to 0.5s, encrypt, burst-transmit. Second Pi captures, decrypts, plays. Cold War tech.","Enregistrez la voix, compressez à 0.5s, chiffrez et transmettez en rafale ultra-rapide. Un second Pi capture et déchiffre. Technologie d'espionnage Guerre Froide.","سجل الصوت واضغطه إلى 0.5 ثانية وشفّره وأرسله دفعة واحدة فائقة السرعة. Pi ثانٍ يلتقط الدفقة ويفك تشفيرها ويشغلها. تقنية الحرب الباردة."],
["stealth-ap","agt-field","stealth-ap","Pi invisible WiFi AP: hidden SSID + MAC rotation + time-limited windows. Only agents with exact SSID connect.","Point d'accès WiFi furtif Pi : SSID masqué, rotation d'adresse MAC et fenêtres de connexion limitées dans le temps. Seuls les agents munis du nom exact se connectent.","Pi كنقطة وصول WiFi خفية: اسم شبكة مخفي (SSID) مع تدوير عنوان MAC ونوافذ اتصال زمنية محدودة. فقط العملاء بالاسم الدقيق يتصلون."],
["signal-intercept-station","agt-field","signal-intercept-station","Pi + HackRF + WiFi + RTL-SDR. All bands simultaneously. Browser correlates events across frequencies.","Station d'interception de signaux : Pi + HackRF + WiFi + RTL-SDR couvrant toutes les bandes simultanément. Le navigateur corrèle les événements inter-fréquences.","محطة اعتراض إشارات: Pi + HackRF + WiFi + RTL-SDR. مراقبة جميع النطاقات في آن واحد. المتصفح يربط الأحداث ويحلل الترابط عبر الترددات."],
["pi-lockpick-trainer","agt-field","pi-lockpick-trainer","Pi camera watches lockpick practice on transparent locks. CV scores technique, tracks progress.","Caméra Pi observe l'entraînement au crochetage sur serrures transparentes. La vision par ordinateur évalue la technique et suit la progression de l'apprenti.","كاميرا Pi تراقب تدريب فتح الأقفال الشفافة. الرؤية الحاسوبية تقيّم التقنية وتسجل النقاط وتتتبع تقدم المتدرب عبر الجلسات."],

["wrist-communicator","agt-mb","wrist-communicator","micro:bit on wrist: tap patterns send coded messages to Pi base. Vibration feedback. No screen needed.","micro:bit au poignet : tapotez des motifs rythmiques pour envoyer des messages codés à la base Pi. Retour haptique par vibration, aucun écran nécessaire.","micro:bit مربوط على المعصم: انقر أنماط إيقاعية لإرسال رسائل مشفرة إلى قاعدة Pi. ملاحظات بالاهتزاز فقط. لا حاجة لأي شاشة مرئية."],
["dead-man-switch","agt-mb","dead-man-switch","micro:bit monitors movement. Stop moving X seconds (agent down) = Pi triggers alert, GPS location, evidence wipe.","micro:bit surveille le mouvement en continu. Immobilité prolongée (agent à terre) déclenche alerte Pi, envoi de position GPS et effacement des données sensibles.","micro:bit يراقب حركة العميل باستمرار. التوقف عن الحركة لثوانٍ محددة (عميل سقط) يُفعّل تنبيه Pi فوراً مع إرسال موقع GPS ومسح الأدلة."],
["invisible-fence","agt-mb","invisible-fence","micro:bits as perimeter sensors (light, sound, magnetic). Pi maps breaches in real time. Invisible security.","micro:bits déployés comme capteurs de périmètre (lumière, son, magnétisme). Pi cartographie les intrusions en temps réel. Clôture de sécurité totalement invisible.","أجهزة micro:bit كمستشعرات محيطية (ضوء وصوت ومغناطيسية). Pi يرسم خريطة الاختراقات مباشرة في الزمن الحقيقي. سياج أمني غير مرئي تماماً."],
["micro-beacon-trail","agt-mb","micro-beacon-trail","Plant micro:bits along route broadcasting BLE breadcrumbs. Agents follow trail using Pi scanner.","Plantez des micro:bits le long d'un itinéraire, chacun diffusant des miettes BLE balisées. Les agents suivent le sentier numérique avec un scanner Pi portatif.","ازرع أجهزة micro:bit على طول المسار لتبث فتات خبز رقمية عبر BLE. العملاء يتبعون أثر الإشارات باستخدام ماسح Pi للوصول إلى الهدف."],
["extraction-signal","agt-mb","extraction-signal","micro:bit emergency beacon: specific shake activates distress. Pi shows agent location and status. Extraction protocol.","Balise d'urgence micro:bit : un geste de secousse précis active le signal de détresse. Pi affiche la position de l'agent sur la carte. Protocole d'extraction complet.","منارة طوارئ micro:bit: نمط هز محدد يُفعّل إشارة استغاثة فورية. Pi يعرض موقع العميل وحالته على الخريطة. بروتوكول استخراج ميداني كامل."],

["direction-finder-pro","agt-ant","direction-finder-pro","Pi + HackRF + motorized directional antenna. 360° sweep, plot signal strength. Find any transmitter or camera.","Pi + HackRF + antenne directionnelle motorisée. Balayage panoramique 360° et cartographie de puissance du signal. Localisez tout émetteur ou caméra cachée.","Pi + HackRF + هوائي اتجاهي آلي بمحرك. مسح بانورامي 360 درجة مع رسم بياني لقوة الإشارة. حدد موقع أي مرسل مخفي أو كاميرا مراقبة."],
["covert-antenna","agt-ant","covert-antenna","Antennas disguised as objects: ruler Yagi, clothesline dipole, umbrella loop, window patch. Test with HackRF.","Antennes furtives déguisées en objets courants : Yagi-règle, dipôle-corde à linge, boucle-parapluie et patch-fenêtre. Testez chaque camouflage avec HackRF.","هوائيات سرية متنكرة في أغراض يومية: ياغي من مسطرة ودايبول من حبل غسيل وحلقة من مظلة ورقعة على نافذة. اختبر أداء كل منها بـ HackRF."],
["antenna-in-a-bag","agt-ant","antenna-in-a-bag","Deployable kit: Pi auto-detects antenna, recommends band, auto-tunes. Backpack to operational in 60 seconds.","Kit antenne déployable en 60 secondes : Pi détecte automatiquement l'antenne connectée, recommande la bande optimale et auto-accorde. Du sac à dos au terrain.","طقم هوائي قابل للنشر السريع: Pi يكتشف الهوائي المتصل تلقائياً ويوصي بأفضل نطاق ويوالف ذاتياً. من حقيبة الظهر إلى التشغيل في 60 ثانية."],
["rf-perimeter","agt-ant","rf-perimeter","Multiple directional antennas on Pi + HackRF. Monitor all directions. Alert on new transmitters with bearing.","Périmètre RF avec antennes directionnelles multiples sur Pi + HackRF. Surveillance omnidirectionnelle permanente et alerte instantanée avec azimut précis.","هوائيات اتجاهية متعددة متصلة بـ Pi + HackRF. راقب جميع الاتجاهات في آن واحد. تنبيه فوري عند ظهور مرسل جديد مع تحديد السمت بدقة."],
["satellite-comms-station","agt-ant","satellite-comms-station","Pi + HackRF + auto-tracking antenna. Amateur sats, weather images, ISS — all automated. Portable ground station.","Pi + HackRF + antenne à poursuite automatique : recevez satellites amateurs, images météo et ISS sans intervention. Station sol portable entièrement autonome.","Pi + HackRF + هوائي بتتبع تلقائي للأقمار الصناعية. استقبل أقمار الهواة وصور الطقس ومحطة الفضاء الدولية آلياً. محطة أرضية ميدانية محمولة."],
